<!DOCTYPE html>

<head>

<title>Semana 5 · Dia 3</title>

<script src="../../assets/curso.js"></script>
<script>
Curso.montar({
semana:5,
dia:3,
titulo:"Do you walk to school?",
subtitulo:"Contar o que você e a sua família fazem, dizer o que NÃO fazem e perguntar",
objetivos:[
  "Falar da rotina com I, you e we",
  "Dizer o que você não faz: I don't watch TV.",
  "Perguntar e responder: Do you walk to school? Yes, I do."
],
blocos:[

{tipo:"nota", titulo:"💡 A regra mais fácil do inglês",
 html:"<p>Você já fala a rotina com <code>I</code>: <code>I get up</code>, <code>I go to school</code>. Hoje vem a boa notícia: com <b>you</b> (você) e <b>we</b> (nós), a ação <b>não muda nada</b>.</p>"+
 "<p>Em português o verbo muda o tempo todo (eu acordo, nós acordamos). Em inglês, com I, you e we, é sempre <code>wake up</code>. 🎉</p>"+
 "<p>Hoje você aprende também a dizer o que <b>não</b> faz e a <b>perguntar</b> sobre o dia de alguém.</p>"},

{tipo:"gramatica", titulo:"I, you, we + a ação (e o don't, e o Do)",
 html:"<p><b>1. Dizer o que faz</b> — a ação fica igual com I, you e we:</p>"+
 "<table><tr><th>Inglês</th><th>Português</th></tr>"+
 "<tr><td><code>I walk to school.</code></td><td>Eu vou a pé para a escola.</td></tr>"+
 "<tr><td><code>You walk to school.</code></td><td>Você vai a pé para a escola.</td></tr>"+
 "<tr><td><code>We walk to school.</code></td><td>Nós vamos a pé para a escola.</td></tr></table>"+
 "<p><b>2. Dizer o que NÃO faz</b> — ponha <code>don't</code> antes da ação (<code>don't</code> = <code>do not</code>):</p>"+
 "<table><tr><th>Inglês</th><th>Português</th></tr>"+
 "<tr><td><code>I don't take the bus.</code></td><td>Eu não pego o ônibus.</td></tr>"+
 "<tr><td><code>We don't watch TV in the morning.</code></td><td>Nós não vemos TV de manhã.</td></tr></table>"+
 "<p><b>3. Perguntar</b> — ponha <code>Do</code> no começo. A resposta curta repete o do:</p>"+
 "<table><tr><th>Inglês</th><th>Português</th></tr>"+
 "<tr><td><code>Do you walk to school?</code></td><td>Você vai a pé para a escola?</td></tr>"+
 "<tr><td><code>Yes, I do.</code></td><td>Sim, vou.</td></tr>"+
 "<tr><td><code>No, I don't.</code></td><td>Não, não vou.</td></tr>"+
 "<tr><td><code>What time do you get up?</code></td><td>A que horas você se levanta?</td></tr></table>"+
 "<p>O <code>do</code> da pergunta não quer dizer nada sozinho: é só um aviso de que vem uma pergunta. Cuidado: <i>Are you walk…?</i> está errado. Com ação, é <code>Do you…?</code> 💜</p>",
 exemplos:[
  {en:"We have breakfast at seven.", pt:"Nós tomamos café da manhã às sete."},
  {en:"I don't drink milk.", pt:"Eu não bebo leite."},
  {en:"Do you take the bus?", pt:"Você pega o ônibus?"},
  {en:"Yes, I do.", pt:"Sim, pego."},
  {en:"No, I don't. I walk.", pt:"Não. Eu vou a pé."},
  {en:"What time do you go to bed?", pt:"A que horas você vai para a cama?"}
 ]},

{tipo:"vocab", titulo:"Como você vai e o que você come", itens:[
 {en:"walk", pt:"andar, ir a pé", ipa:"/UÓK/", emoji:"🚶"},
 {en:"bus", pt:"ônibus", ipa:"/BÂS/", emoji:"🚌"},
 {en:"take the bus", pt:"pegar o ônibus", ipa:"/TÊIK dhe BÂS/", emoji:"🚏"},
 {en:"car", pt:"carro", ipa:"/KÁR/", emoji:"🚗"},
 {en:"park", pt:"parque", ipa:"/PÁRK/", emoji:"🌳"},
 {en:"eat", pt:"comer", ipa:"/ÍIT/", emoji:"🍴"},
 {en:"drink", pt:"beber", ipa:"/DRÍNK/", emoji:"🥤"},
 {en:"milk", pt:"leite", ipa:"/MÍLK/", emoji:"🥛"},
 {en:"bread", pt:"pão", ipa:"/BRÉD/", emoji:"🍞"}
]},

{tipo:"historia", titulo:"Ouça: a segunda-feira do Ben", cena:"rotina", paragrafos:[
 {en:"Hi! I'm Ben. I'm twelve years old.", pt:"Oi! Eu sou o Ben. Eu tenho doze anos."},
 {en:"From Monday to Friday, I get up at seven. We have breakfast at seven thirty.", pt:"De segunda a sexta, eu me levanto às sete. Nós tomamos café da manhã às sete e meia."},
 {en:"My dad and I eat bread. We drink milk.", pt:"Meu pai e eu comemos pão. Nós bebemos leite."},
 {en:"We don't take the bus. We walk to school.", pt:"Nós não pegamos o ônibus. Nós vamos a pé para a escola."},
 {en:"Today, I wake up at seven. I get dressed and I take my backpack.", pt:"Hoje, eu acordo às sete. Eu me visto e pego a minha mochila."},
 {en:"Dad is in the kitchen. “Dad! It's seven thirty! We're late!”", pt:"O papai está na cozinha. “Pai! São sete e meia! Estamos atrasados!”"},
 {en:"Dad says: “Ben, what day is it today?” “It's... Saturday!”", pt:"O papai diz: “Ben, que dia é hoje?” “É... sábado!”"},
 {en:"No school today! We don't walk to school. We go to the park!", pt:"Hoje não tem escola! Nós não vamos a pé para a escola. Nós vamos ao parque!"}
]},

{tipo:"quiz", titulo:"Você entendeu a história?", questoes:[
 {pergunta:"How old is Ben?", opcoes:["Eleven","Twelve","Twenty"], correta:1,
  explicacao:"Ele começa: I'm twelve years old."},
 {pergunta:"What do Ben and his dad eat?", opcoes:["Bread","Cake","Lunch"], correta:0,
  explicacao:"My dad and I eat bread. E bebem leite (milk)."},
 {pergunta:"How do they go to school?", opcoes:["They take the bus.","They walk.","They go by car."], correta:1,
  explicacao:"We don't take the bus. We walk to school."},
 {pergunta:"Where is Dad today?", opcoes:["In the kitchen","At school","In the park"], correta:0,
  explicacao:"Dad is in the kitchen. O Ben corre até lá, achando que está atrasado."},
 {pergunta:"What day is it today?", opcoes:["Monday","Friday","Saturday"], correta:2,
  explicacao:"O pai pergunta What day is it today? e o Ben descobre: It's Saturday!"},
 {pergunta:"Where do Ben and his dad go today?", opcoes:["To school","To the park","To bed"], correta:1,
  explicacao:"No school today! We go to the park!"}
]},

{tipo:"ditado", titulo:"Escute e escreva as frases da história", itens:[
 {en:"We drink milk", pt:"Nós bebemos leite.", dica:"(três palavras)"},
 {en:"We walk to school", pt:"Nós vamos a pé para a escola.", dica:"(quatro palavras)"},
 {en:"We're late", pt:"Estamos atrasados.", dica:"(we're + uma palavra)"},
 {en:"We go to the park", pt:"Nós vamos ao parque.", dica:"(cinco palavras)"}
]},

{tipo:"escrita", titulo:"Responda como se você fosse o Ben", id:"escuta",
 instrucao:"Imagine que você é o Ben. Responda em inglês, com <b>I</b> ou <b>We</b>:<br>1. What time do you get up from Monday to Friday? (A que horas você se levanta de segunda a sexta?)<br>2. Do you take the bus? (Você pega o ônibus?)<br>3. What day is it today? (Que dia é hoje?)<br>4. Where do you go today? (Aonde vocês vão hoje?)",
 dica:"<ul><li>responda como o Ben, com <b>I</b> ou <b>We</b></li><li>na 2, comece com <b>Yes, I do</b> ou <b>No, I don't</b> e diga como ele vai</li><li>uma frase completa para cada pergunta</li></ul>",
 andaime:"<p>I get up at <span class=\"lacuna\">?</span>. · No, I <span class=\"lacuna\">?</span>. We <span class=\"lacuna\">?</span>. · It's <span class=\"lacuna\">?</span>. · We go to <span class=\"lacuna\">?</span>.</p>",
 gabarito:"1. I get up at seven. 2. No, I don't. We walk to school. 3. It's Saturday. 4. We go to the park.",
 instrucaoIA:"Ela ouviu a história do Ben, que de segunda a sexta se levanta às sete, vai a pé para a escola com o pai, e hoje se apronta correndo, mas é sábado e eles vão ao parque. Ela devia responder como se fosse o Ben, com I ou we: a que horas se levanta (I get up at seven), se pega o ônibus (No, I don't. We walk to school.), que dia é hoje (It's Saturday) e aonde vão (We go to the park). Vocabulário: present simple com I/we, don't, Yes, I do / No, I don't, walk, take the bus, park, dias da semana."},

{tipo:"completar", titulo:"Do, don't ou a ação?", ajuda:"Toque na palavra que falta.", itens:[
 {frase:"___ you walk to school? Yes, I do.", pt:"Você vai a pé para a escola? Sim, vou.", resposta:"Do",
  opcoes:["Do","Are","Is"], explicacao:"Pergunta com ação começa com Do: Do you walk...?"},
 {frase:"No, I ___. I take the bus.", pt:"Não, não vou. Eu pego o ônibus.", resposta:"don't",
  opcoes:["don't","am not","not"], explicacao:"A resposta curta repete o do: No, I don't."},
 {frase:"We ___ breakfast at seven.", pt:"Nós tomamos café da manhã às sete.", resposta:"have",
  opcoes:["have","has","are"], explicacao:"Com we, a ação fica igual: we have."},
 {frase:"I ___ watch TV in the morning. I read.", pt:"Eu não vejo TV de manhã. Eu leio.", resposta:"don't",
  opcoes:["don't","not","no"], explicacao:"Para dizer que não faz: don't antes da ação."},
 {frase:"Do you drink milk? Yes, I ___.", pt:"Você bebe leite? Sim, bebo.", resposta:"do",
  opcoes:["do","am","don't"], explicacao:"Resposta curta do sim: Yes, I do."},
 {frase:"What time ___ you go to bed?", pt:"A que horas você vai para a cama?", resposta:"do",
  opcoes:["do","are","is"], explicacao:"What time + do you + a ação."}
]},

{tipo:"ordenar", titulo:"Monte as frases", itens:[
 {frase:"Do you walk to school", pt:"Você vai a pé para a escola?"},
 {frase:"We have breakfast at seven", pt:"Nós tomamos café da manhã às sete."},
 {frase:"I don't take the bus", pt:"Eu não pego o ônibus."},
 {frase:"We go to the park on Saturday", pt:"Nós vamos ao parque no sábado."}
]},

{tipo:"adivinha", titulo:"O que é? Escreva a resposta", itens:[
 {pistas:["It is big and yellow.","Many children are in it.","I take it to school."],
  resposta:"bus", pt:"ônibus", dica:"(um jeito de ir para a escola)"},
 {pistas:["I drink it.","It is white.","I drink it at breakfast."],
  resposta:"milk", pt:"leite", dica:"(uma bebida)"},
 {pistas:["It has numbers.","It is round.","What time is it? Look at it!"],
  resposta:"clock", pt:"relógio", dica:"(uma coisa da casa)"},
 {pistas:["It is a time.","It is twelve o'clock.","It is not midnight."],
  resposta:"noon", pt:"meio-dia", dica:"(uma hora do dia)"}
]},

{tipo:"missao", titulo:"Missão: quem comeu o pão?", cena:"misterio",
 cenario:"<p>Recreio. O lanche da Miss Kate sumiu da cozinha da escola: o <b>pão e o leite</b>! Você é a detetive, e o Ben é o suspeito número um. Pergunte o que ele faz de manhã e descubra se foi ele. O Ben <b>só entende inglês</b>.</p>",
 personagem:"Ben, colega de turma, nervoso e com cara de culpado",
 objetivos:["perguntar ao Ben se ele come pão ou bebe leite de manhã (Do you ...?)","perguntar a que horas ele toma café da manhã (What time do you ...?)","dizer no fim se foi o Ben ou não (It's you! / It's not you!)"],
 andaime:"<p>Se travar: <span class=\"lacuna\">Do you eat</span> …? · <span class=\"lacuna\">What time do you</span> …? · <span class=\"lacuna\">It's</span> … you!</p>",
 instrucaoIA:"Ela sabe: present simple com I, you e we, don't, Do you...? Yes, I do. / No, I don't. What time do you...? a rotina (wake up, get up, have breakfast, go to school, have lunch, eat, drink), as horas (at seven, seven thirty, o'clock, noon), in the morning, at night, walk, take the bus, milk, bread, kitchen, Me too! Not me. Really? Fatos do Ben: ele toma café da manhã em casa às sete e meia, com o pai: come pão e bebe leite; vai a pé para a escola; não come nada na escola de manhã. Ben fica nervoso e se atrapalha (Bread? Me? No... yes! I eat bread!), mas explica: at home, at seven thirty, with my dad. Se ela perguntar se ele come na escola, ele nega: I don't eat at school! Quando ela disser se foi ele ou não, ele dá a pista final: A dog! I see a dog in the kitchen! Frases de 3 a 6 palavras. Cena de até 8 falas."},

{tipo:"escrita", titulo:"Escrita livre: o sábado do Ben", id:"1",
 instrucao:"Invente o resto do sábado do Ben! Escreva <b>4 ou 5 frases</b> como se você fosse o Ben, contando o que ele e o pai fazem no parque e depois, até a hora de dormir.",
 dica:"<ul><li>escreva como o Ben, com <b>I</b> e <b>We</b></li><li>pelo menos duas horas com <b>at</b></li><li>uma frase com <b>don't</b> (algo que eles não fazem no sábado)</li><li>um final para o dia: o que eles fazem de noite?</li><li>vale inventar coisas engraçadas! 😄</li></ul>",
 gabarito:"4 ou 5 frases criativas na voz do Ben (I / We), sobre o sábado no parque e o resto do dia: pelo menos duas ações com at + hora (We play in the park at nine. We have lunch at noon.), uma frase negativa com don't (We don't do homework today!), e uma frase sobre a noite (At night, I read / we watch TV / I go to bed at ...). Ações na forma simples, sem -s, com I e we.",
 instrucaoIA:"Escrita livre e criativa: ela devia continuar a história do Ben (que achou que era segunda, mas era sábado, e foi ao parque com o pai), escrevendo 4 ou 5 frases como se fosse o Ben, com I e we. Vocabulário da aula: present simple com I/you/we, don't, Do you...?, walk, take the bus, car, park, eat, drink, milk, bread; e da semana: a rotina (get up, have lunch, play, watch TV, read, have dinner, go to bed), at + hora, o'clock, thirty, noon, in the morning, in the afternoon, at night. Elogie a criatividade primeiro. Confira: ação sem -s com I e we, don't antes da ação, at antes da hora."},

{tipo:"fala", titulo:"Hora de falar",
 instrucao:"Ouça, repita em voz alta e teste no 🎤. Depois converse com a IA.",
 foco:"o <b>at</b> gruda na palavra seguinte: <i>at eight</i> soa <b>a-teight</b>. E o <b>don't</b> tem o T quase mudo no fim: <i>I don't walk</i> soa <b>ai dôun uók</b>.",
 frases:[
  {en:"Do you walk to school?", pt:"Você vai a pé para a escola?"},
  {en:"Yes, I do.", pt:"Sim, vou."},
  {en:"No, I don't. I take the bus.", pt:"Não. Eu pego o ônibus."},
  {en:"We have breakfast at eight.", pt:"Nós tomamos café da manhã às oito."},
  {en:"I don't drink milk.", pt:"Eu não bebo leite."},
  {en:"What time do you go to bed?", pt:"A que horas você vai para a cama?"}
 ],
 instrucaoIA:"Primeiro peça para ela repetir as frases acima e corrija a pronúncia em português, com atenção ao at grudado (at eight = a-teight) e ao don't com o T quase mudo. Depois faça 4 a 6 perguntas em inglês, uma de cada vez, e espere ela responder falando, de preferência com Yes, I do / No, I don't e mais uma frase: Do you walk to school? · Do you take the bus? · Do you drink milk at breakfast? · What time do you have breakfast? · Do you and your family have dinner at night? · What do you do on Saturday? Corrija com carinho, em português, e elogie o que saiu bem."},

{tipo:"ligar", bonus:true, titulo:"Pares que confundem", pares:[
 {en:"walk", pt:"ir a pé"},
 {en:"watch", pt:"assistir"},
 {en:"wake up", pt:"acordar"},
 {en:"take", pt:"pegar"},
 {en:"eat", pt:"comer"},
 {en:"early", pt:"cedo"},
 {en:"bread", pt:"pão"},
 {en:"bed", pt:"cama"}
]},
{tipo:"escrita", bonus:true, titulo:"Desafio: o dia de um robô", id:"bonus",
 instrucao:"Invente o dia do robô Bip, como se ele mesmo contasse: <b>4 ou 5 frases</b> com <b>I</b>. Um robô faz coisas estranhas!",
 dica:"<ul><li>escreva como o Bip, com <b>I</b></li><li>pelo menos duas horas com <b>at</b></li><li>uma frase com <b>don't</b></li><li>pelo menos uma coisa bem estranha (café da manhã à meia-noite?)</li></ul>",
 gabarito:"4 ou 5 frases criativas com I + ação, pelo menos duas com at + hora, uma com don't, e alguma coisa divertida e diferente de uma rotina humana.",
 instrucaoIA:"Desafio bônus de escrita criativa: ela devia inventar o dia do robô Bip, em 4 ou 5 frases com I, com pelo menos duas horas (at + hora) e uma frase com don't. Vocabulário: a rotina da semana, as horas (o'clock, thirty, noon, midnight), in the morning, in the afternoon, at night, eat, drink, milk, bread, walk, take the bus. Elogie a criatividade e corrija no máximo 3 coisas."}

]});
</script>

</html>
