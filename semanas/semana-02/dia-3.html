<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6C4AB6">
<title>Semana 2 · Dia 3</title>
<link rel="stylesheet" href="../../assets/curso.css">
</head>
<body>
<script src="../../assets/config.js"></script>
<script src="../../assets/curso.js"></script>
<script>
Curso.montar({
semana:2,
dia:3,
titulo:"He is my brother",
subtitulo:"Falar de OUTRA pessoa: he / she e o dele / dela (his / her)",
objetivos:[
  "Usar he para ele e she para ela",
  "Dizer de quem é uma coisa com his e her",
  "Descrever as pessoas da família: alta, engraçada, gentil"
],
blocos:[

{tipo:"nota", titulo:"💡 A pegadinha do dia",
 html:"<p>Em português, o \"dele\" e o \"dela\" vêm <b>depois</b> da coisa: <i>o gato <b>dela</b></i>.</p>"+
 "<p>Em inglês eles vêm <b>antes</b>, coladinhos na dona: <code>her cat</code>. Leia de trás para frente e encaixa: <i>cat</i> (gato) <i>her</i> (dela).</p>"+
 "<p>E tem mais uma diferença: em inglês, o que manda é <b>de quem é</b>, não o que é. O gato do Leo é <code>his cat</code>, o cachorro do Leo é <code>his dog</code> — sempre <code>his</code>, porque o dono é ele. 🧠</p>"},

{tipo:"gramatica", titulo:"He is / She is · his / her",
 html:"<p>Na semana passada você falou de você (<code>I am</code>) e com alguém (<code>You are</code>). Agora você vai falar de uma <b>terceira pessoa</b>: aquela que não está na conversa.</p>"+
 "<table>"+
 "<tr><th>Inglês</th><th>Português</th></tr>"+
 "<tr><td><code>He is my brother.</code></td><td>Ele é o meu irmão.</td></tr>"+
 "<tr><td><code>She is my sister.</code></td><td>Ela é a minha irmã.</td></tr>"+
 "<tr><td><code>He is tall.</code></td><td>Ele é alto.</td></tr>"+
 "<tr><td><code>She is not here.</code></td><td>Ela não está aqui.</td></tr>"+
 "</table>"+
 "<p>Com <b>he</b> e <b>she</b> o verbo é sempre <code>is</code>. Não existe <code>he am</code> nem <code>she are</code>. E dá para encurtar: <code>he's</code>, <code>she's</code>.</p>"+
 "<p>Para dizer <b>de quem é</b> uma coisa:</p>"+
 "<table>"+
 "<tr><th>Inglês</th><th>Português</th></tr>"+
 "<tr><td><code>his dog</code></td><td>o cachorro dele</td></tr>"+
 "<tr><td><code>her dog</code></td><td>o cachorro dela</td></tr>"+
 "<tr><td><code>his name</code></td><td>o nome dele</td></tr>"+
 "<tr><td><code>her name</code></td><td>o nome dela</td></tr>"+
 "</table>"+
 "<p>Olhe sempre para o <b>dono</b>: se é um homem ou menino, <code>his</code>; se é uma mulher ou menina, <code>her</code>.</p>",
 exemplos:[
  {en:"He is my father.", pt:"Ele é o meu pai."},
  {en:"She is my grandmother.", pt:"Ela é a minha avó."},
  {en:"His name is Tom.", pt:"O nome dele é Tom."},
  {en:"Her name is Mia.", pt:"O nome dela é Mia."},
  {en:"This is her dog.", pt:"Este é o cachorro dela."},
  {en:"His sister is tall.", pt:"A irmã dele é alta."}
 ]},

{tipo:"vocab", titulo:"Como as pessoas são", itens:[
 {en:"tall", pt:"alta, alto", ipa:"/TÓL/", emoji:"📏"},
 {en:"short", pt:"baixa, baixo", ipa:"/CHÓRT/", emoji:"🐧"},
 {en:"funny", pt:"engraçada, engraçado", ipa:"/FÁ-ni/", emoji:"😄"},
 {en:"kind", pt:"gentil, boazinha", ipa:"/KÁIND/", emoji:"🤗"},
 {en:"little", pt:"pequena, pequenininha", ipa:"/LÍ-tol/", emoji:"🐣"},
 {en:"big", pt:"grande", ipa:"/BÍG/", emoji:"🐘"},
 {en:"favorite", pt:"favorita, favorito", ipa:"/FÊI-vo-rit/", emoji:"⭐"},
 {en:"love", pt:"amar", ipa:"/LÁV/", emoji:"💖"}
]},

{tipo:"historia", titulo:"Ouça: a surpresa da Emma", cena:"surpresa", paragrafos:[
 {en:"Today Emma is at home. She is not happy.", pt:"Hoje a Emma está em casa. Ela não está feliz."},
 {en:"Her mother and her father are at work.", pt:"A mãe dela e o pai dela estão no trabalho."},
 {en:"Emma is with her baby brother Sam. He is hungry.", pt:"A Emma está com o irmãozinho dela, o Sam. Ele está com fome."},
 {en:"Ding dong! A woman is at the door.", pt:"Ding dong! Uma mulher está na porta."},
 {en:"It is Grandma Ruth, from Chicago!", pt:"É a vovó Ruth, de Chicago!"},
 {en:"She is Emma's grandmother. She is short and very funny.", pt:"Ela é a avó da Emma. Ela é baixinha e muito engraçada."},
 {en:"Her dog Rex is big. He is Sam's favorite dog!", pt:"O cachorro dela, o Rex, é grande. Ele é o cachorro favorito do Sam!"},
 {en:"Now Emma is happy. Sam is happy, too!", pt:"Agora a Emma está feliz. O Sam está feliz também!"}
]},

{tipo:"quiz", titulo:"Você entendeu a história?", questoes:[
 {pergunta:"Where is Emma today?", opcoes:["At school","At home","At work"], correta:1,
  explicacao:"A primeira frase diz: Today Emma is at home."},
 {pergunta:"Who is at work?", opcoes:["Her mother and her father","Her grandmother","Her brother"], correta:0,
  explicacao:"Her mother and her father are at work."},
 {pergunta:"Who is Sam?", opcoes:["Emma's baby brother","Emma's cousin","Emma's dog"], correta:0,
  explicacao:"Emma is with her baby brother Sam."},
 {pergunta:"Who is at the door?", opcoes:["Grandma Ruth","Anna","A teacher"], correta:0,
  explicacao:"A woman is at the door — e é a Grandma Ruth."},
 {pergunta:"Where is Grandma Ruth from?", opcoes:["Miami","Chicago","New York"], correta:1,
  explicacao:"It is Grandma Ruth, from Chicago!"},
 {pergunta:"Is Rex a little dog?", opcoes:["Yes, he is little.","No, he is big.","Rex is a cat."], correta:1,
  explicacao:"Her dog Rex is big."}
]},

{tipo:"ditado", titulo:"Escute e escreva frases da história", itens:[
 {en:"She is not happy", pt:"Ela não está feliz.", dica:"(quatro palavras)"},
 {en:"He is hungry", pt:"Ele está com fome.", dica:"(três palavras)"},
 {en:"A woman is at the door", pt:"Uma mulher está na porta.", dica:"(seis palavras)"},
 {en:"Her dog Rex is big", pt:"O cachorro dela, o Rex, é grande.", dica:"(cinco palavras)"}
]},

{tipo:"escrita", titulo:"Responda sobre a história", id:"escuta",
 instrucao:"Responda em inglês, com frases completas:<br>1. Where is Emma? (Onde a Emma está?)<br>2. Who is at the door? (Quem está na porta?)<br>3. Is Rex big or little? (O Rex é grande ou pequeno?)<br>4. Who is Grandma Ruth? (Quem é a vovó Ruth?)",
 dica:"<ul><li>uma frase completa para cada pergunta</li><li>use ele é / ela é para falar das pessoas da história</li><li>na 4, diga de quem ela é avó</li></ul>",
 andaime:"<p>Comece assim: Emma is <span class=\"lacuna\">?</span>. · <span class=\"lacuna\">?</span> is at the door. · Rex is <span class=\"lacuna\">?</span>.</p>",
 gabarito:"1. Emma is at home. 2. Grandma Ruth is at the door. (A woman / Emma's grandmother.) 3. Rex is big. 4. She is Emma's grandmother. She is from Chicago.",
 instrucaoIA:"Ela ouviu uma historia curta e devia responder por escrito: onde a Emma esta (at home), quem esta na porta (a avo dela, Grandma Ruth), se o Rex e grande ou pequeno (big) e quem e a Grandma Ruth (a avo da Emma, de Chicago). Vocabulario: at home, at work, door, grandmother, big, little, short, funny, he is / she is, his / her. Corrija em portugues e elogie o que ela entendeu de ouvido."},

{tipo:"completar", titulo:"Complete com he, she, his ou her", ajuda:"Olhe sempre para quem é o dono.", itens:[
 {frase:"Tom is my brother. ___ is eleven.", pt:"O Tom é o meu irmão. Ele tem onze anos.", resposta:"He",
  opcoes:["He","She","It"], explicacao:"Tom é menino: he."},
 {frase:"Lucy is my sister. ___ is a baby.", pt:"A Lucy é a minha irmã. Ela é um bebê.", resposta:"She",
  opcoes:["He","She","It"], explicacao:"Lucy é menina: she."},
 {frase:"This is Leo. ___ dog is big.", pt:"Este é o Leo. O cachorro dele é grande.", resposta:"His",
  opcoes:["His","Her","She"], explicacao:"O dono é o Leo, um menino: his."},
 {frase:"This is Emma. ___ cat is little.", pt:"Esta é a Emma. O gato dela é pequeno.", resposta:"Her",
  opcoes:["His","Her","He"], explicacao:"A dona é a Emma, uma menina: her."},
 {frase:"My grandmother is very ___.", pt:"A minha avó é muito engraçada.", resposta:"funny",
  opcoes:["funny","tall","short"], explicacao:"funny = engraçada."},
 {frase:"My father is ___. He is not short.", pt:"O meu pai é alto. Ele não é baixo.", resposta:"tall",
  opcoes:["tall","little","kind"], explicacao:"O contrário de short é tall."}
]},

{tipo:"ordenar", titulo:"Monte as frases", itens:[
 {frase:"She is my favorite aunt", pt:"Ela é a minha tia favorita."},
 {frase:"His sister is very tall", pt:"A irmã dele é muito alta."},
 {frase:"Her dog is little and funny", pt:"O cachorro dela é pequeno e engraçado."},
 {frase:"My grandfather is very kind", pt:"O meu avô é muito gentil."}
]},

{tipo:"adivinha", titulo:"O que é? Escreva em inglês", itens:[
 {pistas:["It is a pet.","It is not a dog and not a cat.","It is little and it is not a fish."],
  resposta:"bird", pt:"pássaro", dica:"(um bicho)",
  explicacao:"bird = pássaro. O do Leo se chama Kiwi!"},
 {pistas:["She is in my family.","She is my mother's sister.","She is very funny."],
  resposta:"aunt", pt:"tia", dica:"(uma pessoa da família)",
  explicacao:"A irmã da mãe (ou do pai) é a aunt."},
 {pistas:["You can see your family in it.","It is not big.","It is not a pet and not a box."],
  resposta:"photo", pt:"foto", dica:"(uma coisa)",
  explicacao:"photo = foto."},
 {pistas:["She is my father's mother.","She is short and very kind.","She is not my aunt."],
  resposta:"grandmother", aceita:["grandma"], pt:"avó", dica:"(uma pessoa da família)",
  explicacao:"A mãe do pai é a grandmother — ou grandma, no jeito carinhoso."}
]},

{tipo:"missao", titulo:"Missão: de quem é este cachorro?", cena:"animal",
 cenario:"<p>Tem um cachorro pequeno sozinho no portão da escola, com uma coleira vermelha. O <b>Ben</b> está lá do lado e também não sabe de quem é.</p><p>O Ben <b>só entende inglês</b>. Descubram juntos de quem é o cachorro!</p>",
 personagem:"Ben, 11 anos, colega da escola, calmo e prestativo",
 objetivos:["perguntar ao Ben se o cachorro é dele","descobrir de quem é o cachorro, usando his ou her para confirmar","dizer como o cachorro é (grande, pequeno, engraçado)"],
 andaime:"<p>Se travar: <span class=\"lacuna\">Is this your</span> …? · <span class=\"lacuna\">Is it his or</span> …? · <span class=\"lacuna\">He is very</span> …</p>",
 instrucaoIA:"Ela sabe: he is / she is, his / her, family, mother, father, sister, brother, cousin, grandmother, aunt, uncle, dog, cat, bird, pet, photo, tall, short, funny, kind, little, big, favorite, love, This is / These are, plural com -s, numeros ate 20, e a semana 1. O cachorro e da MIA, a prima do Leo (uma menina) — o nome do cachorro e Bob. Ben nao conta de uma vez: primeiro diz No, it is not my dog, depois dá pistas curtas (It is not a boy's dog. / Mia is Leo's cousin.) e responde yes/no. Frases de 3 a 6 palavras, so com as palavras da lista. Se ela escrever em portugues, Ben diz que nao entendeu e repete mais devagar."},

{tipo:"escrita", titulo:"Hora de inventar", id:"1",
 instrucao:"Agora é você quem inventa! Crie uma família <b>que não existe</b> — de um personagem de desenho, de um alienígena, de quem você quiser — e apresente essa família em <b>4 ou 5 frases</b> em inglês. 🎨",
 dica:"<ul><li>diga quantas pessoas tem nessa família</li><li>apresente pelo menos duas delas, dizendo quem são</li><li>use ele é / ela é para falar de cada uma</li><li>diga como cada uma é: alta, baixa, engraçada, gentil</li><li>conte se essa família tem algum bicho de estimação, e de quem ele é</li></ul>Não tem resposta certa — quanto mais maluca, melhor. 💜",
 gabarito:"4 ou 5 frases inventadas apresentando uma familia imaginaria. Uma boa resposta traz: pelo menos duas pessoas apresentadas (This is... / He is... / She is...), pelo menos um adjetivo (tall, short, funny, kind, little, big), pelo menos um uso de his ou her, e um bicho de estimacao ou um numero de pessoas. Nao existe resposta certa: o que conta e usar he is / she is e his / her corretamente.",
 instrucaoIA:"Ela devia INVENTAR uma familia e apresenta-la em 4 ou 5 frases. E uma tarefa criativa: elogie a imaginacao antes de corrigir. Vocabulario da aula: he is, she is, his, her, family, mother, father, sister, brother, parents, grandmother, grandfather, baby, cousin, aunt, uncle, dog, cat, bird, pet, man, woman, children, twin, tall, short, funny, kind, little, big, favorite, love, This is / These are. Confira principalmente: is com he e she, e his/her de acordo com o dono. Corrija no maximo 3 coisas, em portugues."},

{tipo:"fala", titulo:"Hora de falar",
 instrucao:"Ouça, repita em voz alta e depois teste no 🎤.",
 frases:[
  {en:"He is my brother.", pt:"Ele é o meu irmão."},
  {en:"She is my sister.", pt:"Ela é a minha irmã."},
  {en:"His name is Tom.", pt:"O nome dele é Tom."},
  {en:"Her name is Mia.", pt:"O nome dela é Mia."},
  {en:"My grandmother is very kind.", pt:"A minha avó é muito gentil."},
  {en:"Her dog is big and funny.", pt:"O cachorro dela é grande e engraçado."},
  {en:"I love my family.", pt:"Eu amo a minha família."}
 ],
 instrucaoIA:"Primeiro peca para ela repetir as frases acima e corrija a pronuncia em portugues, com atencao ao h de his e her (um sopro, nunca R) e ao th mole de brother e mother. Depois faca 4 a 6 perguntas em ingles sobre a historia do dia e sobre a familia dela, uma de cada vez, esperando a resposta FALADA antes da proxima: Who is Grandma Ruth? / Is Rex big or little? / Is your mother tall or short? / Who is funny in your family? / What's your brother's name? Corrija em portugues. Use so palavras da aula e das aulas anteriores."},

{tipo:"quiz", bonus:true, titulo:"Detetive: o que dá para concluir?", questoes:[
 {pergunta:"A mãe e o pai da Emma estão no trabalho. Quem está em casa com o Sam?",
  opcoes:["Emma","Grandma Ruth","Rex"], correta:0,
  explicacao:"A história diz que a Emma está com o irmãozinho — os pais estão fora."},
 {pergunta:"A vovó Ruth é de Chicago, mas está na porta da casa da Emma. Onde ela está agora?",
  opcoes:["Em Chicago","Na casa da Emma","No trabalho"], correta:1,
  explicacao:"Ela é DE Chicago (é de lá), mas agora está na porta da Emma — por isso é surpresa!"},
 {pergunta:"O Rex é o cachorro da vovó Ruth. Então o Rex é o cachorro da Emma?",
  opcoes:["Yes, he is her dog.","No, he is her grandmother's dog.","Rex is a cat."], correta:1,
  explicacao:"A história diz HER dog, falando da vovó: o Rex é o cachorro dela, não da Emma."},
 {pergunta:"No fim, a Emma está feliz. Por quê?",
  opcoes:["Her grandmother is here.","She is at school.","Sam is hungry."], correta:0,
  explicacao:"A avó chegou de surpresa — e o dia virou."}
]},

{tipo:"ordenar", bonus:true, titulo:"Frases grandes: monte com cuidado", itens:[
 {frase:"My grandmother is short and very funny", pt:"A minha avó é baixinha e muito engraçada."},
 {frase:"Her dog is big and very funny", pt:"O cachorro dela é grande e muito engraçado."},
 {frase:"He is tall and she is very funny", pt:"Ele é alto e ela é muito engraçada."}
]}

]});
</script>
