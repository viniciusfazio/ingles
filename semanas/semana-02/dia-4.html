<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6C4AB6">
<title>Semana 2 · Dia 4</title>
<link rel="stylesheet" href="../../assets/curso.css">
</head>
<body>
<script src="../../assets/config.js"></script>
<script src="../../assets/curso.js"></script>
<script>
Curso.montar({
semana:2, dia:4,
titulo:"Anna's family",
subtitulo:"O 's que diz de quem é",
objetivos:[
  "Usar o 's para dizer de quem é uma coisa (Anna's brother)",
  "Entender de ouvido uma conversa sobre família",
  "Apresentar a sua família para um adulto que só fala inglês"
],
blocos:[

{tipo:"gramatica", titulo:"O 's: de quem é",
 html:"<p>Em português a gente diz <b>o irmão da Anna</b>. Em inglês a ordem vira do avesso: primeiro o <b>dono</b>, depois um <code>'s</code>, depois a coisa.</p>"+
 "<table><tr><th>Português</th><th>Inglês</th></tr>"+
 "<tr><td>o irmão da Anna</td><td><code>Anna's brother</code></td></tr>"+
 "<tr><td>a mãe da Emma</td><td><code>Emma's mother</code></td></tr>"+
 "<tr><td>o gato do Leo</td><td><code>Leo's cat</code></td></tr>"+
 "<tr><td>o nome da minha tia</td><td><code>my aunt's name</code></td></tr></table>"+
 "<p>👉 Leia sempre <b>de trás para a frente</b>: <code>Anna's brother</code> = brother (irmão) ... da Anna.</p>"+
 "<p>⚠️ Não confunda com o outro <code>'s</code>, o de <code>She's my sister</code> — aquele é <code>is</code> encurtado. Aqui, depois do <code>'s</code> vem sempre <b>uma coisa ou uma pessoa</b>, nunca um adjetivo.</p>",
 exemplos:[
  {en:"Anna's brother is five.", pt:"O irmão da Anna tem cinco anos."},
  {en:"Emma's mother is very nice.", pt:"A mãe da Emma é muito legal."},
  {en:"Leo's parents are teachers.", pt:"Os pais do Leo são professores."},
  {en:"My sister's cat is small.", pt:"O gato da minha irmã é pequeno."},
  {en:"My grandmother's name is Lia.", pt:"O nome da minha avó é Lia."}
 ]},

{tipo:"dialogo", titulo:"🎧 Ouça: na casa da Emma", escuta:true, linhas:[
 {quem:"Emma", en:"Mom, this is Anna. She is my friend.", pt:"Mãe, esta é a Anna. Ela é a minha amiga."},
 {quem:"Rita", en:"Hello, Anna! Nice to meet you.", pt:"Olá, Anna! Prazer em conhecer você.", voz:"f"},
 {quem:"Anna", en:"Nice to meet you too. This is a photo of my family.", pt:"Prazer em conhecer você também. Esta é uma foto da minha família."},
 {quem:"Rita", en:"Your family is big! Who is this man?", pt:"A sua família é grande! Quem é este homem?", voz:"f"},
 {quem:"Anna", en:"He is my father. His name is Marcos.", pt:"Ele é o meu pai. O nome dele é Marcos."},
 {quem:"Rita", en:"And this girl? Is she your sister?", pt:"E esta menina? Ela é a sua irmã?", voz:"f"},
 {quem:"Anna", en:"Yes, she is. Bia is my sister. She is nine.", pt:"Sim, é. A Bia é a minha irmã. Ela tem nove anos."},
 {quem:"Rita", en:"Bia is very nice! And Theo? Is he Bia's brother?", pt:"A Bia é muito legal! E o Theo? Ele é irmão da Bia?", voz:"f"},
 {quem:"Anna", en:"Yes! Theo is Bia's brother and my brother too. He is five.", pt:"Sim! O Theo é irmão da Bia e meu irmão também. Ele tem cinco anos."},
 {quem:"Rita", en:"Your family is wonderful, Anna!", pt:"A sua família é maravilhosa, Anna!", voz:"f"}
]},

{tipo:"quiz", titulo:"Você entendeu a conversa?", questoes:[
 {pergunta:"Who is Rita?", opcoes:["Anna's mother","Emma's mother","Anna's aunt"], correta:1,
  explicacao:"A Emma diz Mom — a Rita é a mãe dela."},
 {pergunta:"Is Anna's family big?", opcoes:["Yes, it is.","No, it is small.","It is new."], correta:0,
  explicacao:"A Rita diz Your family is big!"},
 {pergunta:"Who is Marcos?", opcoes:["Emma's father","Anna's father","Anna's brother"], correta:1,
  explicacao:"He is my father. His name is Marcos — quem fala é a Anna."},
 {pergunta:"How old is Bia?", opcoes:["Five","Eleven","Nine"], correta:2,
  explicacao:"Bia is my sister. She is nine."},
 {pergunta:"Is Theo Bia's brother?", opcoes:["Yes, he is.","No, he is her cousin.","No, he is her father."], correta:0,
  explicacao:"Theo is Bia's brother and my brother too."},
 {pergunta:"How old is Theo?", opcoes:["Nine","Two","Five"], correta:2,
  explicacao:"He is five."}
]},

{tipo:"ditado", titulo:"Escute e escreva o que eles disseram", itens:[
 {en:"He is my father", pt:"Ele é o meu pai.", dica:"(quatro palavras)"},
 {en:"His name is Marcos", pt:"O nome dele é Marcos.", dica:"(quatro palavras)"},
 {en:"Bia is my sister", pt:"A Bia é a minha irmã.", dica:"(quatro palavras)"},
 {en:"Nice to meet you too", pt:"Prazer em conhecer você também.", dica:"(cinco palavras)"}
]},

{tipo:"escrita", titulo:"Responda sobre a conversa", id:"escuta",
 instrucao:"Responda em inglês, com frases completas:<br>1. Who is Rita? (Quem é a Rita?)<br>2. Who is Marcos? (Quem é o Marcos?)<br>3. Is Theo Bia's brother? (O Theo é irmão da Bia?)",
 dica:"<ul><li>uma frase completa para cada pergunta</li><li>nas 1 e 2, use o <b>'s</b> para dizer de quem a pessoa é</li><li>na 3, comece com <b>Yes</b> ou <b>No</b> e continue a frase</li></ul>",
 andaime:"<p>Só o começo — o resto é você:</p><p>She is <span class=\"lacuna\">?</span> mother. · He is <span class=\"lacuna\">?</span> father. · Yes, he <span class=\"lacuna\">?</span>.</p>",
 gabarito:"1. She is Emma's mother. 2. He is Anna's father. 3. Yes, he is (Bia's brother).",
 instrucaoIA:"Ela ouviu um dialogo e devia responder por escrito, em ingles: quem e Rita (a mae da Emma), quem e Marcos (o pai da Anna) e se Theo e irmao da Bia (sim). Vocabulario: mother, father, sister, brother, family, photo, girl, man, e a gramatica do dia: o possessivo com apostrofo s (Emma's mother, Anna's father). Confira principalmente se ela usou o 's no lugar certo.",
 },

{tipo:"completar", titulo:"De quem é?", ajuda:"Leia a tradução e escolha a forma certa.", itens:[
 {frase:"This is ___ brother.", pt:"Este é o irmão da Anna.", resposta:"Anna's", opcoes:["Anna's","Anna","Annas"],
  explicacao:"Dono primeiro, com 's: Anna's brother."},
 {frase:"___ mother is very nice.", pt:"A mãe da Emma é muito legal.", resposta:"Emma's", opcoes:["Emma","Emma's","Emmas"],
  explicacao:"Emma's mother = a mãe da Emma."},
 {frase:"Bia is ___ daughter.", pt:"A Bia é a filha da Carla.", resposta:"Carla's", opcoes:["Carlas","Carla","Carla's"],
  explicacao:"Carla's daughter = a filha da Carla."},
 {frase:"My ___ name is Nina.", pt:"O nome da minha prima é Nina.", resposta:"cousin's", opcoes:["cousin's","cousins","cousin"],
  explicacao:"Aqui o dono é a prima: my cousin's name."},
 {frase:"___ father is tall.", pt:"O pai do Leo é alto.", resposta:"Leo's", opcoes:["Leos","Leo","Leo's"],
  explicacao:"Leo's father = o pai do Leo."},
 {frase:"This is my ___ cat.", pt:"Este é o gato da minha irmã.", resposta:"sister's", opcoes:["sisters","sister's","sister"],
  explicacao:"my sister's cat = o gato da minha irmã. Sem o 's, sisters seria só o plural."}
]},

{tipo:"ordenar", titulo:"Monte as frases", itens:[
 {frase:"This is my sister Bia", pt:"Esta é a minha irmã Bia."},
 {frase:"Theo is Bia's brother", pt:"O Theo é irmão da Bia."},
 {frase:"Emma's mother is very nice", pt:"A mãe da Emma é muito legal."},
 {frase:"Her name is Carla", pt:"O nome dela é Carla."}
]},

{tipo:"ligar", titulo:"Revisão da semana", pares:[
 {en:"son", pt:"filho"},
 {en:"daughter", pt:"filha"},
 {en:"grandparents", pt:"avós"},
 {en:"children", pt:"crianças"},
 {en:"man", pt:"homem"},
 {en:"woman", pt:"mulher"},
 {en:"tall", pt:"alto, alta"},
 {en:"funny", pt:"engraçado, engraçada"}
]},

{tipo:"missao", titulo:"🎯 Missão da semana: conhecendo a mãe da Emma",
 cenario:"<p>Você foi à casa da <b>Emma</b> pela primeira vez. A mãe dela, a <b>Rita</b>, abre a porta sorrindo e quer muito conhecer você e a sua família. Você está com uma foto no celular.</p><p>A Rita é americana e <b>só entende inglês</b>. Se você falar português, ela vai dizer que não entendeu.</p>",
 personagem:"Rita, a mãe da Emma, 40 anos, calorosa e curiosa; ela é de New York e é professora",
 objetivos:[
  "cumprimentar a Rita e dizer o seu nome",
  "apresentar duas pessoas da sua família (This is my... / These are my...)",
  "dizer o nome de uma delas (His name is... / Her name is...)",
  "dizer a idade de uma delas",
  "agradecer e se despedir no fim"
 ],
 andaime:"<p>Se travar: <span class=\"lacuna\">Hello! My name is</span> ... · <span class=\"lacuna\">This is my</span> ... · <span class=\"lacuna\">She is</span> ... years old.</p>",
 instrucaoIA:"Ela sabe: cumprimentos e despedidas da semana 1 (hello, hi, nice to meet you, thank you, goodbye, bye), as palavras de familia (mother, father, mom, dad, sister, brother, son, daughter, baby, grandmother, grandfather, aunt, uncle, cousin, pet, cat, family), man, woman, boy, girl, child, children, person, people, twins, os adjetivos tall, short, young, funny, smart, strong, quiet, friendly, nice, big, small, happy, os numeros ate 20, o verbo to be, This is / These are, o plural com -s, he / she / his / her e o possessivo com apostrofo s. Rita fala frases de 3 a 6 palavras. Ela cumprimenta, pergunta What is your name? Is your family big? Who is this? What is her name? How old is he? e no fim elogia a familia dela. Termine a cena quando os cinco objetivos forem cumpridos ou em oito falas.",
 },

{tipo:"escrita", titulo:"Hora de escrever", id:"1",
 instrucao:"Escreva <b>4 ou 5 frases</b> contando o que aconteceu na missão: quem você conheceu e o que você contou para ela.",
 dica:"<ul><li>uma frase dizendo <b>quem</b> é a Rita (use o <b>'s</b>!)</li><li>duas ou três frases com o que você contou da sua família</li><li>pelo menos um <b>nome</b> e uma <b>idade</b></li><li>se alguma coisa deu errado na missão, conte também — vale a frase 😄</li></ul>",
 andaime:"<p>O molde é este — quem preenche é você:</p><p>Rita is <span class=\"lacuna\">?</span> mother. I am <span class=\"lacuna\">?</span>. This is my <span class=\"lacuna\">?</span>. <span class=\"lacuna\">?</span> name is <span class=\"lacuna\">?</span>.</p>",
 gabarito:"4 ou 5 frases contando a missão: quem é a Rita (Emma's mother, com o 's), quem ela apresentou da família, pelo menos um nome (His/Her name is...) e uma idade (... is ... years old)",
 instrucaoIA:"Ela devia escrever 4 ou 5 frases contando a missao: ela conheceu a Rita, mae da Emma, e apresentou a familia dela. Vocabulario da semana: palavras de familia, man, woman, boy, girl, child, children, people, twins, tall, short, young, funny, smart, strong, quiet, friendly, photo. Gramatica da semana: This is / These are, plural com -s, he / she / his / her e o possessivo com apostrofo s. Confira principalmente o uso do 's e do his / her."},

{tipo:"fala", titulo:"Hora de falar — aquecimento para a missão",
 instrucao:"Ouça e repita em voz alta <b>antes</b> de fazer a missão. Estas são as frases que você vai precisar.",
 frases:[
  {en:"Hello! My name is Anna.", pt:"Olá! Meu nome é Anna. (troque pelo seu nome!)"},
  {en:"This is my family.", pt:"Esta é a minha família."},
  {en:"He is my father. His name is Marcos.", pt:"Ele é o meu pai. O nome dele é Marcos."},
  {en:"My sister is nine years old.", pt:"A minha irmã tem nove anos."},
  {en:"Thank you! Goodbye!", pt:"Obrigada! Tchau!"}
 ],
 instrucaoIA:"Aquecimento para a missao do dia (conhecer a Rita, mae da Emma). Pratique as frases acima. Depois faca 4 a 6 perguntas em ingles para ela responder falando, uma de cada vez, esperando a resposta: What is your name? Is your family big? Who is this in the photo? What is your mother's name? How old is your brother or sister? Corrija em portugues, com carinho. Ela so sabe o verbo to be, This is / These are, o plural, he / she / his / her, o possessivo com apostrofo s e as palavras de familia."},

{tipo:"ditado", bonus:true, titulo:"Frases inteiras", itens:[
 {en:"This is my mother and my father", pt:"Esta é a minha mãe e este é o meu pai.", dica:"(sete palavras)"},
 {en:"Her name is Bia and she is nine", pt:"O nome dela é Bia e ela tem nove anos.", dica:"(oito palavras)"},
 {en:"My grandmother is very nice and funny", pt:"A minha avó é muito legal e engraçada.", dica:"(sete palavras)"}
]},

{tipo:"completar", bonus:true, titulo:"Sem opções: escreva o 's", itens:[
 {frase:"This is ___ cat.", pt:"Este é o gato do Leo.", resposta:"Leo's",
  explicacao:"Dono primeiro, com 's: Leo's cat."},
 {frase:"___ brother is five.", pt:"O irmão da Anna tem cinco anos.", resposta:"Anna's",
  explicacao:"Anna's brother = o irmão da Anna."},
 {frase:"My ___ name is Rita.", pt:"O nome da minha tia é Rita.", resposta:"aunt's",
  explicacao:"my aunt's name = o nome da minha tia."}
]}

]});
</script>
</body>
</html>
