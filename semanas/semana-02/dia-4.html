<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6C4AB6">
<title>Semana 2 · Dia 4</title>
<link rel="stylesheet" href="../../assets/curso.css">
</head>
<body>
<script src="../../assets/config.js"></script>
<script src="../../assets/curso.js"></script>
<script>
Curso.montar({
semana:2,
dia:4,
titulo:"Max's family",
subtitulo:"Dizer de quem é: o 's que gruda no dono",
objetivos:[
  "Usar o 's para dizer de quem é (Anna's brother)",
  "Entender um diálogo sobre uma família só de ouvido",
  "Perguntar e contar como é a família de alguém"
],
blocos:[

{tipo:"gramatica", titulo:"O 's de quem é: Anna's brother",
 html:"<p>Ontem você aprendeu <code>his</code> e <code>her</code>, para quando a gente já sabe de quem está falando. E quando você quer <b>dizer o nome</b> do dono?</p>"+
 "<p>Em português a gente vira a frase: <i>o irmão <b>da</b> Anna</i>. Em inglês, o dono vem <b>na frente</b>, com um <code>'s</code> grudado nele:</p>"+
 "<table>"+
 "<tr><th>Inglês</th><th>Português</th></tr>"+
 "<tr><td><code>Anna's brother</code></td><td>o irmão da Anna</td></tr>"+
 "<tr><td><code>Emma's family</code></td><td>a família da Emma</td></tr>"+
 "<tr><td><code>my sister's cat</code></td><td>o gato da minha irmã</td></tr>"+
 "<tr><td><code>my father's mother</code></td><td>a mãe do meu pai (a minha avó!)</td></tr>"+
 "</table>"+
 "<p>O truque é ler <b>de trás para frente</b>: <code>Anna's brother</code> → <i>irmão</i> … <i>da Anna</i>.</p>"+
 "<p>E cuidado com a confusão do dia:</p>"+
 "<table>"+
 "<tr><th>Inglês</th><th>Português</th></tr>"+
 "<tr><td><code>her dog</code></td><td>o cachorro dela</td></tr>"+
 "<tr><td><code>Mia's dog</code></td><td>o cachorro da Mia</td></tr>"+
 "</table>"+
 "<p>São as duas maneiras de dizer a mesma coisa: com <code>his</code>/<code>her</code> quando já se sabe quem é, e com <code>'s</code> quando você diz o nome.</p>",
 exemplos:[
  {en:"This is Anna's brother.", pt:"Este é o irmão da Anna."},
  {en:"Emma's mother is a teacher.", pt:"A mãe da Emma é professora."},
  {en:"My sister's cat is little.", pt:"O gato da minha irmã é pequeno."},
  {en:"Leo's cousins are twins.", pt:"Os primos do Leo são gêmeos."},
  {en:"Her grandmother's name is Ruth.", pt:"O nome da avó dela é Ruth."}
 ]},

{tipo:"dialogo", titulo:"Ouça: a foto do Max", escuta:true, linhas:[
 {quem:"Max", en:"Anna, this is my family photo.", pt:"Anna, esta é a foto da minha família."},
 {quem:"Anna", en:"Nice, Max! Who is the tall woman?", pt:"Legal, Max! Quem é a mulher alta?"},
 {quem:"Max", en:"She is my mother. Her name is Julia.", pt:"Ela é a minha mãe. O nome dela é Julia."},
 {quem:"Anna", en:"And the man with the baby?", pt:"E o homem com o bebê?"},
 {quem:"Max", en:"He is my uncle. The baby is my cousin Nina.", pt:"Ele é o meu tio. O bebê é a minha prima Nina."},
 {quem:"Anna", en:"Is Nina your sister's baby?", pt:"A Nina é o bebê da sua irmã?"},
 {quem:"Max", en:"No! Nina is my uncle's baby.", pt:"Não! A Nina é o bebê do meu tio."},
 {quem:"Anna", en:"OK! And who are these two boys?", pt:"Certo! E quem são estes dois meninos?"},
 {quem:"Max", en:"They are my brothers. They are twins.", pt:"Eles são os meus irmãos. Eles são gêmeos."},
 {quem:"Anna", en:"Your family is big and funny!", pt:"A sua família é grande e engraçada!"}
]},

{tipo:"quiz", titulo:"Você entendeu o diálogo?", questoes:[
 {pergunta:"Who is Julia?", opcoes:["Max's mother","Max's aunt","Max's sister"], correta:0,
  explicacao:"Max diz: She is my mother. Her name is Julia."},
 {pergunta:"Who is with the baby?", opcoes:["Max's father","Max's uncle","Max's brother"], correta:1,
  explicacao:"He is my uncle — o homem com o bebê é o tio dele."},
 {pergunta:"Who is Nina?", opcoes:["Max's cousin","Max's sister","Max's mother"], correta:0,
  explicacao:"The baby is my cousin Nina."},
 {pergunta:"How many brothers does Max have?", opcoes:["One","Two","Three"], correta:1,
  explicacao:"These two boys... They are my brothers — são dois."},
 {pergunta:"Are Max's brothers twins?", opcoes:["Yes, they are.","No, they are not.","They are cousins."], correta:0,
  explicacao:"They are twins."},
 {pergunta:"Is Julia short?", opcoes:["Yes, she is short.","No, she is tall.","She is a baby."], correta:1,
  explicacao:"Anna pergunta Who is the tall woman? e o Max responde que é a mãe dele."}
]},

{tipo:"ditado", titulo:"Escute e escreva frases do diálogo", itens:[
 {en:"She is my mother", pt:"Ela é a minha mãe.", dica:"(quatro palavras)"},
 {en:"He is my uncle", pt:"Ele é o meu tio.", dica:"(quatro palavras)"},
 {en:"They are my brothers", pt:"Eles são os meus irmãos.", dica:"(quatro palavras)"},
 {en:"Nina is my uncle's baby", pt:"A Nina é o bebê do meu tio.", dica:"(cinco palavras — cuidado com o 's)"}
]},

{tipo:"escrita", titulo:"Responda sobre o diálogo", id:"escuta",
 instrucao:"Responda em inglês, com frases completas:<br>1. Who is Julia? (Quem é a Julia?)<br>2. Who is Nina? (Quem é a Nina?)<br>3. Are Max's brothers twins? (Os irmãos do Max são gêmeos?)",
 dica:"<ul><li>uma frase completa para cada pergunta</li><li>nas duas primeiras, diga de quem ela é: use o 's ou his</li><li>na 3, responda começando com sim ou não</li></ul>",
 andaime:"<p>Comece assim: Julia is Max's <span class=\"lacuna\">?</span>. · Nina is his <span class=\"lacuna\">?</span>. · Yes, they <span class=\"lacuna\">?</span> twins.</p>",
 gabarito:"1. Julia is Max's mother. (Her name is Julia.) 2. Nina is Max's cousin. She is his uncle's baby. 3. Yes, they are twins.",
 instrucaoIA:"Ela ouviu um dialogo curto e devia responder por escrito: quem e a Julia (a mae do Max), quem e a Nina (a prima do Max, o bebe do tio dele) e se os irmaos do Max sao gemeos (sim). Vocabulario: mother, uncle, cousin, baby, brothers, twins, tall, his, her, o 's de posse. Confira se ela usou o 's ou his corretamente. Corrija em portugues."},

{tipo:"completar", titulo:"Complete com o 's, his ou her", ajuda:"Pense em quem é o dono.", itens:[
 {frase:"This is ___ brother.", pt:"Este é o irmão da Emma.", resposta:"Emma's",
  opcoes:["Emma","Emma's","Emmas"], explicacao:"O dono vem na frente com 's: Emma's brother."},
 {frase:"My ___ cat is little.", pt:"O gato da minha irmã é pequeno.", resposta:"sister's",
  opcoes:["sister","sister's","sisters"], explicacao:"my sister's cat = o gato da minha irmã."},
 {frase:"___ dog is big.", pt:"O cachorro do Leo é grande.", resposta:"Leo's",
  opcoes:["Leo","Leo's","Leos"], explicacao:"Leo's dog = o cachorro do Leo."},
 {frase:"Ruth is my ___ mother.", pt:"A Ruth é a mãe do meu pai.", resposta:"father's",
  opcoes:["father","father's","fathers"], explicacao:"my father's mother — ou seja, a minha avó!"},
 {frase:"Max is my friend. ___ brothers are twins.", pt:"O Max é meu amigo. Os irmãos dele são gêmeos.", resposta:"His",
  opcoes:["His","Her","He"], explicacao:"O Max é menino, então his brothers."},
 {frase:"Nina is a baby. ___ mother is my aunt.", pt:"A Nina é um bebê. A mãe dela é a minha tia.", resposta:"Her",
  opcoes:["His","Her","She"], explicacao:"A Nina é menina, então her mother."}
]},

{tipo:"ordenar", titulo:"Monte as frases", itens:[
 {frase:"This is my mother's dog", pt:"Este é o cachorro da minha mãe."},
 {frase:"Max's brothers are twins", pt:"Os irmãos do Max são gêmeos."},
 {frase:"Her grandmother is very kind", pt:"A avó dela é muito gentil."},
 {frase:"These are my father's photos", pt:"Estas são as fotos do meu pai."}
]},

{tipo:"ligar", titulo:"Ligue: como as pessoas são", pares:[
 {en:"tall", pt:"alta"},
 {en:"short", pt:"baixa"},
 {en:"funny", pt:"engraçada"},
 {en:"kind", pt:"gentil"},
 {en:"tired", pt:"cansada"},
 {en:"hungry", pt:"com fome"}
]},

{tipo:"entrevista", titulo:"A vizinha nova quer conhecer você", perfil:"vizinho", voz:"f",
 personagem:"Mrs. Green, a vizinha nova, curiosa e alegre, sempre com um cachorro enorme do lado",
 apresentacao:"<p>Uma senhora acabou de se mudar para a casa ao lado. Ela está no portão com o cachorro e quer saber quem mora com você. Ela <b>só fala inglês</b> — entenda as perguntas dela e responda.</p>",
 quer:["quantas pessoas tem na família dela","o nome da mãe ou do pai dela","se ela tem irmãos, irmãs ou primos, e como eles são","se a família tem um bicho de estimação, e de quem ele é"],
 andaime:"<p>Se travar: <span class=\"lacuna\">My family is</span> … · <span class=\"lacuna\">My mother's name is</span> … · <span class=\"lacuna\">My brother is</span> …</p>",
 instrucaoIA:"Ela sabe: family, mother, father, sister, brother, parents, grandmother, grandfather, baby, cousin, mom, dad, aunt, uncle, dog, cat, bird, fish, pet, man, woman, people, child, children, twin, photo, tall, short, funny, kind, little, big, favorite, love, he is / she is, his / her, o 's de posse (Anna's brother), This is / These are, plural com -s, numeros ate 20, e a semana 1. Mrs. Green pergunta UMA coisa por vez, com frases de 3 a 6 palavras (How many people in your family? Is your brother tall?). Se ela nao entender, Mrs. Green pergunta a MESMA coisa de outro jeito ate 3 vezes: mais curta, com exemplo sobre ela mesma (My family is big. Three people. And your family?) ou com opcoes (One? Two? Three?). Depois disso o narrador ajuda em portugues. No fim ela agradece e resume em portugues o que a aluna conseguiu contar."},

{tipo:"missao", titulo:"Missão da semana: o mural My family", cena:"reportagem",
 cenario:"<p>A sua turma vai montar um mural chamado <b>My family</b>. Cada aluno escreve sobre a família de um colega — e você tirou o <b>Max</b>.</p><p>O Max <b>só entende inglês</b>. Descubra tudo sobre a família dele e conte da sua para ele também.</p>",
 personagem:"Max, 11 anos, colega de turma, tagarela e muito orgulhoso da família",
 objetivos:["perguntar quantos irmãos e irmãs o Max tem","perguntar o nome da mãe ou do pai dele","descobrir se ele tem um bicho de estimação e como ele é","contar quem tem na sua família (pelo menos duas pessoas)"],
 andaime:"<p>Se travar: <span class=\"lacuna\">How many brothers do you</span> …? · <span class=\"lacuna\">What's your mother's</span> …? · <span class=\"lacuna\">Do you have a</span> …?</p>",
 instrucaoIA:"Ela sabe: family, mother, father, sister, brother, parents, grandmother, grandfather, baby, cousin, aunt, uncle, dog, cat, bird, fish, pet, man, woman, children, twin, photo, tall, short, funny, kind, little, big, favorite, love, he is / she is, his / her, o 's de posse, This is / These are, plural com -s, How many...?, Do you have...?, numeros ate 20, e a semana 1. A familia do Max: a mae se chama Julia e e alta; ele tem dois irmaos gemeos; a prima dele e um bebe chamado Nina, filha do tio dele; ele tem um cachorro pequeno e muito engracado chamado Pepper. Max responde com frases de 3 a 6 palavras, so com essas palavras, e devolve as mesmas perguntas para ela (And your family? How many brothers?). Se ela escrever em portugues, ele diz que nao entendeu e repete mais devagar. No fim, feche em portugues: elogie, corrija no maximo 3 coisas e mostre uma frase que ela poderia ter usado."},

{tipo:"escrita", titulo:"Hora de escrever", id:"1",
 instrucao:"Escreva <b>4 ou 5 frases</b> em inglês contando o que você descobriu sobre a família do Max na missão. ✍️",
 dica:"<ul><li>uma frase dizendo quantos irmãos ele tem</li><li>uma frase com o nome da mãe ou do pai dele — use o 's</li><li>uma frase sobre o bicho de estimação dele, dizendo de quem ele é</li><li>uma frase dizendo como é alguém da família dele (alta, engraçada, pequena)</li><li>use pelo menos uma vez his ou her</li></ul>",
 andaime:"<p>O molde é este — quem preenche é você:</p><p>Max's brothers are <span class=\"lacuna\">?</span>.<br>His mother's name is <span class=\"lacuna\">?</span>.<br>His <span class=\"lacuna\">?</span> is little and <span class=\"lacuna\">?</span>.</p>",
 gabarito:"4 ou 5 frases sobre a familia do Max: o numero de irmaos (dois, gemeos), o nome da mae (Julia) usando Max's mother ou his mother, o bicho de estimacao (o cachorro dele) e pelo menos um adjetivo (tall, funny, little). Precisa aparecer pelo menos um 's ou um his/her usado corretamente.",
 instrucaoIA:"Ela fez uma missao em que entrevistou o Max sobre a familia dele e agora devia escrever 4 ou 5 frases contando o que descobriu. Vocabulario da aula: o 's de posse (Max's mother), his / her, he is / she is, brother, sister, mother, father, uncle, cousin, baby, twin, dog, pet, tall, short, funny, kind, little, big, plural com -s, numeros. Confira o uso do 's e de his/her. Elogie muito, corrija no maximo 3 coisas e em portugues."},

{tipo:"fala", titulo:"Hora de falar",
 instrucao:"Ouça, repita em voz alta e depois teste no 🎤. Estas frases são o aquecimento da missão!",
 frases:[
  {en:"This is Max's mother.", pt:"Esta é a mãe do Max."},
  {en:"His brothers are twins.", pt:"Os irmãos dele são gêmeos."},
  {en:"Her name is Julia.", pt:"O nome dela é Julia."},
  {en:"How many brothers do you have?", pt:"Quantos irmãos você tem?"},
  {en:"My family is big and funny.", pt:"A minha família é grande e engraçada."}
 ],
 instrucaoIA:"Primeiro peca para ela repetir as frases acima e corrija a pronuncia em portugues, com atencao ao 's grudado no nome (Max's, mother's) e ao som de z no fim de brothers. Depois faca 4 a 6 perguntas em ingles, uma de cada vez, esperando a resposta FALADA antes da proxima: How many brothers do you have? / What's your mother's name? / Is your father tall? / Do you have a pet? / Who is your favorite person in your family? Corrija em portugues, com carinho. Use so palavras da aula e das aulas anteriores."},

{tipo:"completar", bonus:true, titulo:"Sem opções: digite o dono certo", itens:[
 {frase:"This is my ___ photo.", pt:"Esta é a foto da minha avó.", resposta:"grandmother's",
  explicacao:"my grandmother's photo = a foto da minha avó."},
 {frase:"___ brothers are twins.", pt:"Os irmãos do Max são gêmeos.", resposta:"Max's",
  explicacao:"O dono é o Max: Max's brothers."},
 {frase:"Julia is ___ mother.", pt:"A Julia é a mãe dele.", resposta:"his",
  explicacao:"Falando do Max, um menino: his mother."},
 {frase:"The tall woman is ___ mother.", pt:"A mulher alta é a mãe da Emma.", resposta:"Emma's",
  explicacao:"Com o nome da dona, entra o 's: Emma's mother."}
]},

{tipo:"ditado", bonus:true, titulo:"Frases inteiras: escute e escreva", itens:[
 {en:"My father's mother is my grandmother", pt:"A mãe do meu pai é a minha avó.", dica:"(seis palavras)"},
 {en:"These are my brother's two little cats", pt:"Estes são os dois gatinhos do meu irmão.", dica:"(sete palavras)"},
 {en:"Her uncle is tall and very funny", pt:"O tio dela é alto e muito engraçado.", dica:"(sete palavras)"}
]}

]});
</script>
</body>
</html>
