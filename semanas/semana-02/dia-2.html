<script src="../../assets/curso.js"></script>
<script>
Curso.montar({
semana:2,
dia:2,
titulo:"One sister, two sisters",
subtitulo:"Falar de mais de uma pessoa: o -s do plural e this / these",
objetivos:[
  "Formar o plural das palavras em inglês (-s e -es)",
  "Usar this para uma coisa e these para várias",
  "Entender um diálogo de ouvido, sem ler o texto antes"
],
blocos:[

{tipo:"vocab", titulo:"Gente e bichos", itens:[
 {en:"man", pt:"homem", ipa:"/MÉN/", emoji:"🧔"},
 {en:"woman", pt:"mulher", ipa:"/UÚ-men/", emoji:"👩"},
 {en:"people", pt:"pessoas", ipa:"/PÍ-pol/", emoji:"👥"},
 {en:"child", pt:"criança", ipa:"/TCHÁILD/", emoji:"🧒"},
 {en:"children", pt:"crianças (mais de uma)", ipa:"/TCHÍL-dren/", emoji:"👦"},
 {en:"kid", pt:"criança (jeito informal)", ipa:"/KID/", emoji:"🙂"},
 {en:"twin", pt:"gêmeo, gêmea", ipa:"/TUÍN/", emoji:"👯"},
 {en:"photo", pt:"foto", ipa:"/FÔU-tou/", emoji:"📷"},
 {en:"pet", pt:"bicho de estimação", ipa:"/PÉT/", emoji:"🐾"},
 {en:"bird", pt:"pássaro", ipa:"/BÉRD/", emoji:"🐦"},
 {en:"fish", pt:"peixe", ipa:"/FÍCH/", emoji:"🐟"},
 {en:"box", pt:"caixa", ipa:"/BÓKS/", emoji:"📦"}
]},

{tipo:"gramatica", titulo:"Um e muitos: o -s do plural (e this / these)",
 html:"<p>Em inglês, para falar de <b>mais de um</b>, quase sempre é só colar um <b>-s</b> no fim da palavra. Igualzinho ao português: <i>irmã → irmãs</i>.</p>"+
 "<table>"+
 "<tr><th>Um</th><th>Mais de um</th></tr>"+
 "<tr><td><code>one sister</code></td><td><code>two sisters</code></td></tr>"+
 "<tr><td><code>one dog</code></td><td><code>two dogs</code></td></tr>"+
 "<tr><td><code>one box</code></td><td><code>two boxes</code></td></tr>"+
 "<tr><td><code>one child</code></td><td><code>two children</code></td></tr>"+
 "</table>"+
 "<p>Duas coisas para lembrar:</p>"+
 "<ul>"+
 "<li>Se a palavra já termina em <b>s, x, ch ou sh</b>, o -s sozinho não caberia na boca. Aí entra <b>-es</b>: <code>box → boxes</code>, <code>class → classes</code>.</li>"+
 "<li>Duas palavras teimosas não ganham -s: <code>child → children</code> e <code>people</code> (que já quer dizer <i>pessoas</i>, no plural).</li>"+
 "</ul>"+
 "<p>E quando você aponta para as coisas, a palavrinha também muda:</p>"+
 "<table>"+
 "<tr><th>Inglês</th><th>Português</th></tr>"+
 "<tr><td><code>This is my sister.</code></td><td>Esta é a minha irmã. (uma)</td></tr>"+
 "<tr><td><code>These are my sisters.</code></td><td>Estas são as minhas irmãs. (várias)</td></tr>"+
 "</table>"+
 "<p>Repare: com <code>these</code> o <code>is</code> vira <code>are</code>. Uma coisa <b>is</b>, várias coisas <b>are</b>.</p>"+
 "<p>E para falar de várias pessoas sem apontar: <code>They are my cousins.</code> — <i>Eles são os meus primos.</i> O <code>they</code> é <i>eles</i> ou <i>elas</i>, e também pede <code>are</code>.</p>",
 exemplos:[
  {en:"I have one sister.", pt:"Eu tenho uma irmã."},
  {en:"I have two sisters.", pt:"Eu tenho duas irmãs."},
  {en:"This is my cat.", pt:"Este é o meu gato."},
  {en:"These are my cats.", pt:"Estes são os meus gatos."},
  {en:"Two boxes and three photos.", pt:"Duas caixas e três fotos."},
  {en:"One child, two children.", pt:"Uma criança, duas crianças."}
 ]},

{tipo:"dialogo", titulo:"Ouça: os bichos do Leo", escuta:true, linhas:[
 {quem:"Leo", en:"Look, Anna! These are my pets.", pt:"Olha, Anna! Estes são os meus bichos."},
 {quem:"Anna", en:"Wow! How many pets?", pt:"Uau! Quantos bichos?"},
 {quem:"Leo", en:"Four! Two dogs and one cat.", pt:"Quatro! Dois cachorros e um gato."},
 {quem:"Anna", en:"And this? Is it a bird?", pt:"E este? É um pássaro?"},
 {quem:"Leo", en:"Yes! His name is Kiwi.", pt:"Sim! O nome dele é Kiwi."},
 {quem:"Anna", en:"Nice! And these two children?", pt:"Legal! E estas duas crianças?"},
 {quem:"Leo", en:"They are my cousins. They are twins!", pt:"Eles são os meus primos. Eles são gêmeos!"},
 {quem:"Anna", en:"Are they boys?", pt:"Eles são meninos?"},
 {quem:"Leo", en:"One boy and one girl. Mia and Alex.", pt:"Um menino e uma menina. Mia e Alex."},
 {quem:"Anna", en:"Your family is nice!", pt:"A sua família é legal!"}
]},

{tipo:"quiz", titulo:"Você entendeu o diálogo?", questoes:[
 {pergunta:"How many pets does Leo have?", opcoes:["Two","Four","Six"], correta:1,
  explicacao:"Ele diz: Four! Two dogs and one cat — e o pássaro Kiwi."},
 {pergunta:"What is the bird's name?", opcoes:["Kiwi","Alex","Mia"], correta:0,
  explicacao:"Leo diz: His name is Kiwi."},
 {pergunta:"Who are the two children?", opcoes:["Leo's brothers","Leo's cousins","Leo's parents"], correta:1,
  explicacao:"Leo diz: They are my cousins."},
 {pergunta:"Are Mia and Alex twins?", opcoes:["Yes, they are.","No, they are not.","They are babies."], correta:0,
  explicacao:"Leo diz: They are twins!"},
 {pergunta:"How many dogs does Leo have?", opcoes:["One","Two","Three"], correta:1,
  explicacao:"Two dogs and one cat — dois cachorros."},
 {pergunta:"Who is Kiwi?", opcoes:["A cat","A bird","A dog"], correta:1,
  explicacao:"Anna pergunta Is it a bird? e o Leo diz Yes!"}
]},

{tipo:"ditado", titulo:"Escute e escreva o que o Leo e a Anna disseram", itens:[
 {en:"These are my pets", pt:"Estes são os meus bichos.", dica:"(quatro palavras)"},
 {en:"Two dogs and one cat", pt:"Dois cachorros e um gato.", dica:"(cinco palavras)"},
 {en:"They are my cousins", pt:"Eles são os meus primos.", dica:"(quatro palavras)"},
 {en:"One boy and one girl", pt:"Um menino e uma menina.", dica:"(cinco palavras)"}
]},

{tipo:"escrita", titulo:"Responda sobre o diálogo", id:"escuta",
 instrucao:"Responda em inglês, com frases completas:<br>1. Who is Kiwi? (Quem é o Kiwi?)<br>2. Who are Mia and Alex? (Quem são a Mia e o Alex?)<br>3. Are Mia and Alex babies? (A Mia e o Alex são bebês?)",
 dica:"<ul><li>uma frase completa para cada pergunta (não responda com uma palavra só)</li><li>na 1, diga que bicho ele é e de quem ele é</li><li>na 2, diga de quem eles são primos e que são gêmeos</li><li>na 3, comece com não e diga o que eles são</li></ul>",
 andaime:"<p>Comece assim: Kiwi is a <span class=\"lacuna\">?</span>. · They are Leo's <span class=\"lacuna\">?</span>. · No, they are not <span class=\"lacuna\">?</span>.</p>",
 gabarito:"1. Kiwi is a bird. He is Leo's pet. 2. They are Leo's cousins. They are twins. (Um menino e uma menina.) 3. No, they are not babies. They are children.",
 instrucaoIA:"Ela ouviu um dialogo curto e devia responder por escrito: quem e o Kiwi (o passaro do Leo), quem sao Mia e Alex (os primos gemeos do Leo, um menino e uma menina) e se eles sao bebes (nao: sao criancas, children). Vocabulario: pets, dog, cat, bird, cousins, twins, children, boy, girl, his name is, they are, This is / These are. Corrija em portugues, elogie o que ela acertou de ouvido."},

{tipo:"completar", titulo:"Complete com o plural certo", ajuda:"Toque na opção certa.", itens:[
 {frase:"I have two ___.", pt:"Eu tenho duas irmãs.", resposta:"sisters",
  opcoes:["sister","sisters","sisteres"], explicacao:"Mais de uma: sister + s = sisters."},
 {frase:"___ is my brother.", pt:"Este é o meu irmão.", resposta:"This",
  opcoes:["This","These","They"], explicacao:"Uma pessoa só: this."},
 {frase:"___ are my cousins.", pt:"Estes são os meus primos.", resposta:"These",
  opcoes:["This","These","It"], explicacao:"Mais de um: these — e o verbo vira are."},
 {frase:"Three ___ and one bird.", pt:"Três caixas e um pássaro.", resposta:"boxes",
  opcoes:["boxs","boxes","box"], explicacao:"box termina em x, então o plural é boxes."},
 {frase:"Two ___ are in the photo.", pt:"Duas crianças estão na foto.", resposta:"children",
  opcoes:["childs","children","child"], explicacao:"child é teimosa: o plural é children."},
 {frase:"My mom and my dad are my ___.", pt:"A minha mãe e o meu pai são os meus pais.", resposta:"parents",
  opcoes:["parent","parents","people"], explicacao:"São dois, então parents."}
]},

{tipo:"ordenar", titulo:"Monte as frases", itens:[
 {frase:"These are my two cats", pt:"Estes são os meus dois gatos."},
 {frase:"This is my grandmother", pt:"Esta é a minha avó."},
 {frase:"I have three cousins", pt:"Eu tenho três primos."},
 {frase:"Two children and one baby", pt:"Duas crianças e um bebê."}
]},

{tipo:"ligar", titulo:"Ligue as traduções", pares:[
 {en:"man", pt:"homem"},
 {en:"woman", pt:"mulher"},
 {en:"children", pt:"crianças"},
 {en:"photo", pt:"foto"},
 {en:"pet", pt:"bicho de estimação"},
 {en:"twin", pt:"gêmeo"}
]},

{tipo:"entrevista", titulo:"As famílias no laboratório", perfil:"professor", voz:"m",
 personagem:"Mr. Brown, o professor de ciências, alto, brincalhão e um pouco distraído",
 apresentacao:"<p>O professor de ciências vai abrir o laboratório para as famílias visitarem no sábado e precisa saber quantas pessoas vêm de cada casa — e se alguém traz bicho. Ele parou na sua carteira com uma prancheta na mão. Ele <b>só fala inglês</b> — entenda o que ele pergunta e responda.</p>",
 quer:["quantos irmãos e irmãs ela tem","o nome da mãe ou do pai dela","se ela tem primos, e quantos","se a família tem um bicho de estimação, e qual","quantas pessoas tem na família dela"],
 andaime:"<p>Se travar: <span class=\"lacuna\">I have</span> … · <span class=\"lacuna\">My mother's name is</span> … · <span class=\"lacuna\">These are my</span> …</p>",
 instrucaoIA:"Ela sabe: family, mother, father, sister, brother, parents, grandmother, grandfather, baby, cousin, mom, dad, aunt, uncle, dog, cat, man, woman, people, child, children, kid, twin, photo, pet, bird, fish, box, o plural com -s e -es, This is / These are, I have..., numeros ate 20, e a semana 1 (nome, idade em numeros, Where are you from?, Sorry I don't understand, Again please, Slowly please). Mr. Brown pergunta UMA coisa por vez, com frases de 3 a 6 palavras (How many brothers? Do you have a pet?). Se ela nao entender, ele pergunta a MESMA coisa de outro jeito ate 3 vezes: mais curto, com exemplo sobre ele mesmo (I have two brothers. And you?) ou com opcoes (One? Two? Three?). Depois disso o narrador ajuda em portugues. No fim, ele agradece e resume em portugues o que ela conseguiu dizer."},

{tipo:"missao", titulo:"Missão: a Sophie na sua casa", cena:"visita",
 cenario:"<p>A <b>Sophie</b> veio à sua casa pela primeira vez. Na parede da sala tem um monte de fotos da sua família, e ela ficou curiosa: quer saber quem é quem.</p><p>A Sophie <b>só entende inglês</b>. Mostre a sua família para ela!</p>",
 personagem:"Sophie, 11 anos, americana, educada e curiosa com tudo",
 objetivos:["mostrar duas pessoas da família apontando uma de cada vez (This is...)","mostrar um grupo de pessoas de uma vez só (These are...)","dizer quantos irmãos, irmãs ou primos você tem"],
 andaime:"<p>Se travar: <span class=\"lacuna\">This is my</span> … · <span class=\"lacuna\">These are my</span> … · <span class=\"lacuna\">I have two</span> …</p>",
 instrucaoIA:"Ela sabe: family, mother, father, sister, brother, parents, grandmother, grandfather, baby, cousin, mom, dad, aunt, uncle, dog, cat, man, woman, people, child, children, twin, photo, pet, bird, fish, o plural com -s, This is / These are, I have..., numeros ate 20, cumprimentos da semana 1. Sophie e de Chicago, tem uma irma mais velha e um gato. Ela fala frases de 3 a 6 palavras, aponta para as fotos e pergunta Who is this? / And these? / How many? Se ela escrever em portugues, Sophie diz que nao entendeu e repete mais devagar. Nao use nenhuma palavra fora dessa lista."},

{tipo:"escrita", titulo:"Hora de escrever", id:"1",
 instrucao:"Escreva <b>4 ou 5 frases</b> em inglês sobre a sua família, usando <b>This is</b>, <b>These are</b> e pelo menos um plural. ✍️",
 dica:"<ul><li>uma frase apontando para uma pessoa só</li><li>uma frase apontando para duas ou mais pessoas de uma vez</li><li>uma frase dizendo quantos irmãos, irmãs ou primos você tem</li><li>uma frase sobre bichos de estimação (quantos e quais)</li><li>cuidado com o -s no fim das palavras que estão no plural</li></ul>",
 andaime:"<p>O molde é este — quem preenche é você:</p><p>This is my <span class=\"lacuna\">?</span>.<br>These are my <span class=\"lacuna\">?</span>.<br>I have <span class=\"lacuna\">?</span> cousins.<br>I have <span class=\"lacuna\">?</span> pets.</p>",
 gabarito:"4 ou 5 frases com: pelo menos um This is + singular, pelo menos um These are + plural, um numero de irmaos/primos e uma frase sobre bichos. O plural precisa estar com -s (cousins, pets, sisters) e o verbo tem que combinar (This is / These are).",
 instrucaoIA:"Ela devia escrever 4 ou 5 frases sobre a familia dela usando This is (uma pessoa) e These are (varias), com plurais corretos. Vocabulario da aula: family, mother, father, sister, brother, parents, grandmother, grandfather, baby, cousin, man, woman, people, child, children, twin, photo, pet, bird, fish, box, I have, numeros ate 20. Confira se o plural esta com -s e se ela nao escreveu This are. Elogie muito, corrija no maximo 3 coisas e em portugues."},

{tipo:"fala", titulo:"Hora de falar",
 instrucao:"Ouça, repita em voz alta e depois teste no 🎤.",
 foco:"o <b>-s</b> do plural muda de som: em <i>cats</i> ele sai <b>soprado</b> (s), em <i>dogs</i> e <i>brothers</i> ele <b>zumbe</b> (z), e depois de x, s ou ch ele vira uma sílaba inteira: <i>boxes</i> = <i>BÓK-sez</i>.",
 frases:[
  {en:"I have two brothers.", pt:"Eu tenho dois irmãos."},
  {en:"These are my cats.", pt:"Estes são os meus gatos."},
  {en:"Three boxes and two photos.", pt:"Três caixas e duas fotos."},
  {en:"My cousins are twins.", pt:"Os meus primos são gêmeos."},
  {en:"This is my bird.", pt:"Este é o meu pássaro."},
  {en:"Two children and one baby.", pt:"Duas crianças e um bebê."}
 ],
 instrucaoIA:"Primeiro peca para ela repetir as frases acima e corrija a pronuncia em portugues, com atencao ao som do -s do plural (cats com s soprado, dogs e brothers com z, boxes com uma silaba a mais). Depois faca 4 a 6 perguntas em ingles, uma de cada vez, e espere a resposta FALADA dela antes da proxima: How many brothers do you have? / How many cousins? / Do you have pets? / Are these your friends? / Who is this? Corrija em portugues. Use so palavras da aula e da semana 1."},

{tipo:"quiz", bonus:true, titulo:"Detetive: o que dá para concluir?", questoes:[
 {pergunta:"A Mia e o Alex são gêmeos. A Mia é menina. O que é o Alex?",
  opcoes:["A boy","A girl","A baby"], correta:0,
  explicacao:"O Leo diz One boy and one girl — se a Mia é a menina, o Alex é o menino."},
 {pergunta:"O Kiwi não é cachorro e não é gato. O que ele é?",
  opcoes:["A bird","A fish","A child"], correta:0,
  explicacao:"A Anna pergunta Is it a bird? e o Leo responde Yes!"},
 {pergunta:"A Anna diz \"Your family is nice\". Ela é da família do Leo?",
  opcoes:["Yes, she is his sister.","No, she is his friend.","She is his cousin."], correta:1,
  explicacao:"Ela diz YOUR family (a sua família), e não my family — a Anna é amiga, não é da família."},
 {pergunta:"O Leo tem quatro bichos e dois são cachorros. Quantos NÃO são cachorros?",
  opcoes:["One","Two","Three"], correta:1,
  explicacao:"Quatro menos dois cachorros = dois: o gato e o pássaro."}
]},

{tipo:"ditado", bonus:true, titulo:"Frases inteiras: escute e escreva", itens:[
 {en:"These are my mother and my father", pt:"Estes são a minha mãe e o meu pai.", dica:"(sete palavras)"},
 {en:"My two cousins are here with a dog", pt:"Os meus dois primos estão aqui com um cachorro.", dica:"(oito palavras)"},
 {en:"This is a photo of my family", pt:"Esta é uma foto da minha família.", dica:"(sete palavras)"}
]}

]});
</script>
