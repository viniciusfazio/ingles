  explicacao:"grand- é como o nosso a-vó: grandmother = avó."},

  explicacao:"uncle = tio. cousin = primo ou prima."},

]},

]},

{tipo:"missao", titulo:"🎯 Missão: quem é quem na foto",

 ],

{tipo:"escrita", titulo:"Hora de escrever", id:"1",

{tipo:"fala", titulo:"Hora de falar",
