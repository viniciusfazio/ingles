<script>
Curso.montar({
semana:2,

titulo:"Revisão + projeto",
subtitulo:"Juntar a semana toda e apresentar a sua família em inglês",
objetivos:[
  "Revisar família, plural, this/these, he/she, his/her e o 's",
  "Entender uma história inteira de ouvido",
  "Apresentar a sua família em inglês, do seu jeito"
],
blocos:[

{tipo:"nota", titulo:"🎉 Você chegou ao fim da semana 2!",
 html:"<p>Pare um segundo e olhe o tamanho disso: em cinco dias você aprendeu a dizer <b>quem é quem</b> na sua família, a falar de <b>duas ou mais</b> pessoas, a contar de <b>outra pessoa</b> (<code>he is</code>, <code>she is</code>) e a dizer <b>de quem é</b> cada coisa (<code>her cat</code>, <code>Anna's brother</code>).</p>"+
 "<p>Hoje tem história, revisão e o <b>projeto da semana</b>: apresentar a sua família em inglês, sem molde nenhum. Você consegue. 💜</p>"},

{tipo:"historia", titulo:"Ouça: o irmão novo do Leo", cena:"novidade", paragrafos:[
 {en:"Today Leo is very happy. He is at school.", pt:"Hoje o Leo está muito feliz. Ele está na escola."},
 {en:"His friend Anna is here. 'Leo, what is it?'", pt:"A amiga dele, a Anna, está aqui. 'Leo, o que foi?'"},
 {en:"'I have a new brother!' says Leo.", pt:"'Eu tenho um irmão novo!', diz o Leo."},
 {en:"'His name is Nico. He is a baby.'", pt:"'O nome dele é Nico. Ele é um bebê.'"},
 {en:"'Is he little?' says Anna.", pt:"'Ele é pequeno?', diz a Anna."},
 {en:"'Yes! He is very little and very funny.'", pt:"'Sim! Ele é bem pequenininho e muito engraçado.'"},
 {en:"Now Anna is at Leo's home. She sees Nico.", pt:"Agora a Anna está na casa do Leo. Ela vê o Nico."},
 {en:"'Nico is my favorite baby!' says Anna.", pt:"'O Nico é o meu bebê favorito!', diz a Anna."}
]},

{tipo:"quiz", titulo:"Você entendeu a história?", questoes:[
 {pergunta:"Who is Nico?", opcoes:["Leo's new brother","Leo's cousin","Leo's dog"], correta:0,
  explicacao:"Leo diz: I have a new brother! His name is Nico."},
 {pergunta:"Where is Leo?", opcoes:["At school","At home","At work"], correta:0,
  explicacao:"Today Leo is very happy. He is at school."},
 {pergunta:"Is Nico a big boy?", opcoes:["Yes, he is big.","No, he is little.","He is a girl."], correta:1,
  explicacao:"He is very little and very funny."},
 {pergunta:"Who is Leo's friend?", opcoes:["Anna","Emma","Mia"], correta:0,
  explicacao:"His friend Anna is here."},
 {pergunta:"Where is Anna now?", opcoes:["At school","At Leo's home","At her school"], correta:1,
  explicacao:"Now Anna is at Leo's home."},
 {pergunta:"Is Nico funny?", opcoes:["Yes, he is very funny.","No, he is not funny.","He is tall."], correta:0,
  explicacao:"Leo diz que o irmãozinho é very little and very funny."}
]},

{tipo:"ditado", titulo:"Escute e escreva frases da história", itens:[
 {en:"He is at school", pt:"Ele está na escola.", dica:"(quatro palavras)"},
 {en:"I have a new brother", pt:"Eu tenho um irmão novo.", dica:"(cinco palavras)"},
 {en:"His name is Nico", pt:"O nome dele é Nico.", dica:"(quatro palavras)"},
 {en:"She sees Nico", pt:"Ela vê o Nico.", dica:"(três palavras)"}
]},

{tipo:"escrita", titulo:"Responda sobre a história", id:"escuta",
 instrucao:"Responda em inglês, com frases completas:<br>1. Who is Nico? (Quem é o Nico?)<br>2. Is Nico big or little? (O Nico é grande ou pequeno?)<br>3. Where is Anna now? (Onde a Anna está agora?)",
 dica:"<ul><li>uma frase completa para cada pergunta</li><li>na 1, diga de quem ele é irmão — use o 's</li><li>na 3, diga na casa de quem ela está</li></ul>",
 gabarito:"1. Nico is Leo's new brother. He is a baby. 2. Nico is little. (He is very little.) 3. Anna is at Leo's home.",
 instrucaoIA:"Ela ouviu uma historia curta e devia responder por escrito: quem e o Nico (o irmao novo do Leo, um bebe), se ele e grande ou pequeno (little) e onde a Anna esta agora (na casa do Leo). Vocabulario: brother, baby, little, funny, home, school, his, her, o 's de posse. Corrija em portugues e elogie o que ela entendeu de ouvido."},

{tipo:"quiz", titulo:"Revisão da semana", questoes:[
 {pergunta:"A mãe da sua mãe é a sua...",
  opcoes:["grandmother","aunt","cousin"], correta:0,
  explicacao:"grandmother = avó."},
 {pergunta:"Qual é o plural de cousin?",
  opcoes:["cousin","cousins","cousines"], correta:1,
  explicacao:"Plural quase sempre é só o -s: cousins."},
 {pergunta:"Complete: ___ are my brothers.",
  opcoes:["This","These","He"], correta:1,
  explicacao:"São vários, então these — e o verbo vira are."},
 {pergunta:"\"O gato dela\" em inglês é...",
  opcoes:["her cat","his cat","she cat"], correta:0,
  explicacao:"A dona é uma menina: her cat."},
 {pergunta:"\"O irmão da Anna\" em inglês é...",
  opcoes:["Anna brother","Anna's brother","brother's Anna"], correta:1,
  explicacao:"O dono vem na frente com 's: Anna's brother."},
 {pergunta:"Qual é o plural de box?",
  opcoes:["boxes","boxs","boxen"], correta:0,
  explicacao:"Termina em x, então entra -es: boxes."},
 {pergunta:"Como se diz \"crianças\"?",
  opcoes:["childs","childrens","children"], correta:2,
  explicacao:"child é teimosa: o plural é children."},
 {pergunta:"Você não sabe uma palavra em inglês. O que você pergunta?",
  opcoes:["How do you say this in English?","What is your name?","I don't know."], correta:0,
  explicacao:"É a frase que resolve tudo — use com a IA sempre que precisar!"}
]},

{tipo:"ligar", titulo:"Ligue: a semana toda", pares:[

 {en:"kind", pt:"gentil"},
 {en:"photo", pt:"foto"}
]},

{tipo:"explorar", titulo:"Quem é a Zoe?", perfil:"atleta", voz:"f",
 personagem:"Zoe, 14 anos, nadadora, animada, competitiva e muito orgulhosa da família",
 apresentacao:"<p>Na piscina do clube tem uma menina mais velha de touca azul. Ela acabou de sair da água, senta do seu lado e sorri. Ela <b>só entende inglês</b> — descubra quem ela é e como é a família dela!</p>",
 segredos:["ela tem três irmãos e todos os quatro nadam no mesmo time","a mãe dela é a treinadora do time","o cachorro dela se chama Splash e pula na piscina junto","ela é a pessoa mais alta da família, mais alta até que o pai","surpresa: a avó dela tem 70 anos e também nada todo dia"],
 andaime:"<p>Para começar: <span class=\"lacuna\">What's your</span> …? · <span class=\"lacuna\">How many brothers do you</span> …? · <span class=\"lacuna\">Is your mother</span> …?</p>",
 instrucaoIA:"Ela sabe: family, mother, father, sister, brother, parents, grandmother, grandfather, baby, cousin, mom, dad, aunt, uncle, dog, cat, bird, fish, pet, man, woman, people, child, children, twin, photo, tall, short, funny, kind, little, big, favorite, love, he is / she is, his / her, o 's de posse, This is / These are, plural com -s, How many...?, Do you have...?, numeros ate 20, How do you say this in English?, What does it mean?, OK!, e a semana 1 (cumprimentos, nome, Where are you from?, Sorry I don't understand, Again please). Zoe responde com frases de 3 a 6 palavras, so com essas palavras, deixa ganchos (My family is big. / My dog is funny.) e devolve perguntas faceis (And your family?). Se ela escrever em portugues, Zoe diz que nao entendeu e repete mais devagar. Quando ela disser bye, volte ao portugues, conte o que ela descobriu e deixe uma pista do que ficou escondido."},

{tipo:"missao", titulo:"Missão: os convites da Miss Kate", cena:"ajuda",
 cenario:"<p>A <b>Miss Kate</b> está escrevendo os convites do <i>Family Day</i> da escola, um para cada pessoa da sua família, e se enrolou: não sabe quem é quem nem como se escrevem os nomes.</p><p>Ela <b>só entende inglês</b>. Ajude a professora a escrever cada convite certo!</p>",
 personagem:"Miss Kate, a sua professora, carinhosa e um pouquinho atrapalhada",
 objetivos:["dizer quem são três pessoas da sua família que vão ao Family Day","dizer de quem é o bicho de estimação que vai junto, usando his ou her","soletrar o nome de uma pessoa da sua família, letra por letra"],
 andaime:"<p>Se travar: <span class=\"lacuna\">This is my</span> … · <span class=\"lacuna\">These are my</span> … · <span class=\"lacuna\">It is her</span> … · <span class=\"lacuna\">Can you spell</span> …?</p>",
 instrucaoIA:"Ela sabe: family, mother, father, sister, brother, parents, grandmother, grandfather, baby, cousin, aunt, uncle, dog, cat, bird, pet, man, woman, children, twin, photo, tall, short, funny, kind, little, big, favorite, love, he is / she is, his / her, o 's de posse, This is / These are, plural com -s, o alfabeto para soletrar, numeros ate 20, e a semana 1. Miss Kate pergunta uma pessoa por vez (Who is in your family? / And who is this? / Is it his dog or her dog?) e pede para soletrar um nome (Can you spell it?) para escrever certo no convite. Frases de 3 a 6 palavras, so com as palavras da lista. Se ela escrever em portugues, Miss Kate diz que nao entendeu e repete mais devagar. No fim, feche em portugues: elogie, corrija no maximo 3 coisas e mostre uma frase que ela poderia ter usado."},

{tipo:"escrita", titulo:"⭐ Projeto da semana: My family", id:"1",
 instrucao:"Este é o projeto da semana! Escreva <b>4 ou 5 frases</b> em inglês apresentando a sua família de verdade — como se você fosse mandar para uma amiga de outro país que nunca viu vocês. 💜",
 dica:"<ul><li>diga quantas pessoas tem na sua família</li><li>apresente pelo menos duas pessoas, dizendo quem são e o nome delas</li><li>diga como uma delas é (alta, baixa, engraçada, gentil)</li><li>use pelo menos uma vez his ou her, ou o 's</li><li>termine falando dos bichos de estimação — ou de quem é a sua pessoa favorita</li></ul>Hoje é sem molde: você já sabe tudo o que precisa. 💪",
 gabarito:"4 ou 5 frases apresentando a familia dela. Uma boa resposta traz: o numero de pessoas da familia, pelo menos duas pessoas apresentadas com nome (This is my mother. Her name is...), pelo menos um adjetivo (tall, short, funny, kind), pelo menos um uso correto de his, her ou do 's, e uma frase final sobre bichos ou sobre a pessoa favorita. Sem molde: e a avaliacao da semana.",
 instrucaoIA:"E o projeto da semana 2: ela devia escrever 4 ou 5 frases apresentando a familia dela, sem molde. Vocabulario da semana: family, mother, father, sister, brother, parents, grandmother, grandfather, baby, cousin, mom, dad, aunt, uncle, dog, cat, bird, fish, pet, man, woman, people, child, children, twin, photo, box, tall, short, funny, kind, little, big, favorite, love, he is / she is, his / her, o 's de posse, This is / These are, plural com -s. Corrija com carinho e em portugues: elogie primeiro, aponte no maximo 3 coisas (principalmente is com he/she, o plural com -s e o his/her de acordo com o dono) e termine dizendo o que ficou melhor do que na semana passada."},

{tipo:"fala", titulo:"Hora de falar: apresente a sua família",
 instrucao:"Ouça, repita em voz alta e depois teste no 🎤. É o aquecimento para apresentar a sua família falando.",
 foco:"o <b>-s</b> do plural: <i>brothers</i> e <i>cousins</i> terminam com um <b>z</b> zumbindo, <i>cats</i> e <i>parents</i> com um <b>s</b> soprado.",
 frases:[
  {en:"Hello! This is my family.", pt:"Olá! Esta é a minha família."},
  {en:"She is my mother. Her name is Rita.", pt:"Ela é a minha mãe. O nome dela é Rita."},
  {en:"He is my father. His name is Paulo.", pt:"Ele é o meu pai. O nome dele é Paulo."},
  {en:"These are my two cousins.", pt:"Estes são os meus dois primos."},
  {en:"My grandmother is very kind.", pt:"A minha avó é muito gentil."},
  {en:"I love my family!", pt:"Eu amo a minha família!"}
 ],
 instrucaoIA:"Primeiro peca para ela repetir as frases acima e corrija a pronuncia em portugues, com atencao ao som do -s do plural (brothers e cousins com z, cats e parents com s) e ao th mole de mother, father e brother. Depois faca 4 a 6 perguntas em ingles sobre a familia dela, uma de cada vez, esperando a resposta FALADA antes da proxima: How many people are in your family? / What's your mother's name? / Do you have brothers or sisters? / Is your father tall or short? / Who is funny in your family? / Do you have a pet? Corrija em portugues, com carinho, e no fim diga uma frase que ela pode usar na apresentacao. Use so palavras da semana 1 e da semana 2."},

{tipo:"ligar", bonus:true, titulo:"Pares traiçoeiros: preste muita atenção", pares:[

]},

{tipo:"escrita", bonus:true, titulo:"⭐ Escrita livre: continue a história", id:"bonus",
 instrucao:"A Anna acabou de conhecer o Nico, o irmãozinho novo do Leo. <b>Continue a história</b> em 4 ou 5 frases: o que acontece na casa do Leo? Quem mais chega? O que o Nico faz? Invente!",
 dica:"<ul><li>escreva em inglês, com frases curtas</li><li>use pelo menos duas pessoas da família</li><li>use pelo menos uma vez his ou her</li><li>diga como cada pessoa é (alta, engraçada, gentil, pequena)</li></ul>",
 gabarito:"4 ou 5 frases inventadas continuando a historia do Nico. Uma boa resposta usa he is / she is, his / her, palavras de familia e pelo menos um adjetivo. Nao existe resposta certa: o que conta e a historia continuar fazendo sentido em ingles.",
 instrucaoIA:"E um desafio bonus criativo: ela devia continuar a historia do Nico (o irmao novo do Leo) em 4 ou 5 frases inventadas. Elogie a criatividade primeiro. Vocabulario disponivel: familia inteira, he is / she is, his / her, o 's, This is / These are, plural com -s, tall, short, funny, kind, little, big, favorite, love, home, school, e a semana 1. Corrija no maximo 3 coisas, em portugues."}

]});
