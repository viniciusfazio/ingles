blocos:[

{tipo:"nota", titulo:"💡 A pergunta de hoje",
 html:"<p>Ontem você aprendeu os meses. Hoje vem a data <b>completa</b>, com o dia:</p>"+
 "<table><tr><th>Inglês</th><th>Português</th></tr>"+
 "<tr><td><code>When is your birthday?</code></td><td>Quando é o seu aniversário?</td></tr>"+
 "<tr><td><code>It's on May 5th.</code></td><td>É no dia 5 de maio.</td></tr></table>"+
 "<p>Em português a gente diz <i>dia cinco</i>. Em inglês a gente diz <b>quinto</b>: <code>May fifth</code>. Por isso hoje você aprende os números de ordem. 💜</p>"},

{tipo:"gramatica", titulo:"First, second, third — e a data",
 html:"<p><b>1. Números de ordem.</b> Os três primeiros são especiais. Depois, é só pôr <b>-th</b> no número.</p>"+
 "<table><tr><th>Número</th><th>Escreve</th><th>Fala</th></tr>"+
 "<tr><td>1º</td><td><code>1st</code></td><td><code>first</code></td></tr>"+
 "<tr><td>2º</td><td><code>2nd</code></td><td><code>second</code></td></tr>"+
 "<tr><td>3º</td><td><code>3rd</code></td><td><code>third</code></td></tr>"+
 "<tr><td>4º</td><td><code>4th</code></td><td><code>fourth</code></td></tr>"+
 "<tr><td>10º</td><td><code>10th</code></td><td><code>tenth</code></td></tr></table>"+
 "<p>Quatro escapam um pouco da regra: <code>fifth</code> (five vira fif), <code>eighth</code> (só um T), <code>ninth</code> (sem o E) e <code>twelfth</code> (twelve vira twelf). O 20 troca o Y por <b>ie</b>: <code>twentieth</code>.</p>"+
 "<p>Depois do 20, só o último pedaço muda: <code>twenty-first</code> (21º), <code>twenty-second</code> (22º), <code>thirty-first</code> (31º).</p>"+
 "<p><b>2. Como dizer a data.</b> Mês primeiro, dia depois, e <code>on</code> na frente:</p>"+
 "<table><tr><th>Escreve</th><th>Fala</th><th>Português</th></tr>"+
 "<tr><td><code>on May 5th</code></td><td>on May fifth</td><td>no dia 5 de maio</td></tr>"+
 "<tr><td><code>on June 1st</code></td><td>on June first</td><td>no dia 1º de junho</td></tr>"+
 "<tr><td><code>on March 3rd</code></td><td>on March third</td><td>no dia 3 de março</td></tr></table>"+
 "<p>Só o mês, sem o dia? Aí volta o <code>in</code>: <code>in May</code>. Com o dia, é sempre <code>on</code>.</p>",
 exemplos:[
  {en:"When is your birthday?", pt:"Quando é o seu aniversário?"},
  {en:"My birthday is on May fifth.", pt:"O meu aniversário é no dia 5 de maio."},
  {en:"It's on June first.", pt:"É no dia 1º de junho."},
  {en:"January is the first month.", pt:"Janeiro é o primeiro mês."},
  {en:"Today is October twelfth.", pt:"Hoje é 12 de outubro."},
  {en:"Her birthday is on March twenty-second.", pt:"O aniversário dela é no dia 22 de março."}
 ]},

{tipo:"historia", titulo:"Ouça: quarenta velas", cena:"cozinha", paragrafos:[

 {en:"Now the cake has four candles: ten, twenty, thirty, forty!", pt:"Agora o bolo tem quatro velas: dez, vinte, trinta, quarenta!"},
 {en:"Mom looks at her cake. “Four candles for forty years? I love it!”", pt:"A mamãe olha para o bolo dela. “Quatro velas para quarenta anos? Eu adorei!”"}
]},

{tipo:"escrita", titulo:"Responda sobre a história", id:"escuta",
 instrucao:"Responda em inglês, com frases completas:<br>1. When is Mom's birthday? (Quando é o aniversário da mamãe?)<br>2. How many candles are in the box? (Quantas velas tem na caixa?)<br>3. How many candles are on the cake? Why? (Quantas velas vão no bolo? Por quê?)",
 dica:"<ul><li>uma frase completa para cada pergunta</li><li>na 1, use <b>on</b> + a data</li><li>na 3, explique a ideia da Emma com um número</li></ul>",
 andaime:"<p>Mom's birthday is on <span class=\"lacuna\">?</span>. · <span class=\"lacuna\">?</span> candles are in the box. · <span class=\"lacuna\">?</span> candles are on the cake: one candle is <span class=\"lacuna\">?</span>.</p>",
 gabarito:"1. Mom's birthday is on March 3rd (March third). 2. Nine candles are in the box. 3. Four candles are on the cake, because one candle is ten years (4 x 10 = 40).",
 instrucaoIA:"Ela ouviu a história do bolo de aniversário da mãe da Emma e devia responder por escrito: a data do aniversário (on March 3rd), quantas velas tinha na caixa (nine) e quantas foram no bolo e por quê (four, porque cada vela vale dez anos). Vocabulário: datas com on + mês + número de ordem, números até 100, candle, cake, birthday, how many. Aceite a explicação da 3 com palavras simples (one candle is ten years)."},

{tipo:"escrita", titulo:"Escrita livre: um cartão de aniversário", id:"1",

 gabarito:"Um cartão de 4 ou 5 frases com: para quem é (To... / Dear...), Happy birthday!, a data com on + mês + número de ordem (Your birthday is on May fifth), a idade por extenso (You are forty / She is thirty), e uma frase sobre bolo, velas ou presente (a big cake, forty candles, a present for you). Pode assinar no fim (Love, ...). Criatividade vale mais que perfeição.",
 instrucaoIA:"Escrita livre e criativa: ela devia inventar um cartão de aniversário de 4 ou 5 frases para alguém (a mãe da Emma, a Miss Kate, alguém da família ou um personagem). Vocabulário da semana: números até 100, números de ordem (first, second, third, fifth, twelfth, twentieth...), meses, dias da semana, on + data, in + mês, idade com is/are, birthday, Happy birthday!, party, cake, candle, present. Elogie a ideia primeiro; depois corrija no máximo 3 coisas, com atenção à data (on May fifth) e à idade (is, não has)."},
