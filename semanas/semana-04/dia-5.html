],
blocos:[

{tipo:"nota", titulo:"🎉 Você chegou na sexta!",
 html:"<p>Esta semana você aprendeu a contar até <b>cem</b>, a dizer a <b>idade</b> (com <code>am</code> / <code>is</code>, nunca com have), os <b>dias da semana</b>, os <b>meses</b> e as <b>datas</b>: <code>on May 5th</code>.</p>"+
 "<p>Hoje é dia de juntar tudo: uma história de um presente diferente, uma revisão geral e o <b>projeto da semana</b>. Vamos! 💪</p>"},

{tipo:"historia", titulo:"Ouça: o presente da Amy", cena:"desafio", paragrafos:[
 {en:"It's Monday. Leo's little sister, Amy, is seven.", pt:"É segunda-feira. A irmãzinha do Leo, a Amy, tem sete anos."},
 {en:"Grandma's birthday is on Saturday, June 1st. She is seventy!", pt:"O aniversário da vovó é no sábado, dia 1º de junho. Ela faz setenta anos!"},
 {en:"Amy has a present for Grandma: the twelve months in English!", pt:"A Amy tem um presente para a vovó: os doze meses em inglês!"},

{tipo:"escrita", titulo:"Responda sobre a história", id:"escuta",

 dica:"<ul><li>uma frase completa para cada pergunta</li><li>na 1, diga o dia da semana <b>e</b> a data</li><li>na 3, use um número de ordem</li></ul>",
 gabarito:"1. Grandma's birthday is on Saturday, June 1st (June first). 2. Amy's present is the twelve months in English. 3. August is the eighth month.",
 instrucaoIA:"Ela ouviu a história da Amy, que aprende os doze meses em inglês como presente para a avó, e devia responder por escrito: quando é o aniversário da avó (on Saturday, June 1st), qual é o presente (os doze meses em inglês) e o que o Leo diz sobre agosto (August is the eighth month). Vocabulário: datas com on, números de ordem, dias da semana, meses, present, possessivo com 's. Aceite respostas simples na 2 (The months in English)."},

{tipo:"completar", titulo:"Revisão da semana", ajuda:"Oito frases misturando tudo o que você viu.", itens:[
 {frase:"How ___ is your grandpa? He's seventy.", pt:"Quantos anos o seu avô tem? Ele tem setenta.", resposta:"old",

 {frase:"My grandma ___ eighty.", pt:"A minha avó tem oitenta anos.", resposta:"is",
  opcoes:["is","has","have"], explicacao:"Idade vai com is, nunca com has."},
 {frase:"Saturday and Sunday: the ___!", pt:"Sábado e domingo: o fim de semana!", resposta:"weekend",
  opcoes:["weekend","month","birthday"], explicacao:"weekend = fim de semana."},
 {frase:"My birthday is ___ June 3rd.", pt:"O meu aniversário é no dia 3 de junho.", resposta:"on",
  opcoes:["on","in","at"], explicacao:"Data com dia vai com on."},
 {frase:"My party is ___ July.", pt:"A minha festa é em julho.", resposta:"in",
  opcoes:["in","on","at"], explicacao:"Só o mês, sem dia: in."},
 {frase:"30 = ___", pt:"trinta", resposta:"thirty",
  opcoes:["thirty","thirteen","third"], explicacao:"thirty é 30 (força no começo: THIRty). thirteen é 13 e third é terceiro."},
 {frase:"February is the ___ month.", pt:"Fevereiro é o segundo mês.", resposta:"second",
  opcoes:["second","two","twelfth"], explicacao:"Na ordem é second, não two."},
 {frase:"Can you come? ___! See you on Saturday.", pt:"Você pode vir? Claro! Até sábado.", resposta:"Sure",
  opcoes:["Sure","Sorry","Wait"], explicacao:"Sure! = Claro! Sorry, I can't é o não."}
]},

{tipo:"explorar", titulo:"Quem é a Nora?", perfil:"astronauta", voz:"f",

 segredos:["ela tem 34 anos","o aniversário dela é no dia 29 de fevereiro, que só existe de 4 em 4 anos","ela treina seis dias por semana; só o domingo é livre","surpresa: ela tem uma irmã gêmea, que é professora de música","o mês favorito dela é julho: em julho ela vai ao espaço pela primeira vez"],
 pistas:["a idade dela","surpresa: a data do aniversário","como é a semana dela","surpresa: alguém da família","o mês favorito dela"],
 andaime:"<p>Para começar: <span class=\"lacuna\">How old are</span> …? · <span class=\"lacuna\">When is your</span> …? · <span class=\"lacuna\">Do you have a</span> …?</p>",
 instrucaoIA:"Ela sabe: How old are you? When is your birthday? What's your favorite month/day? Do you have a brother or a sister? How many...? What day is it today? números até 100, números de ordem (first... tenth, twelfth, twentieth, twenty-ninth), meses, dias da semana, weekend, on + dia ou data, in + mês, cores, família (sister, brother, mother, father), music, teacher, Para a irmã gêmea, diga só: My sister is thirty-four, too! Her birthday is February twenty-ninth, too! Wait a minute, Let me think, Just a second, Sorry, I don't understand, Can you repeat, please? Nora responde com frases de 3 a 6 palavras, deixa ganchos (My birthday is very special!) e devolve perguntas fáceis. Para explicar o 29 de fevereiro, diga só: February twenty-ninth! Only every four years! e deixe o resto para o fechamento em português. Quando ela disser bye, conte em português o que ela descobriu e o que ficou escondido."},

{tipo:"missao", titulo:"Missão: o presente do Max", cena:"presente",

 personagem:"Mr. Ray, dono da loja de presentes, simpático e falante",
 objetivos:["dizer para quem é o presente e quantos anos a pessoa vai fazer","dizer a data do aniversário (para o cartão)","escolher o presente dizendo a cor"],
 andaime:"<p>Se travar: <span class=\"lacuna\">It's for my</span> … · <span class=\"lacuna\">He is</span> … · <span class=\"lacuna\">His birthday is on</span> … · <span class=\"lacuna\">The</span> … <span class=\"lacuna\">one, please</span></p>",
 instrucaoIA:"Ela sabe: família (cousin, brother, sister, mom, dad...), How old is he? He's ..., When is his birthday? It's on ..., números até 100, números de ordem, meses, dias da semana, on + data, in + mês, cores, adjetivo antes do substantivo (a blue book), material escolar, present, birthday, party, game, music, please, thank you, Here you are. Ainda não sabe preços: não fale de dinheiro. Mr. Ray pergunta Who is it for? How old is he? When is his birthday?, mostra duas opções (a red game or a blue book?) e escreve o cartão com a data. Frases de 3 a 6 palavras."},

{tipo:"escrita", titulo:"Projeto da semana: My birthday", id:"1",
 instrucao:"O projeto de hoje: escreva <b>4 ou 5 frases</b> apresentando o seu aniversário e o de alguém da família, como se fosse a página de um calendário de aniversários da turma. Depois leia em voz alta no bloco de baixo.",
 dica:"<ul><li>a sua idade</li><li>a data do seu aniversário, com <b>on</b> e o número de ordem</li><li>o aniversário de uma pessoa da família: a data <b>e</b> a idade dela</li><li>o seu dia favorito da semana</li><li>como é a sua festa dos sonhos (bolo, velas, música, jogos)</li></ul>Sem ajuda hoje: você já sabe tudo isso. 💜",

 frases:[

]},
