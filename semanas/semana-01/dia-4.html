<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6C4AB6">
<title>Semana 1 · Dia 4</title>
<link rel="stylesheet" href="../../assets/curso.css">
</head>
<body>
<script src="../../assets/config.js"></script>
<script src="../../assets/curso.js"></script>
<script>
Curso.montar({
semana:1,
dia:4,
titulo:"Where are you from?",
subtitulo:"Tudo junto: conhecer alguém de verdade, numa videochamada",
objetivos:[
  "Perguntar e dizer de onde a pessoa é",
  "Entender uma conversa inteira em inglês",
  "Conversar com alguém que só fala inglês"
],
blocos:[

{tipo:"gramatica", titulo:"Revisão rápida: I am, you are, Are you...?",
 html:"<p>Tudo o que você aprendeu nesta semana cabe nesta tabelinha:</p>"+
 "<table>"+
 "<tr><th>Para...</th><th>Inglês</th></tr>"+
 "<tr><td>falar de você</td><td><code>I am / I'm</code></td></tr>"+
 "<tr><td>falar com a outra pessoa</td><td><code>You are</code></td></tr>"+
 "<tr><td>perguntar</td><td><code>Are you...?</code></td></tr>"+
 "<tr><td>responder sim / não</td><td><code>Yes, I am. / No, I'm not.</code></td></tr>"+
 "</table>"+
 "<p>E hoje entra a pergunta mais usada do mundo quando duas pessoas se conhecem:</p>"+
 "<p><code>Where are you from?</code> — De onde você é?<br>Resposta: <code>I'm from Brazil.</code></p>"+
 "<p>Repare que ela é a mesma pergunta de ontem, com um <code>where</code> (onde) na frente.</p>",
 exemplos:[
  {en:"Where are you from?", pt:"De onde você é?"},
  {en:"I'm from Brazil.", pt:"Eu sou do Brasil."},
  {en:"Are you from New York?", pt:"Você é de Nova York?"},
  {en:"No, I'm not. I am from Miami.", pt:"Não, não sou. Eu sou de Miami."}
 ]},

{tipo:"vocab", titulo:"Mais frases para conversar", itens:[
 {en:"Excuse me.", pt:"Com licença.", ipa:"/iks-KIÚS mi/", emoji:"🙋"},
 {en:"Where are you from?", pt:"De onde você é?", ipa:"/UÉR ar iu from/", emoji:"🌎"},
 {en:"This is my friend.", pt:"Este é meu amigo. / Esta é minha amiga.", ipa:"/DÍS iz mai frend/", emoji:"👭"},
 {en:"See you tomorrow!", pt:"Até amanhã!", ipa:"/SÍ iu tu-MÓ-rou/", emoji:"📅"},
 {en:"Have a nice day!", pt:"Tenha um bom dia!", ipa:"/HÉV a náis DÊI/", emoji:"🌞"},
 {en:"Of course!", pt:"Claro!", ipa:"/ov KÓRS/", emoji:"👍"},
 {en:"No problem.", pt:"Sem problema.", ipa:"/nôu PRÓ-blem/", emoji:"😎"},
 {en:"Good luck!", pt:"Boa sorte!", ipa:"/gud LÂK/", emoji:"🍀"}
]},

{tipo:"dialogo", titulo:"Ouça: a videochamada", escuta:true, linhas:[
 {quem:"Emma", en:"Hello! Are you Ben?", pt:"Olá! Você é o Ben?"},
 {quem:"Ben", en:"Yes, I am. Hi, Emma!", pt:"Sim, sou. Oi, Emma!"},
 {quem:"Emma", en:"Nice to meet you, Ben. Where are you from?", pt:"Prazer em conhecer você, Ben. De onde você é?"},
 {quem:"Ben", en:"I am from Miami. And you?", pt:"Eu sou de Miami. E você?"},
 {quem:"Emma", en:"I am from New York. How are you?", pt:"Eu sou de Nova York. Como você está?"},
 {quem:"Ben", en:"I am great, thank you. Are you a student?", pt:"Eu estou ótimo, obrigado. Você é aluna?"},
 {quem:"Emma", en:"Yes, I am. I am in class six.", pt:"Sim, sou. Eu estou na turma seis."},
 {quem:"Ben", en:"Nice! My friend Leo is here, too.", pt:"Legal! O meu amigo Leo está aqui também."},
 {quem:"Emma", en:"Hi, Leo! Have a nice day, Ben!", pt:"Oi, Leo! Tenha um bom dia, Ben!"},
 {quem:"Ben", en:"Thank you! See you tomorrow, Emma!", pt:"Obrigado! Até amanhã, Emma!"}
]},

{tipo:"quiz", titulo:"Você entendeu a videochamada?", questoes:[
 {pergunta:"Where is Ben from?", opcoes:["Miami","New York","Brazil"], correta:0,
  explicacao:"Ele diz: I am from Miami."},
 {pergunta:"Where is Emma from?", opcoes:["Miami","New York","Brazil"], correta:1,
  explicacao:"Ela diz: I am from New York."},
 {pergunta:"Is Emma a student?", opcoes:["Yes, she is.","No, she is not.","She is a teacher."], correta:0,
  explicacao:"Ben pergunta Are you a student? e ela responde Yes, I am."},
 {pergunta:"What class is Emma in?", opcoes:["Class six","Class five","Class ten"], correta:0,
  explicacao:"Ela diz: I am in class six."},
 {pergunta:"Who is with Ben?", opcoes:["Leo","Anna","A teacher"], correta:0,
  explicacao:"Ele diz: My friend Leo is here, too."}
]},

{tipo:"ditado", titulo:"Escute e escreva o que eles disseram", itens:[
 {en:"Where are you from", pt:"De onde você é?", dica:"(quatro palavras)"},
 {en:"I am from Miami", pt:"Eu sou de Miami.", dica:"(quatro palavras)"},
 {en:"Are you a student", pt:"Você é aluna?", dica:"(quatro palavras)"},
 {en:"See you tomorrow", pt:"Até amanhã!", dica:"(três palavras)"}
]},

{tipo:"escrita", titulo:"Responda sobre a videochamada", id:"escuta",
 instrucao:"Responda em inglês, com frases completas:<br>1. Where is Ben from? (De onde é o Ben?)<br>2. Where is Emma from? (De onde é a Emma?)<br>3. Is Emma a student? (A Emma é aluna?)",
 dica:"<ul><li>uma frase completa para cada pergunta</li><li>use <b>is</b> para falar do Ben e da Emma</li><li>na terceira, responda sim ou não com a frase inteira</li></ul>",
 andaime:"<p>Comece assim: Ben is from <span class=\"lacuna\">?</span>. · Emma is from <span class=\"lacuna\">?</span>. · Yes, she <span class=\"lacuna\">?</span>.</p>",
 gabarito:"1. Ben is from Miami. 2. Emma is from New York. 3. Yes, she is (a student).",
 instrucaoIA:"Ela ouviu uma videochamada e devia responder por escrito de onde e o Ben (Miami), de onde e a Emma (New York) e se a Emma e aluna (sim). Vocabulario: is, from, where, student, class, friend, here, Are you...?, Yes she is."},

{tipo:"completar", titulo:"Complete as frases", ajuda:"Toque na palavra que falta.", itens:[
 {frase:"___ are you from?", pt:"De onde você é?", resposta:"Where",
  opcoes:["Where","What","How"], explicacao:"where = onde."},
 {frase:"I ___ from Brazil.", pt:"Eu sou do Brasil.", resposta:"am",
  opcoes:["am","are","is"], explicacao:"Com I é sempre am."},
 {frase:"___ you a student?", pt:"Você é aluna?", resposta:"Are",
  opcoes:["Are","Am","Is"], explicacao:"Perguntas com you começam com Are."},
 {frase:"See you ___!", pt:"Até amanhã!", resposta:"tomorrow",
  opcoes:["tomorrow","morning","please"], explicacao:"tomorrow = amanhã."},
 {frase:"___ me, please.", pt:"Com licença, por favor.", resposta:"Excuse",
  opcoes:["Excuse","Sorry","Thank"], explicacao:"Excuse me é o nosso com licença."},
 {frase:"This ___ my friend.", pt:"Esta é minha amiga.", resposta:"is",
  opcoes:["is","am","are"], explicacao:"Para falar de outra pessoa, a palavrinha é is."}
]},

{tipo:"ligar", titulo:"Ligue as frases de conversa", pares:[
 {en:"Excuse me.", pt:"Com licença."},
 {en:"Where are you from?", pt:"De onde você é?"},
 {en:"See you tomorrow!", pt:"Até amanhã!"},
 {en:"Have a nice day!", pt:"Tenha um bom dia!"},
 {en:"Of course!", pt:"Claro!"},
 {en:"Good luck!", pt:"Boa sorte!"}
]},

{tipo:"entrevista", titulo:"O jornal da escola", perfil:"reporter",
 personagem:"Kim, repórter do jornal da escola, curiosa e animada",
 apresentacao:"<p>A Kim está fazendo uma matéria sobre os alunos novos para o <b>jornal da escola</b>. Ela quer falar com você — e ela <b>só fala inglês</b>. Entenda as perguntas e responda!</p>",
 quer:["o nome dela e como se soletra","de onde ela é (a cidade ou o país)","como ela está hoje","o nome de uma amiga dela"],
 andaime:"<p>Se travar: <span class=\"lacuna\">My name is</span> … · <span class=\"lacuna\">I'm from</span> … · <span class=\"lacuna\">This is my friend</span> …</p>",
 instrucaoIA:"Ela sabe: cumprimentos, What's your name?, My name is..., Nice to meet you, How are you?, I'm fine, I'm great, I am / I'm, you are, Are you...?, Yes I am, No I'm not, Where are you from?, I'm from..., This is my friend, happy, sad, tired, hungry, thirsty, ready, student, teacher, girl, boy, friend, class, number, here, new, o alfabeto e os numeros ate twenty. Kim pergunta UMA coisa por vez, com frases de 3 a 6 palavras, e anota. Se ela nao entender, Kim pergunta de outro jeito (mais curto, dando um exemplo sobre ela mesma, ou com duas opcoes) ate 3 vezes. Nao use nenhuma palavra fora dessa lista."},

{tipo:"missao", titulo:"Missão da semana: a videochamada", cena:"ligacao",
 cenario:"<p>A sua escola tem uma turma amiga nos <b>Estados Unidos</b>. Hoje é a sua vez de aparecer na videochamada!</p><p>Do outro lado está a <b>Sophie</b>, que tem a sua idade e <b>só entende inglês</b>. Você tem alguns minutos para se apresentar e conhecer ela.</p>",
 personagem:"Sophie, 11 anos, de Miami, animada e um pouco tagarela",
 objetivos:["cumprimentar a Sophie em inglês","dizer o seu nome e soletrar quando ela pedir","perguntar o nome dela","dizer de onde você é e perguntar de onde ela é","se despedir no fim da chamada"],
 andaime:"<p>Se travar: <span class=\"lacuna\">Hello! My name is</span> … · <span class=\"lacuna\">Where are you</span> …? · <span class=\"lacuna\">See you</span> …!</p>",
 instrucaoIA:"Ela sabe: cumprimentos, What's your name?, My name is..., Nice to meet you, How are you?, I'm fine, I'm great, And you?, I am / I'm, Are you...?, Yes I am, No I'm not, Where are you from?, I'm from..., See you tomorrow, Have a nice day, Excuse me, Of course, No problem, Sorry I don't understand, Again please, Slowly please, o alfabeto, os numeros ate twenty, student, teacher, girl, boy, friend, class, happy, tired, hungry, ready. Sophie e de Miami, esta na class six e tem uma amiga chamada Lily. Ela fala frases de 3 a 6 palavras, uma de cada vez, e pede para soletrar o nome dela (Can you spell it?). Nao use nenhuma palavra fora dessa lista."},

{tipo:"escrita", titulo:"Hora de escrever", id:"1",
 instrucao:"Conte, em <b>4 ou 5 frases</b> em inglês, como foi a videochamada com a Sophie. ✍️",
 dica:"<ul><li>uma frase com o seu nome</li><li>uma frase dizendo de onde você é</li><li>uma frase com o nome da Sophie</li><li>uma frase dizendo de onde ela é</li><li>uma frase dizendo como você está depois da conversa</li></ul>Use <b>is</b> quando falar da Sophie. 💜",
 andaime:"<p>O molde é este — quem preenche é você:</p><p>My name is <span class=\"lacuna\">?</span>.<br>I'm from <span class=\"lacuna\">?</span>.<br><span class=\"lacuna\">?</span> is from <span class=\"lacuna\">?</span>.<br>I am <span class=\"lacuna\">?</span>!</p>",
 gabarito:"4 ou 5 frases: o nome dela, de onde ela e (I'm from Brazil), o nome da Sophie, de onde a Sophie e (Miami) e como ela esta depois da conversa (happy / great / tired).",
 instrucaoIA:"Ela devia contar em 4 ou 5 frases como foi a videochamada com a Sophie, uma menina de Miami. Vocabulario da aula: I am / I'm, is, Where are you from?, I'm from, name, friend, student, class, happy, tired, great, fine, numeros ate twenty. Repare se ela usou is para falar da Sophie e am para falar dela mesma. Corrija no maximo 3 coisas, em portugues."},

{tipo:"fala", titulo:"Hora de falar: aquecimento para a missão",
 instrucao:"Estas são as frases da videochamada. Ouça, repita e teste no 🎤 antes de começar a missão.",
 frases:[
  {en:"Hello! My name is Anna.", pt:"Olá! Meu nome é Anna."},
  {en:"Where are you from?", pt:"De onde você é?"},
  {en:"I'm from Brazil.", pt:"Eu sou do Brasil."},
  {en:"Nice to meet you!", pt:"Prazer em conhecer você!"},
  {en:"See you tomorrow!", pt:"Até amanhã!"}
 ],
 instrucaoIA:"Primeiro peca para ela repetir as frases acima e corrija a pronuncia em portugues (o r de from e bem leve; tomorrow tem a forca no MO). Depois faca 4 a 6 perguntas em ingles, uma de cada vez, esperando a resposta FALADA dela: What's your name? / Where are you from? / Are you a student? / How are you today? / Are you ready? Use so estas palavras: name, where, from, are you, student, teacher, friend, ready, happy, tired, how, today."},

{tipo:"ditado", bonus:true, titulo:"Frases inteiras: escute e escreva", itens:[
 {en:"Excuse me, are you from Miami?", pt:"Com licença, você é de Miami?", dica:"(seis palavras)"},
 {en:"This is my friend and she is nice", pt:"Esta é a minha amiga e ela é legal.", dica:"(oito palavras)"},
 {en:"Where are you from, Emma?", pt:"De onde você é, Emma?", dica:"(cinco palavras)"}
]},

{tipo:"escrita", bonus:true, titulo:"Escreva uma mensagem para a Sophie", id:"bonus",
 instrucao:"A Sophie mandou uma mensagem: <i>Hi! Are you a student? Where are you from?</i> Responda a mensagem dela em inglês, com <b>3 ou 4 frases</b>, e faça <b>duas perguntas</b> para ela no fim.",
 dica:"<ul><li>comece com um cumprimento</li><li>responda as duas perguntas dela</li><li>termine com duas perguntas suas, começando com <b>Are you...?</b> ou <b>Where...?</b></li></ul>",
 gabarito:"3 ou 4 frases respondendo que ela e student e de onde ela e, mais duas perguntas para a Sophie (Are you...? / Where are you from? / How are you?).",
 instrucaoIA:"Desafio bonus: ela devia responder uma mensagem da Sophie com 3 ou 4 frases E fazer duas perguntas. Vocabulario: I am / I'm, Are you...?, Where are you from?, student, class, friend, happy, tired, ready, numeros ate twenty. Confira principalmente se as PERGUNTAS dela estao na ordem certa (Are you... / Where are you...). Corrija em portugues, com carinho."}

]});
</script>
</body>
</html>
