<script>
Curso.montar({
semana:1,
dia:1,
titulo:"Hello! Nice to meet you",
subtitulo:"Cumprimentar, dizer o seu nome e conhecer alguém novo",
objetivos:[
  "Cumprimentar em inglês na hora certa do dia",
  "Dizer o seu nome e responder como você está",
  "Pedir ajuda quando não entender: Again, please!"
],
blocos:[

{tipo:"nota", titulo:"💜 Bem-vinda à sua primeira aula!",
 html:"<p>Hoje você já vai <b>falar com alguém em inglês</b>. Sério.</p>"+
 "<p>Duas coisas para os seus ouvidos, desde já:</p>"+
 "<ul>"+
 "<li>O <b>h</b> de <code>hello</code> é um <b>sopro</b>, como quando você embaça um espelho. Não é o R de <i>rato</i>.</li>"+
 "<li>O <b>th</b> de <code>thank you</code> sai com a <b>língua entre os dentes</b>, soprando. Fica parecido com um F.</li>"+
 "</ul>"+
 "<p>Toque em todos os 🔊 e repita <b>em voz alta</b>. Ninguém está ouvindo. 😄</p>"},

{tipo:"vocab", titulo:"Olá! e Tchau!", itens:[
 {en:"hello", pt:"olá", ipa:"/hê-LÔU/", emoji:"👋"},
 {en:"hi", pt:"oi", ipa:"/hái/", emoji:"🙋"},
 {en:"good morning", pt:"bom dia", ipa:"/gud MÓR-nin/", emoji:"🌅"},
 {en:"good afternoon", pt:"boa tarde", ipa:"/gud af-ter-NÚN/", emoji:"☀️"},
 {en:"good evening", pt:"boa noite (ao chegar)", ipa:"/gud ÍV-nin/", emoji:"🌆"},
 {en:"good night", pt:"boa noite (ao ir dormir)", ipa:"/gud NÁIT/", emoji:"🌙"},
 {en:"goodbye", pt:"tchau", ipa:"/gud-BÁI/", emoji:"👋"},
 {en:"bye", pt:"tchau (bem curtinho)", ipa:"/bái/", emoji:"✌️"}
]},

{tipo:"vocab", titulo:"Prazer em conhecer você", itens:[
 {en:"What's your name?", pt:"Qual é o seu nome?", ipa:"/uóts iór NÊIM/", emoji:"❓"},
 {en:"My name is...", pt:"Meu nome é...", ipa:"/mai NÊIM iz/", emoji:"🏷️"},
 {en:"Nice to meet you!", pt:"Prazer em conhecer você!", ipa:"/náis tu MÍT iu/", emoji:"🤝"},
 {en:"How are you?", pt:"Como você está?", ipa:"/háu ar IÚ/", emoji:"🙂"},
 {en:"I'm fine.", pt:"Eu estou bem.", ipa:"/aim FÁIN/", emoji:"👍"},
 {en:"I'm great!", pt:"Eu estou ótima!", ipa:"/aim GRÊIT/", emoji:"🤩"},
 {en:"And you?", pt:"E você?", ipa:"/end IÚ/", emoji:"↩️"},
 {en:"please", pt:"por favor", ipa:"/plíz/", emoji:"🙏"},
 {en:"thank you", pt:"obrigada", ipa:"/FÊNK iu/", emoji:"💝"},
 {en:"You're welcome.", pt:"De nada.", ipa:"/iór UÉL-cam/", emoji:"😊"}
]},

{tipo:"vocab", titulo:"Frases para conversar (guarde estas!)", itens:[
 {en:"Sorry, I don't understand.", pt:"Desculpa, eu não entendi.", ipa:"/SÓ-ri ai dont an-der-STÉND/", emoji:"😅"},
 {en:"Again, please.", pt:"De novo, por favor.", ipa:"/a-GUÉN plíz/", emoji:"🔁"},
 {en:"Slowly, please.", pt:"Devagar, por favor.", ipa:"/SLÔU-li plíz/", emoji:"🐢"},
 {en:"I don't know.", pt:"Eu não sei.", ipa:"/ai dont NÔU/", emoji:"🤷"}
]},

{tipo:"dialogo", titulo:"O primeiro dia na escola nova", escuta:false, linhas:[
 {quem:"Anna", en:"Hello! My name is Anna.", pt:"Olá! Meu nome é Anna."},
 {quem:"Emma", en:"Hi, Anna! I am Emma. Nice to meet you!", pt:"Oi, Anna! Eu sou a Emma. Prazer em conhecer você!"},
 {quem:"Anna", en:"Nice to meet you, Emma!", pt:"Prazer em conhecer você, Emma!"},
 {quem:"Emma", en:"How are you?", pt:"Como você está?"},
 {quem:"Anna", en:"I'm fine, thank you. And you?", pt:"Eu estou bem, obrigada. E você?"},
 {quem:"Emma", en:"I'm great! Welcome to my school!", pt:"Eu estou ótima! Bem-vinda à minha escola!"},
 {quem:"Anna", en:"Sorry, I don't understand. Again, please.", pt:"Desculpa, eu não entendi. De novo, por favor."},
 {quem:"Emma", en:"Welcome to my school! I am your new friend.", pt:"Bem-vinda à minha escola! Eu sou a sua amiga nova."},
 {quem:"Anna", en:"Thank you, Emma! Goodbye!", pt:"Obrigada, Emma! Tchau!"},
 {quem:"Emma", en:"Goodbye, Anna!", pt:"Tchau, Anna!"}
]},

{tipo:"ligar", titulo:"Ligue as traduções", pares:[
 {en:"hello", pt:"olá"},
 {en:"good morning", pt:"bom dia"},
 {en:"good afternoon", pt:"boa tarde"},
 {en:"good night", pt:"boa noite"},
 {en:"goodbye", pt:"tchau"},
 {en:"please", pt:"por favor"},
 {en:"thank you", pt:"obrigada"},
 {en:"sorry", pt:"desculpa"}
]},

{tipo:"quiz", titulo:"Escolha a resposta certa", questoes:[
 {pergunta:"São 8 da manhã e você encontra a professora. O que você diz?",
  opcoes:["Good night!","Good morning!","Goodbye!"], correta:1,
  explicacao:"De manhã é sempre good morning. Good night é só na hora de dormir."},
 {pergunta:"Como você pergunta o nome de alguém?",
  opcoes:["How are you?","What's your name?","Nice to meet you!"], correta:1,
  explicacao:"What's your name? = Qual é o seu nome?"},
 {pergunta:"Alguém diz \"Nice to meet you!\". O que isso significa?",
  opcoes:["Prazer em conhecer você!","Como você está?","Até amanhã!"], correta:0,
  explicacao:"É o que se diz quando duas pessoas se conhecem pela primeira vez."},
 {pergunta:"A sua amiga fala rápido demais. O que você pede?",
  opcoes:["Slowly, please.","Thank you.","Good evening."], correta:0,
  explicacao:"Slowly = devagar. Esta frase salva qualquer conversa!"},
 {pergunta:"Você não entendeu nada do que ela falou. O que você diz?",
  opcoes:["I'm fine.","Sorry, I don't understand.","Nice to meet you!"], correta:1,
  explicacao:"Pedir ajuda em inglês também é falar inglês. 💪"},
 {pergunta:"Alguém diz \"Thank you!\". O que você responde?",
  opcoes:["You're welcome.","Good evening.","Again, please."], correta:0,
  explicacao:"You're welcome = De nada."}
]},

{tipo:"completar", titulo:"Complete as frases", ajuda:"Toque na palavra que falta.", itens:[
 {frase:"___ morning, Anna!", pt:"Bom dia, Anna!", resposta:"Good",
  opcoes:["Good","Nice","Thank"], explicacao:"good morning = bom dia."},
 {frase:"Nice to ___ you!", pt:"Prazer em conhecer você!", resposta:"meet",
  opcoes:["meet","name","fine"], explicacao:"meet = conhecer, encontrar."},
 {frase:"What's your ___?", pt:"Qual é o seu nome?", resposta:"name",
  opcoes:["name","nice","good"], explicacao:"name = nome."},
 {frase:"How ___ you?", pt:"Como você está?", resposta:"are",
  opcoes:["are","am","is"], explicacao:"Com you é sempre are."},
 {frase:"___, I don't understand.", pt:"Desculpa, eu não entendi.", resposta:"Sorry",
  opcoes:["Sorry","Please","Again"], explicacao:"sorry = desculpa."}
]},

{tipo:"ditado", titulo:"Escute e escreva", itens:[
 {en:"Good morning", pt:"Bom dia", dica:"(duas palavras)"},
 {en:"How are you", pt:"Como você está?", dica:"(três palavras)"},
 {en:"My name is Anna", pt:"Meu nome é Anna.", dica:"(quatro palavras)"},
 {en:"Nice to meet you", pt:"Prazer em conhecer você!", dica:"(quatro palavras)"},
 {en:"Welcome to my school", pt:"Bem-vinda à minha escola.", dica:"(quatro palavras)"}
]},

{tipo:"adivinha", titulo:"O que você diz? Escreva em inglês", itens:[
 {pistas:["It is 8. You are at school.","It is not afternoon. It is not night.","You meet your new friend at school."],
  resposta:"good morning", pt:"bom dia", dica:"(duas palavras)",
  explicacao:"De manhã, a gente diz good morning."},
 {pistas:["It is 9 at night.","It is not morning.","It is not afternoon."],
  resposta:"good night", pt:"boa noite", dica:"(duas palavras)",
  explicacao:"Good night é a boa noite de quem vai dormir."},
 {pistas:["Your new friend is very nice to you.","You are nice to her, too.","Your friend: You're welcome!"],
  resposta:"thank you", pt:"obrigada", dica:"(duas palavras)",
  explicacao:"thank you = obrigada. O th sai com a língua entre os dentes."}
]},

{tipo:"ligar", titulo:"Ligue as frases de conversa", pares:[
 {en:"Again, please.", pt:"De novo, por favor."},
 {en:"Slowly, please.", pt:"Devagar, por favor."},
 {en:"I don't know.", pt:"Eu não sei."},
 {en:"How are you?", pt:"Como você está?"},
 {en:"You're welcome.", pt:"De nada."}
]},

{tipo:"explorar", titulo:"Quem é o Bip?", perfil:"fantasia", voz:"m",
 personagem:"Bip, um robô pequeno e simpático, muito educado e um pouco atrapalhado",
 apresentacao:"<p>Um robô pequeno acabou de acender as luzinhas na sua mesa. Ele pisca e espera você falar. Ele <b>só entende inglês</b> — descubra quem ele é!</p>",
 segredos:["o nome dele é Bip e ele adora ser cumprimentado","ele diz Good morning o dia inteiro, até de noite, e acha isso muito engraçado","ele está ótimo hoje: I'm great!","quando alguém fala rápido, ele pede Slowly, please","surpresa: ele tem uma amiga robô chamada Nina, que só sabe dizer Hello"],
 pistas:["como ele se chama","um cumprimento que ele adora dizer","como ele está hoje","o que ele pede quando não entende","surpresa: alguém que ele conhece"],
 andaime:"<p>Para começar: <span class=\"lacuna\">Hello! What's your</span> …? · <span class=\"lacuna\">How are</span> …?</p>",
 instrucaoIA:"Ela sabe: hello, hi, good morning, good afternoon, good evening, good night, goodbye, bye, What's your name?, My name is..., Nice to meet you!, How are you?, I'm fine, I'm great, And you?, please, thank you, You're welcome, Sorry I don't understand, Again please, Slowly please, I don't know. Bip fala frases de 3 a 6 palavras, responde curto, devolve perguntas fáceis (What's your name? How are you?) e deixa ganchos para ela continuar perguntando. Nao use nenhuma palavra fora dessa lista."},

{tipo:"missao", titulo:"Missão: a colega nova", cena:"apresentacao",
 cenario:"<p>Primeiro dia numa escola nos Estados Unidos. Uma menina senta do seu lado e sorri para você. O nome dela é <b>Emma</b> — e ela <b>só entende inglês</b>.</p><p>Diga oi e conte quem você é!</p>",
 personagem:"Emma, 11 anos, colega de classe, animada e falante",
 objetivos:["cumprimentar a Emma em inglês","dizer o seu nome para ela"],
 andaime:"<p>Se travar: <span class=\"lacuna\">Hello! My name</span> … · <span class=\"lacuna\">Nice to meet</span> …</p>",
 instrucaoIA:"Ela sabe: hello, hi, good morning/afternoon/evening/night, goodbye, bye, What's your name?, My name is..., Nice to meet you!, How are you?, I'm fine, I'm great, And you?, please, thank you, You're welcome, Sorry I don't understand, Again please, Slowly please. Emma fala frases de 3 a 6 palavras, cumprimenta primeiro e pergunta o nome dela. Se ela escrever em portugues, Emma diz que nao entendeu e repete mais devagar. Nao use nenhuma palavra fora dessa lista."},

{tipo:"escrita", titulo:"Hora de escrever", id:"1",
 instrucao:"Escreva <b>4 ou 5 frases</b> em inglês se apresentando para uma amiga nova. Depois toque no botão para a IA corrigir. ✍️",
 dica:"<ul><li>um cumprimento (de manhã, de tarde ou de noite)</li><li>uma frase com o seu nome</li><li>uma frase dizendo que é um prazer conhecê-la</li><li>uma frase dizendo como você está</li><li>uma despedida</li></ul>Tente sem olhar para cima. 💜",
 andaime:"<p>O molde é este — quem preenche é você:</p><p>Hello! My name is <span class=\"lacuna\">?</span>.<br>Nice to <span class=\"lacuna\">?</span> you!<br>I'm <span class=\"lacuna\">?</span>.<br><span class=\"lacuna\">?</span>!</p>",
 gabarito:"4 ou 5 frases cobrindo: um cumprimento (Hello / Good morning), o nome (My name is...), Nice to meet you, como ela está (I'm fine / I'm great) e uma despedida (Goodbye / Bye).",
 instrucaoIA:"Ela devia escrever 4 ou 5 frases se apresentando. Vocabulario da aula: hello, hi, good morning, good afternoon, good evening, good night, goodbye, bye, What's your name?, My name is..., Nice to meet you!, How are you?, I'm fine, I'm great, And you?, please, thank you, You're welcome, sorry, again, slowly. E o primeiro dia de aula dela: elogie muito, corrija no maximo 3 coisas e em portugues."},

{tipo:"fala", titulo:"Hora de falar",
 instrucao:"Ouça, repita em voz alta e depois teste no 🎤.",
 foco:"o <b>th</b> de <i>thank you</i>: a língua vai <b>entre os dentes</b> e você sopra (fica quase um F). E o <b>h</b> de <i>hello</i> é só um sopro — nada de R!",
 frases:[
  {en:"Hello! My name is Anna.", pt:"Olá! Meu nome é Anna."},
  {en:"Nice to meet you!", pt:"Prazer em conhecer você!"},
  {en:"How are you?", pt:"Como você está?"},
  {en:"I'm fine, thank you.", pt:"Eu estou bem, obrigada."},
  {en:"Good morning!", pt:"Bom dia!"},
  {en:"Sorry, I don't understand.", pt:"Desculpa, eu não entendi."},
  {en:"Goodbye!", pt:"Tchau!"}
 ],
 instrucaoIA:"Primeiro peca para ela repetir as frases acima e corrija a pronuncia em portugues, com atencao ao th de thank you e ao h de hello. Depois faca 4 a 6 perguntas faceis em ingles, uma de cada vez, e espere a resposta FALADA dela antes da proxima: Hello! What's your name? / How are you? / Nice to meet you! (espere ela responder) / Good morning or good night? / Goodbye! Use so estas palavras: hello, hi, good morning, good afternoon, good night, goodbye, name, nice, meet, how, fine, great, please, thank you."},

{tipo:"completar", bonus:true, titulo:"Sem opções: digite a palavra que falta", itens:[
 {frase:"Good ___! It is 9 at night.", pt:"Boa noite! São 9 da noite.", resposta:"night",
  explicacao:"À noite, na hora de dormir: good night."},
 {frase:"___ to meet you!", pt:"Prazer em conhecer você!", resposta:"Nice",
  explicacao:"nice = legal, agradável."},
 {frase:"I'm ___, thank you.", pt:"Eu estou bem, obrigada.", resposta:"fine",
  explicacao:"fine = bem."},
 {frase:"You're ___.", pt:"De nada.", resposta:"welcome",
  explicacao:"You're welcome é a resposta de thank you."}
]},

{tipo:"ordenar", bonus:true, titulo:"Monte as frases grandes", itens:[
 {frase:"Good morning my name is Emma", pt:"Bom dia, meu nome é Emma."},
 {frase:"Hi I am your new friend Leo", pt:"Oi, eu sou o seu amigo novo, Leo."},
 {frase:"Sorry I don't know your name", pt:"Desculpa, eu não sei o seu nome."}
]}

]});
