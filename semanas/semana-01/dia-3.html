<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6C4AB6">
<title>Semana 1 · Dia 3</title>
<link rel="stylesheet" href="../../assets/curso.css">
</head>
<body>
<script src="../../assets/config.js"></script>
<script src="../../assets/curso.js"></script>
<script>
Curso.montar({
semana:1, dia:3,
titulo:"I am, you are, she is",
subtitulo:"O verbo mais importante do inglês: TO BE",
objetivos:[
  "Usar I am, you are, he is, she is, it is, we are, they are",
  "Falar sobre você e sobre outras pessoas",
  "Entender as formas curtas (I'm, you're, she's...)"
],
blocos:[

{tipo:"nota", titulo:"⭐ O verbo mais usado do inglês",
 html:"<p>O verbo <b>TO BE</b> significa <b>SER</b> e <b>ESTAR</b> ao mesmo tempo! Uma palavra só para as duas coisas.</p><p>Se você aprender bem o TO BE hoje, metade do inglês fica mais fácil. É sério. 💪</p>"},

{tipo:"gramatica", titulo:"O verbo TO BE (ser / estar)",
 html:"<table>"+
 "<tr><th>Inglês</th><th>Forma curta</th><th>Português</th></tr>"+
 "<tr><td>I <b>am</b></td><td><code>I'm</code></td><td>Eu sou / eu estou</td></tr>"+
 "<tr><td>You <b>are</b></td><td><code>You're</code></td><td>Você é / você está</td></tr>"+
 "<tr><td>He <b>is</b></td><td><code>He's</code></td><td>Ele é / ele está</td></tr>"+
 "<tr><td>She <b>is</b></td><td><code>She's</code></td><td>Ela é / ela está</td></tr>"+
 "<tr><td>It <b>is</b></td><td><code>It's</code></td><td>É / está (coisa ou animal)</td></tr>"+
 "<tr><td>We <b>are</b></td><td><code>We're</code></td><td>Nós somos / estamos</td></tr>"+
 "<tr><td>They <b>are</b></td><td><code>They're</code></td><td>Eles/elas são / estão</td></tr>"+
 "</table>"+
 "<p>🎵 Truque para decorar: <b>I am, he is, she is, it is</b> — o resto é <b>are</b>!</p>"+
 "<p>Para dizer que <b>não</b> é, basta colocar <code>not</code> depois: <code>I am not tired.</code> (Eu não estou cansada.)</p>",
 exemplos:[
  {en:"I'm Brazilian.", pt:"Eu sou brasileira."},
  {en:"You're my friend.", pt:"Você é minha amiga."},
  {en:"She's my sister.", pt:"Ela é minha irmã."},
  {en:"He's eleven years old.", pt:"Ele tem onze anos. (em inglês: ele É onze anos!)"},
  {en:"It's a big dog.", pt:"É um cachorro grande."},
  {en:"We're happy today.", pt:"Nós estamos felizes hoje."},
  {en:"They're my parents.", pt:"Eles são meus pais."},
  {en:"I'm not tired.", pt:"Eu não estou cansada."}
 ]},

{tipo:"vocab", titulo:"Palavras para descrever", itens:[
 {en:"happy", pt:"feliz", emoji:"😄"},
 {en:"sad", pt:"triste", emoji:"😢"},
 {en:"tired", pt:"cansada(o)", emoji:"😴"},
 {en:"hungry", pt:"com fome", emoji:"🍕"},
 {en:"thirsty", pt:"com sede", emoji:"🥤"},
 {en:"big", pt:"grande", emoji:"🐘"},
 {en:"small", pt:"pequeno(a)", emoji:"🐭"},
 {en:"nice", pt:"legal, gentil", emoji:"💖"},
 {en:"my friend", pt:"meu amigo / minha amiga", emoji:"👭"},
 {en:"my best friend", pt:"meu melhor amigo / minha melhor amiga", emoji:"🤝"},
 {en:"my teacher", pt:"meu professor / minha professora", emoji:"👩‍🏫"},
 {en:"my mother", pt:"minha mãe", emoji:"👩"},
 {en:"my sister", pt:"minha irmã", emoji:"👧"},
 {en:"my parents", pt:"meus pais", emoji:"👨‍👩‍👧"},
 {en:"student", pt:"aluno / aluna", emoji:"🎒"}
]},

{tipo:"dialogo", titulo:"Na sala de aula", linhas:[
 {quem:"Teacher", en:"Good morning! I'm your English teacher.", pt:"Bom dia! Eu sou a sua professora de inglês."},
 {quem:"Anna", en:"Good morning! I'm Anna. This is my friend Leo.", pt:"Bom dia! Eu sou a Anna. Este é meu amigo Leo."},
 {quem:"Teacher", en:"Nice to meet you, Leo. Are you eleven?", pt:"Prazer em conhecer você, Leo. Você tem onze anos?"},
 {quem:"Leo", en:"Yes, I am. Anna is eleven too.", pt:"Sim, tenho. A Anna também tem onze."},
 {quem:"Teacher", en:"Wonderful! You are my new students.", pt:"Maravilhoso! Vocês são meus novos alunos."},
 {quem:"Anna", en:"We're very happy to be here!", pt:"Nós estamos muito felizes de estar aqui!"}
]},

{tipo:"completar", titulo:"am, is ou are?", ajuda:"Escolha a forma certa do verbo TO BE.", itens:[
 {frase:"I ___ Brazilian.", pt:"Eu sou brasileira.", resposta:"am", opcoes:["am","is","are"], explicacao:"Com I é SEMPRE am."},
 {frase:"She ___ my sister.", pt:"Ela é minha irmã.", resposta:"is", opcoes:["am","is","are"], explicacao:"He, she e it usam is."},
 {frase:"They ___ my friends.", pt:"Eles são meus amigos.", resposta:"are", opcoes:["am","is","are"], explicacao:"They usa are."},
 {frase:"You ___ very nice.", pt:"Você é muito legal.", resposta:"are", opcoes:["am","is","are"], explicacao:"You sempre usa are, mesmo para uma pessoa só."},
 {frase:"It ___ a small dog.", pt:"É um cachorro pequeno.", resposta:"is", opcoes:["am","is","are"], explicacao:"It é usado para coisas e animais."},
 {frase:"We ___ hungry!", pt:"Nós estamos com fome!", resposta:"are", opcoes:["am","is","are"], explicacao:"We usa are."}
]},

{tipo:"quiz", titulo:"Escolha a resposta certa", questoes:[
 {pergunta:"Qual é a forma curta de 'She is'?", opcoes:["She're","She's","Shes"], correta:1,
  explicacao:"She is = She's. O apóstrofo (') substitui o i que sumiu."},
 {pergunta:"Como se diz 'Eu tenho 11 anos' em inglês?", opcoes:["I have eleven years.","I am eleven years old.","I is eleven."], correta:1,
  explicacao:"Em inglês a idade usa o verbo TO BE: I AM eleven years old. Nunca 'I have'!"},
 {pergunta:"Qual frase está CERTA?", opcoes:["He are my friend.","He is my friend.","He am my friend."], correta:1,
  explicacao:"He usa is."},
 {pergunta:"'Eu não estou triste' em inglês é:", opcoes:["I am not sad.","I no sad.","I not am sad."], correta:0,
  explicacao:"O not vem SEMPRE depois do am/is/are."},
 {pergunta:"'It's a big dog' significa:", opcoes:["Ele é um cachorro grande.","É um cachorro grande.","Eles são cachorros grandes."], correta:1,
  explicacao:"It usamos para animais e coisas: 'é'."}
]},

{tipo:"ordenar", titulo:"Monte as frases", itens:[
 {frase:"She is my best friend", pt:"Ela é minha melhor amiga."},
 {frase:"We are very happy today", pt:"Nós estamos muito felizes hoje."},
 {frase:"I am not tired", pt:"Eu não estou cansada."}
]},

{tipo:"ditado", titulo:"Escute e escreva", itens:[
 {en:"I am happy", pt:"Eu estou feliz."},
 {en:"He is my friend", pt:"Ele é meu amigo."},
 {en:"They are students", pt:"Eles são alunos."}
]},

{tipo:"ligar", titulo:"Ligue as traduções", pares:[
 {en:"hungry", pt:"com fome"},
 {en:"tired", pt:"cansada"},
 {en:"happy", pt:"feliz"},
 {en:"small", pt:"pequeno"},
 {en:"my teacher", pt:"minha professora"},
 {en:"sad", pt:"triste"}
]},

{tipo:"escrita", titulo:"Hora de escrever", id:"1",
 instrucao:"Escreva <b>5 frases</b> com o verbo TO BE: uma sobre você, uma sobre a sua mãe ou o seu pai, uma sobre um amigo, uma sobre um animal e uma frase <b>negativa</b>.",
 dica:"<ul><li>frase 1: sobre <b>você</b> (comece com I)</li><li>frase 2: sobre a sua <b>mãe ou pai</b> (she / he)</li><li>frase 3: sobre um <b>amigo</b></li><li>frase 4: sobre um <b>animal</b> (it)</li><li>frase 5: uma frase com <b>not</b></li></ul>O desafio de hoje é escolher certo entre <b>am</b>, <b>is</b> e <b>are</b> em cada frase.",
 andaime:"<p>Os cinco moldes. Você escolhe o verbo e completa o resto:</p><p style=\"font-size:17px;line-height:2\">I <span class=\"lacuna\">?</span> ... years old.<br>She <span class=\"lacuna\">?</span> very ... .<br>My friend <span class=\"lacuna\">?</span> ... .<br>It <span class=\"lacuna\">?</span> a ... .<br>I <span class=\"lacuna\">?</span> not ... .</p><p style=\"font-size:14px;color:#6E6A80\">Lembre do truque: <b>I am</b>, <b>he/she/it is</b>, e o resto é <b>are</b>.</p>",
 gabarito:"5 frases com o verbo to be correto em cada pessoa (I am, she/he is, it is) e uma frase negativa com not depois do verbo",
 instrucaoIA:"Ela devia escrever 5 frases usando o verbo to be (am/is/are), incluindo uma frase negativa com not. Assuntos: ela mesma, um dos pais, um amigo, um animal, e uma frase negativa. Vocabulário da aula: am/is/are, I'm/you're/he's/she's/it's/we're/they're, happy, sad, tired, hungry, thirsty, big, small, nice, my friend, my teacher, years old."},

{tipo:"fala", titulo:"Hora de falar",
 instrucao:"Ouça cada frase, repita bem alto e teste no 🎤.",
 frases:[
  {en:"I am eleven years old.", pt:"Eu tenho onze anos."},
  {en:"I am Brazilian.", pt:"Eu sou brasileira."},
  {en:"She is my mother.", pt:"Ela é minha mãe."},
  {en:"He is my friend.", pt:"Ele é meu amigo."},
  {en:"We are very happy.", pt:"Nós estamos muito felizes."},
  {en:"I am not tired.", pt:"Eu não estou cansada."}
 ],
 instrucaoIA:"Praticar o verbo to be (am/is/are) falando. Depois das frases, faça 3 perguntas fáceis para ela responder com o verbo to be, como 'Are you happy today?', 'How old are you?', 'Is your mother nice?'."}

]});
</script>
</body>
</html>
