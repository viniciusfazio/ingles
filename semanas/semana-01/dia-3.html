<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6C4AB6">
<title>Semana 1 · Dia 3</title>
<link rel="stylesheet" href="../../assets/curso.css">
</head>
<body>
<script src="../../assets/config.js"></script>
<script src="../../assets/curso.js"></script>
<script>
Curso.montar({
semana:1,
dia:3,
titulo:"Are you happy?",
subtitulo:"Fazer perguntas em inglês e responder Yes, I am / No, I'm not",
objetivos:[
  "Perguntar usando Are you...?",
  "Responder Yes, I am ou No, I'm not",
  "Contar de 11 a 20 e dizer como você está"
],
blocos:[

{tipo:"nota", titulo:"❓ Hoje você aprende a PERGUNTAR",
 html:"<p>Ontem você aprendeu a falar de você: <code>I am a student</code>.</p>"+
 "<p>Hoje é o contrário: você vai <b>perguntar</b> as coisas para a outra pessoa. E o truque é lindo de simples — a palavrinha <b>troca de lugar</b>:</p>"+
 "<p><code>You are happy.</code> → <code>Are you happy?</code></p>"+
 "<p>É só isso! Não existe \"você faz\" nem nada disso. O <code>are</code> pula para a frente e a frase vira pergunta. 🎉</p>"},

{tipo:"gramatica", titulo:"Are you...? — perguntar e responder",
 html:"<p>Com <code>you</code> (você), a palavrinha é <code>are</code>:</p>"+
 "<table>"+
 "<tr><th>Inglês</th><th>Português</th></tr>"+
 "<tr><td><code>You are my friend.</code></td><td>Você é minha amiga.</td></tr>"+
 "<tr><td><code>Are you my friend?</code></td><td>Você é minha amiga?</td></tr>"+
 "<tr><td><code>Yes, I am.</code></td><td>Sim, sou. / Sim, estou.</td></tr>"+
 "<tr><td><code>No, I'm not.</code></td><td>Não, não sou. / Não, não estou.</td></tr>"+
 "</table>"+
 "<p>Para responder <b>sim</b>, você volta para o <code>I am</code>. Para responder <b>não</b>, entra a palavrinha <code>not</code>: <code>I'm not</code>.</p>"+
 "<p>Cuidado com uma armadilha: em inglês não se responde só <i>yes</i> ou <i>no</i> — soa seco. A resposta bonita é <code>Yes, I am.</code> 😊</p>",
 exemplos:[
  {en:"You are my friend.", pt:"Você é minha amiga."},
  {en:"Are you happy?", pt:"Você está feliz?"},
  {en:"Yes, I am.", pt:"Sim, estou."},
  {en:"Are you a student?", pt:"Você é aluna?"},
  {en:"No, I'm not. I am a teacher.", pt:"Não, não sou. Eu sou professora."},
  {en:"Are you tired?", pt:"Você está cansada?"}
 ]},

{tipo:"vocab", titulo:"Números de 11 a 20", itens:[
 {en:"eleven", pt:"onze", ipa:"/i-LÉ-ven/"},
 {en:"twelve", pt:"doze", ipa:"/TUÉLV/"},
 {en:"thirteen", pt:"treze", ipa:"/fêr-TÍN/"},
 {en:"fourteen", pt:"quatorze", ipa:"/fór-TÍN/"},
 {en:"fifteen", pt:"quinze", ipa:"/fif-TÍN/"},
 {en:"sixteen", pt:"dezesseis", ipa:"/siks-TÍN/"},
 {en:"seventeen", pt:"dezessete", ipa:"/sé-ven-TÍN/"},
 {en:"eighteen", pt:"dezoito", ipa:"/êi-TÍN/"},
 {en:"nineteen", pt:"dezenove", ipa:"/náin-TÍN/"},
 {en:"twenty", pt:"vinte", ipa:"/TUÉN-ti/"}
]},

{tipo:"vocab", titulo:"Como você está?", itens:[
 {en:"happy", pt:"feliz", ipa:"/HÉ-pi/", emoji:"😀"},
 {en:"sad", pt:"triste", ipa:"/SÉD/", emoji:"🙁"},
 {en:"tired", pt:"cansada, cansado", ipa:"/TÁI-erd/", emoji:"😴"},
 {en:"hungry", pt:"com fome", ipa:"/HÂN-gri/", emoji:"🍎"},
 {en:"thirsty", pt:"com sede", ipa:"/FÊRS-ti/", emoji:"🥤"},
 {en:"ready", pt:"pronta, pronto", ipa:"/RÉ-di/", emoji:"✅"},
 {en:"today", pt:"hoje", ipa:"/tu-DÊI/", emoji:"📅"}
]},

{tipo:"historia", titulo:"Ouça: a aluna nova", cena:"amizade", paragrafos:[
 {en:"Anna is a new student. She is at a new school.", pt:"A Anna é uma aluna nova. Ela está numa escola nova."},
 {en:"It is morning. Anna is not happy. She is sad.", pt:"É de manhã. A Anna não está feliz. Ela está triste."},
 {en:"A girl is here. Her name is Emma.", pt:"Uma menina está aqui. O nome dela é Emma."},
 {en:"\"Good morning! I am Emma. What is your name?\"", pt:"— Bom dia! Eu sou a Emma. Qual é o seu nome?"},
 {en:"\"My name is Anna. Nice to meet you!\"", pt:"— Meu nome é Anna. Prazer em conhecer você!"},
 {en:"\"Are you new here?\" \"Yes, I am.\"", pt:"— Você é nova aqui? — Sim, eu sou."},
 {en:"\"Are you sad?\" \"I am fine now, thank you.\"", pt:"— Você está triste? — Eu estou bem agora, obrigada."},
 {en:"Emma is a new friend. Anna is happy!", pt:"A Emma é uma amiga nova. A Anna está feliz!"}
]},

{tipo:"quiz", titulo:"Você entendeu a história?", questoes:[
 {pergunta:"Who is the new student?", opcoes:["Emma","Anna","The teacher"], correta:1,
  explicacao:"A história começa assim: Anna is a new student."},
 {pergunta:"How is Anna in the morning?", opcoes:["She is sad.","She is happy.","She is ready."], correta:0,
  explicacao:"Anna is not happy. She is sad."},
 {pergunta:"Who is nice to Anna?", opcoes:["Emma","A boy","Her teacher"], correta:0,
  explicacao:"É a Emma que chega e diz good morning."},
 {pergunta:"Is Anna new at school?", opcoes:["Yes, she is.","No, she is not.","She is not here."], correta:0,
  explicacao:"Emma pergunta: Are you new here? E a Anna responde: Yes, I am."},
 {pergunta:"And now? How is Anna?", opcoes:["She is happy.","She is sad.","She is not here."], correta:0,
  explicacao:"No fim: Anna is happy! Ela ganhou uma amiga."}
]},

{tipo:"ditado", titulo:"Escute e escreva o que você ouviu na história", itens:[
 {en:"Anna is a new student", pt:"A Anna é uma aluna nova.", dica:"(cinco palavras)"},
 {en:"It is morning", pt:"É de manhã.", dica:"(três palavras)"},
 {en:"Are you new here", pt:"Você é nova aqui?", dica:"(quatro palavras)"},
 {en:"Emma is a new friend", pt:"A Emma é uma amiga nova.", dica:"(cinco palavras)"}
]},

{tipo:"escrita", titulo:"Responda sobre a história", id:"escuta",
 instrucao:"Responda em inglês, com frases completas:<br>1. Who is the new student? (Quem é a aluna nova?)<br>2. How is Anna in the morning? (Como a Anna está de manhã?)<br>3. Who is Anna's new friend? (Quem é a nova amiga da Anna?)",
 dica:"<ul><li>uma frase completa para cada pergunta</li><li>use <b>is</b> para falar da Anna e da Emma</li><li>não precisa copiar a história: escreva com as suas palavras</li></ul>",
 andaime:"<p>Comece assim: Anna is <span class=\"lacuna\">?</span>. · In the morning she is <span class=\"lacuna\">?</span>. · <span class=\"lacuna\">?</span> is her new friend.</p>",
 gabarito:"1. Anna is the new student. 2. She is sad. 3. Emma is her new friend.",
 instrucaoIA:"Ela ouviu uma historia curta e devia responder por escrito quem e a aluna nova (Anna), como a Anna esta de manha (sad) e quem e a nova amiga dela (Emma). Vocabulario: is, new, student, school, girl, friend, happy, sad, morning, here."},

{tipo:"completar", titulo:"Complete as frases", ajuda:"Nas duas últimas você digita o número por extenso.", itens:[
 {frase:"___ you happy?", pt:"Você está feliz?", resposta:"Are",
  opcoes:["Are","Am","Is"], explicacao:"Para perguntar com you, o are vai para a frente."},
 {frase:"Yes, I ___.", pt:"Sim, estou.", resposta:"am",
  opcoes:["am","are","is"], explicacao:"A resposta volta para o I am."},
 {frase:"No, I'm ___.", pt:"Não, não estou.", resposta:"not",
  opcoes:["not","no","am"], explicacao:"Para dizer não, entra o not: I'm not."},
 {frase:"You ___ my friend.", pt:"Você é minha amiga.", resposta:"are",
  opcoes:["are","am","is"], explicacao:"Com you é sempre are."},
 {frase:"14 = ___", pt:"quatorze", resposta:"fourteen"},
 {frase:"20 = ___", pt:"vinte", resposta:"twenty"}
]},

{tipo:"ordenar", titulo:"Monte as perguntas e as respostas", itens:[
 {frase:"Are you tired", pt:"Você está cansada?"},
 {frase:"You are my new friend", pt:"Você é minha amiga nova."},
 {frase:"No I am not hungry", pt:"Não, eu não estou com fome."},
 {frase:"Are you a new student", pt:"Você é uma aluna nova?"}
]},

{tipo:"adivinha", titulo:"O que é? Escreva em inglês", itens:[
 {pistas:["I am a number.","I am not ten.","I am 10 + 2."], resposta:"twelve", pt:"doze", dica:"(um número)",
  explicacao:"10 + 2 = twelve."},
 {pistas:["I am a number.","I am 10 + 10."], resposta:"twenty", pt:"vinte", dica:"(um número)",
  explicacao:"10 + 10 = twenty."},
 {pistas:["It is 10 at night.","You are not sad. You are not hungry.","It is not morning. Good night!"],
  resposta:"tired", pt:"cansada", dica:"(como você está)",
  explicacao:"Às 10 da noite todo mundo está tired!"},
 {pistas:["You are at school.","It is 12.","You are not thirsty."],
  resposta:"hungry", pt:"com fome", dica:"(como você está)",
  explicacao:"Meio-dia e você não está com sede... está com fome: hungry."}
]},

{tipo:"missao", titulo:"Missão: Yes or No com o Leo", cena:"jogo",
 cenario:"<p>O Leo inventou uma brincadeira no recreio: cada um faz perguntas e o outro só pode responder <b>Yes, I am</b> ou <b>No, I'm not</b>.</p><p>Ele <b>só entende inglês</b>. Faça as suas perguntas e responda as dele!</p>",
 personagem:"Leo, 11 anos, colega de turma, brincalhão e competitivo",
 objetivos:["cumprimentar o Leo antes de começar","fazer três perguntas começando com Are you...?","responder as perguntas dele com Yes, I am ou No, I'm not"],
 andaime:"<p>Se travar: <span class=\"lacuna\">Are you</span> …? · <span class=\"lacuna\">Yes, I</span> … · <span class=\"lacuna\">No, I'm</span> …</p>",
 instrucaoIA:"Ela sabe: I am, I'm, you are, Are you...?, Yes I am, No I'm not, happy, sad, tired, hungry, thirsty, ready, student, teacher, girl, boy, friend, class, number, here, new, from, os numeros de zero a twenty e os cumprimentos. Leo fala frases de 3 a 6 palavras. Ele responde as perguntas dela e faz perguntas do mesmo tipo (Are you tired? Are you a student? Are you happy?), uma de cada vez. Nao use nenhuma palavra fora dessa lista."},

{tipo:"escrita", titulo:"Hora de escrever: invente uma conversa", id:"1",
 instrucao:"Invente uma conversa entre <b>duas pessoas que acabaram de se conhecer</b>. Escreva <b>4 ou 5 falas</b> (uma por linha), colocando o nome de quem fala na frente. Podem ser pessoas, robôs, animais falantes — o que você quiser! ✍️",
 dica:"<ul><li>escolha os dois personagens e dê um nome a cada um</li><li>um cumprimento no começo</li><li>pelo menos uma pergunta com <b>Are you...?</b></li><li>pelo menos uma resposta com sim ou com não</li><li>uma despedida no fim</li></ul>Capriche: essa conversa é sua. 💜",
 gabarito:"4 ou 5 falas de dois personagens inventados, com nome na frente de cada fala. Precisa ter: um cumprimento, pelo menos uma pergunta Are you...?, uma resposta Yes, I am ou No, I'm not, e uma despedida. Criatividade conta mais que perfeicao.",
 instrucaoIA:"Ela devia INVENTAR uma conversa de 4 ou 5 falas entre dois personagens que acabaram de se conhecer. Vocabulario da aula: cumprimentos, What's your name?, My name is..., Nice to meet you, How are you?, I am / I'm, you are, Are you...?, Yes I am, No I'm not, happy, sad, tired, hungry, thirsty, ready, student, teacher, girl, boy, friend, class, numeros ate twenty. Elogie primeiro a ideia e a criatividade, depois corrija no maximo 3 coisas, em portugues. Se ela usou uma palavra que ainda nao aprendeu, diga que gostou da coragem e ensine a forma certa."},

{tipo:"fala", titulo:"Hora de falar",
 instrucao:"Ouça, repita em voz alta e teste no 🎤. Faça cara de pergunta na hora certa!",
 frases:[
  {en:"Are you happy?", pt:"Você está feliz?"},
  {en:"Yes, I am!", pt:"Sim, estou!"},
  {en:"Are you tired?", pt:"Você está cansada?"},
  {en:"No, I'm not.", pt:"Não, não estou."},
  {en:"Are you a student?", pt:"Você é aluna?"},
  {en:"You are my friend.", pt:"Você é minha amiga."}
 ],
 instrucaoIA:"Primeiro peca para ela repetir as frases acima e corrija a pronuncia em portugues (a voz sobe no fim da pergunta). Depois faca 4 a 6 perguntas em ingles, uma de cada vez, esperando a resposta FALADA dela: Are you happy today? / Are you tired? / Are you a student? / Are you hungry? / Are you ready? Peca que ela responda a frase inteira (Yes, I am / No, I'm not) e nao so yes ou no. Use so estas palavras: are, you, I am, not, happy, sad, tired, hungry, thirsty, ready, student, teacher, friend, new, here."},

{tipo:"quiz", bonus:true, titulo:"Detetive: o que dá para descobrir?", questoes:[
 {pergunta:"Emma is nice to Anna. Why is Anna happy now?", opcoes:["She is not a student.","She is a teacher.","Emma is her new friend."], correta:2,
  explicacao:"A história não diz isso com todas as letras, mas dá para concluir: ela ficou feliz porque agora tem uma amiga."},
 {pergunta:"Anna is new at school. Is Emma new, too?", opcoes:["No, Emma is not new.","Yes, Emma is new.","Emma is a teacher."], correta:0,
  explicacao:"Quem dá as boas-vindas é quem já está lá há um tempo. A Emma não é nova."},
 {pergunta:"Is Emma a student, too?", opcoes:["Yes, she is at school.","No, she is a teacher.","She is not here."], correta:0,
  explicacao:"Ela é uma girl que está na escola de manhã: é aluna também."}
]},

{tipo:"ordenar", bonus:true, titulo:"Frases grandes", itens:[
 {frase:"Are you a new student here", pt:"Você é uma aluna nova aqui?"},
 {frase:"I am not sad I am happy", pt:"Eu não estou triste, eu estou feliz."},
 {frase:"My new friend is in class ten", pt:"A minha amiga nova está na turma dez."}
]}

]});
</script>
</body>
</html>
