<script src="../../assets/curso.js"></script>
<script>
Curso.montar({
semana:7,
dia:3,
titulo:"Under, behind, between: where is it?",
subtitulo:"Dizer ONDE as coisas estão e perguntar Is there…?",
objetivos:[
  "Dizer onde as coisas estão com in, on, under, next to, behind, in front of e between",
  "Perguntar e responder Is there…? / Are there…?",
  "Inventar e escrever um lugar secreto na sua casa"
],
blocos:[

{tipo:"nota", titulo:"🔎 Onde está?",
 html:"<p>Ontem você aprendeu a dizer o que <b>tem</b> num cômodo: <code>There is a bed.</code> Hoje você vai dizer <b>onde</b> cada coisa está — em cima, embaixo, atrás, do lado…</p>"+
 "<p>A pergunta é <code>Where is the cat?</code> (Onde está o gato?) e a resposta começa com <code>It's</code>: <code>It's under the bed.</code> 🐈</p>"},

{tipo:"gramatica", titulo:"As palavras de lugar + Is there…?",
 html:"<table><tr><th>Inglês</th><th>Português</th><th>Exemplo</th></tr>"+
 "<tr><td><code>in</code></td><td>dentro de</td><td><code>The cat is in the box.</code></td></tr>"+
 "<tr><td><code>on</code></td><td>em cima de</td><td><code>The book is on the table.</code></td></tr>"+
 "<tr><td><code>under</code></td><td>embaixo de</td><td><code>The ball is under the bed.</code></td></tr>"+
 "<tr><td><code>next to</code></td><td>ao lado de</td><td><code>The lamp is next to the bed.</code></td></tr>"+
 "<tr><td><code>behind</code></td><td>atrás de</td><td><code>The dog is behind the door.</code></td></tr>"+
 "<tr><td><code>in front of</code></td><td>na frente de</td><td><code>The sofa is in front of the TV.</code></td></tr>"+
 "<tr><td><code>between</code></td><td>entre (duas coisas)</td><td><code>The desk is between the bed and the closet.</code></td></tr></table>"+
 "<p>⚠️ Em português a gente diz <b>“na mesa”</b> para tudo. Em inglês, depende: em cima da mesa é <code>on the table</code>; dentro da caixa é <code>in the box</code>.</p>"+
 "<p><b>Para perguntar se tem</b>, o <code>is</code> e o <code>are</code> pulam para a frente:</p>"+
 "<table><tr><th>Pergunta</th><th>Sim</th><th>Não</th></tr>"+
 "<tr><td><code>Is there a TV?</code></td><td><code>Yes, there is.</code></td><td><code>No, there isn't.</code></td></tr>"+
 "<tr><td><code>Are there two beds?</code></td><td><code>Yes, there are.</code></td><td><code>No, there aren't.</code></td></tr></table>",
 exemplos:[
  {en:"The cat is under the bed.", pt:"O gato está embaixo da cama."},
  {en:"The lamp is next to the bed.", pt:"O abajur está do lado da cama."},
  {en:"My backpack is behind the door.", pt:"A minha mochila está atrás da porta."},
  {en:"The sofa is in front of the TV.", pt:"O sofá fica na frente da TV."},
  {en:"The desk is between the bed and the closet.", pt:"A escrivaninha fica entre a cama e o guarda-roupa."},
  {en:"Is there a mirror in your bathroom? Yes, there is.", pt:"Tem espelho no seu banheiro? Tem, sim."},
  {en:"Are there toys in your room? No, there aren't.", pt:"Tem brinquedos no seu quarto? Não, não tem."}
 ]},

{tipo:"vocab", titulo:"Onde está? (e um segredo)", itens:[
 {en:"under", pt:"embaixo de", ipa:"/ÂN-der/", emoji:"⬇️"},
 {en:"next to", pt:"ao lado de, do lado de", ipa:"/NÉKST tu/", emoji:"↔️"},
 {en:"behind", pt:"atrás de", ipa:"/bi-RÁIND/", emoji:"🫣"},
 {en:"in front of", pt:"na frente de", ipa:"/in FRÂNT ov/", emoji:"⏩"},
 {en:"between", pt:"entre", ipa:"/bi-TUÍN/", emoji:"↕️"},
 {en:"toy", pt:"brinquedo", ipa:"/TÓI/", emoji:"🧸"},
 {en:"corner", pt:"canto, cantinho", ipa:"/KÓR-ner/", emoji:"📐"},
 {en:"find", pt:"achar, encontrar", ipa:"/FÁIND/", emoji:"🔍"},
 {en:"secret", pt:"secreto, segredo", ipa:"/SÍ-kret/", emoji:"🤫"}
]},

{tipo:"historia", titulo:"Ouça: a sala secreta do Jake", cena:"visita", paragrafos:[
 {en:"Today Leo visits his friend Jake. Jake's family has a new house.", pt:"Hoje o Leo visita o amigo dele, o Jake. A família do Jake tem uma casa nova."},
 {en:"Jake says, \"Come in! There is a secret room in my house. Find it!\"", pt:"O Jake diz: “Entra! Tem uma sala secreta na minha casa. Acha!”"},
 {en:"Leo looks behind the door and in the kitchen, next to the fridge. There is a cat, but no secret room.", pt:"O Leo olha atrás da porta e na cozinha, do lado da geladeira. Tem um gato, mas nada de sala secreta."},
 {en:"Leo goes upstairs. There are two bedrooms and a bathroom.", pt:"O Leo sobe. Tem dois quartos e um banheiro."},
 {en:"Is the room under the bed? No! There are toys under the bed.", pt:"A sala está embaixo da cama? Não! Embaixo da cama tem brinquedos."},
 {en:"Leo is tired. Jake says, \"Look under the stairs!\"", pt:"O Leo está cansado. O Jake diz: “Olha embaixo da escada!”"},
 {en:"There is a little door. Behind the door, there is a corner with books and pillows.", pt:"Tem uma portinha. Atrás da porta, tem um cantinho com livros e almofadas."},
 {en:"\"This is my secret room. I read here every day!\" says Jake. Leo loves it.", pt:"“Esta é a minha sala secreta. Eu leio aqui todo dia!”, diz o Jake. O Leo adora."}
]},

{tipo:"quiz", titulo:"Você entendeu a história?", questoes:[
 {pergunta:"Who visits Jake?", opcoes:["Anna.","Leo.","Ben."], correta:1,
  explicacao:"A história começa assim: Today Leo visits his friend Jake."},
 {pergunta:"What is next to the fridge?", opcoes:["A secret door.","A dog.","A cat."], correta:2,
  explicacao:"Na cozinha, do lado da geladeira: There is a cat, but no secret room."},
 {pergunta:"How many bedrooms are there upstairs?", opcoes:["Two.","Three.","One."], correta:0,
  explicacao:"Lá em cima: There are two bedrooms and a bathroom."},
 {pergunta:"What is under the bed?", opcoes:["Books.","Toys.","A cat."], correta:1,
  explicacao:"No! There are toys under the bed. Embaixo da cama tem brinquedos."},
 {pergunta:"Where is the secret room?", opcoes:["Under the stairs.","Behind the bed.","In the kitchen."], correta:0,
  explicacao:"O Jake diz: Look under the stairs! A portinha fica embaixo da escada."},
 {pergunta:"What does Jake do in the secret room?", opcoes:["He sleeps.","He reads.","He plays video games."], correta:1,
  explicacao:"Ele diz: I read here every day! E na sala tem livros e almofadas."}
]},

{tipo:"ditado", titulo:"Escute e escreva frases da história", itens:[
 {en:"Leo looks behind the door", pt:"O Leo olha atrás da porta.", dica:"(cinco palavras)"},
 {en:"There are toys under the bed", pt:"Embaixo da cama tem brinquedos.", dica:"(seis palavras)"},
 {en:"Look under the stairs", pt:"Olha embaixo da escada.", dica:"(quatro palavras)"},
 {en:"I read here every day", pt:"Eu leio aqui todo dia.", dica:"(cinco palavras)"}
]},

{tipo:"escrita", titulo:"Responda sobre a história", id:"escuta",
 instrucao:"Responda em inglês, com frases completas:<br>1. What is there in Jake's house? (O que tem de especial na casa do Jake?)<br>2. Where is the secret room? (Onde fica a sala secreta?)<br>3. What is there in the secret room? (O que tem na sala secreta?)",
 dica:"<ul><li>uma frase completa para cada pergunta</li><li>use <b>There is</b> ou <b>There are</b> nas perguntas 1 e 3</li><li>use uma palavra de lugar na pergunta 2</li></ul>",
 andaime:"<p>There is <span class=\"lacuna\">?</span> in Jake's house. · It is <span class=\"lacuna\">?</span> the stairs. · There <span class=\"lacuna\">?</span> books and <span class=\"lacuna\">?</span>.</p>",
 gabarito:"1. There is a secret room in Jake's house. 2. It is under the stairs (behind a little door). 3. There are books and pillows (it's a little corner).",
 instrucaoIA:"Ela ouviu a história do Leo procurando a sala secreta na casa nova do Jake e devia responder: o que tem de especial na casa (a secret room), onde ela fica (under the stairs, behind a little door) e o que tem lá dentro (books and pillows). Confira There is / There are e as palavras de lugar (under, behind, next to, in front of, between). Vocabulário: secret, room, stairs, door, corner, books, pillows, find."},

{tipo:"completar", titulo:"Onde está?", ajuda:"Olhe a tradução e toque na palavra que falta.", itens:[
 {frase:"The cat is ___ the bed.", pt:"O gato está embaixo da cama.", resposta:"under",
  opcoes:["under","on","between"], explicacao:"Embaixo de = under. On seria em cima da cama."},
 {frase:"The lamp is ___ the bed.", pt:"O abajur está do lado da cama.", resposta:"next to",
  opcoes:["next to","behind","in"], explicacao:"Do lado de = next to."},
 {frase:"My ball is ___ the sofa.", pt:"A minha bola está atrás do sofá.", resposta:"behind",
  opcoes:["behind","in front of","under"], explicacao:"Atrás de = behind. Na frente de seria in front of."},
 {frase:"My desk is ___ the bed and the window.", pt:"A minha escrivaninha fica entre a cama e a janela.", resposta:"between",
  opcoes:["between","next to","on"], explicacao:"Entre duas coisas = between ... and ..."},
 {frase:"The books are ___ the shelf.", pt:"Os livros estão na prateleira.", resposta:"on",
  opcoes:["on","in","under"], explicacao:"Em cima da prateleira = on. Em português é “na”, mas em inglês é on, porque estão em cima dela."},
 {frase:"___ there a mirror in your bathroom?", pt:"Tem espelho no seu banheiro?", resposta:"Is",
  opcoes:["Is","Are","Do"], explicacao:"Para perguntar, o is pula para a frente: Is there a mirror? Um espelho só, então is."}
]},

{tipo:"ordenar", titulo:"Monte as frases", itens:[
 {frase:"The cat is under the table", pt:"O gato está embaixo da mesa."},
 {frase:"Is there a lamp in your room", pt:"Tem abajur no seu quarto?"},
 {frase:"My backpack is behind the door", pt:"A minha mochila está atrás da porta."},
 {frase:"The sofa is in front of the TV", pt:"O sofá fica na frente da TV."}
]},

{tipo:"adivinha", titulo:"O que é? Escreva a resposta", itens:[
 {pistas:["It is in my bedroom, next to the bed.","It is big and tall.","It has two doors."],
  resposta:"closet", pt:"guarda-roupa", dica:"(um móvel)"},
 {pistas:["It is on my desk or next to my bed.","At night, I need it to read."],
  resposta:"lamp", pt:"abajur", dica:"(uma coisa da casa)"},
 {pistas:["It is a room.","There is a bathtub in it.","There is a mirror in it, too."],
  resposta:"bathroom", pt:"banheiro", dica:"(um cômodo)"},
 {pistas:["It is on the floor.","It is soft.","My cat sleeps on it."],
  resposta:"rug", pt:"tapete", dica:"(uma coisa da casa)"},
 {pistas:["Children love them.","There are a lot of them under Jake's bed."],
  resposta:"toys", aceita:["toy"], pt:"brinquedos", dica:"(da história)"}
]},

{tipo:"missao", titulo:"Missão: cadê as coisas do Leo?", cena:"objeto-perdido",
 cenario:"<p>O Leo dormiu na <b>sua</b> casa. São 7 horas, o ônibus da escola chega às 7:30 e o Leo <b>não acha</b> as coisas dele! Mas você conhece a sua casa e está vendo tudo:</p>"+
 "<p>🎒 a mochila está <b>embaixo da cama</b> do seu quarto · 📓 o caderno está <b>atrás do sofá</b> da sala · ✏️ o estojo está <b>entre a TV e o abajur</b>.</p>"+
 "<p>O Leo <b>só entende inglês</b>. Diga onde está cada coisa!</p>",
 personagem:"Leo, 11 anos, amigo da escola que dormiu na casa dela, atrasado e atrapalhado",
 objetivos:["dizer onde está a mochila (under ...)","dizer onde está o caderno (behind ...)","dizer onde está o estojo (between ... and ...)"],
 andaime:"<p>Se travar: <span class=\"lacuna\">It's under</span> the … · <span class=\"lacuna\">It's behind</span> the … · <span class=\"lacuna\">It's between</span> the … and the …</p>",
 instrucaoIA:"Ela sabe: under, next to, behind, in front of, between, in, on, Where is...? It's under the..., There is / There are, Is there...?, bed, sofa, TV, lamp, table, door, closet, shelf, living room, bedroom, kitchen, backpack, notebook, pencil case, Here it is! Fatos: Leo dormiu na casa dela e não conhece a casa. A backpack está under the bed (no quarto dela), o notebook está behind the sofa (na sala), o pencil case está between the TV and the lamp. Leo está desesperado e pergunta uma coisa por vez, em 3 a 6 palavras: Where is my backpack? / Is it in the kitchen? / Where is my notebook? Se ela disser só a palavra de lugar, ele pergunta Under the...? para ela completar. Quando acha cada coisa, ele diz Here it is! Thank you! A cena tem 6 a 8 falas."},

{tipo:"escrita", titulo:"Escrita livre: o seu lugar secreto", id:"1",
 instrucao:"A casa do Jake tem uma sala secreta. Agora imagine que a <b>sua</b> casa também tem um lugar secreto! Escreva <b>4 ou 5 frases</b> contando onde ele fica, o que tem lá dentro e o que você faz lá. Pode ser maluco: atrás da geladeira, embaixo do sofá, dentro do guarda-roupa…",
 dica:"<ul><li>onde fica o lugar secreto (com uma palavra de lugar: under, behind, next to, in front of, between)</li><li>o que tem lá dentro (com <b>There is</b> e <b>There are</b>)</li><li>o que você faz lá (uma ação: read, draw, sing, sleep, play…)</li><li>se alguém da família sabe do segredo, ou não</li></ul>Invente à vontade. 💜",
 gabarito:"4 ou 5 frases criativas: onde fica o lugar secreto (My secret room is behind the closet / under the stairs), o que tem lá (There is a little lamp. There are pillows and toys.), o que ela faz lá (I read / draw / play video games there every day) e quem sabe ou não do segredo (My mom doesn't know!). Vale qualquer ideia, desde que use palavras de lugar e There is / There are.",
 instrucaoIA:"Escrita livre e criativa: ela devia inventar um lugar secreto na casa dela, em 4 ou 5 frases: onde fica, o que tem lá dentro e o que ela faz lá. Elogie a imaginação primeiro. Vocabulário e gramática que ela tem: under, next to, behind, in front of, between, in, on, There is / There are / There isn't, Is there...?, secret, corner, toy, find, os cômodos (bedroom, kitchen, living room, garage, stairs) e os móveis (bed, sofa, closet, shelf, rug, lamp, pillow), e o verbo com -s (My brother doesn't know). Corrija: There is com uma coisa, There are com várias, a palavra de lugar certa (on = em cima, in = dentro)."},

{tipo:"fala", titulo:"Hora de falar",
 instrucao:"Ouça, repita em voz alta e teste no 🎤. Depois converse com a IA.",
 frases:[
  {en:"The cat is under the bed.", pt:"O gato está embaixo da cama."},
  {en:"The lamp is next to the bed.", pt:"O abajur está do lado da cama."},
  {en:"My backpack is behind the door.", pt:"A minha mochila está atrás da porta."},
  {en:"The sofa is in front of the TV.", pt:"O sofá fica na frente da TV."},
  {en:"Is there a secret room? Yes, there is!", pt:"Tem uma sala secreta? Tem, sim!"},
  {en:"There are toys under the bed.", pt:"Tem brinquedos embaixo da cama."}
 ],
 instrucaoIA:"Primeiro peça para ela repetir as frases acima e corrija a pronúncia em português, com atenção ao TH de there e the (língua entre os dentes), ao behind (o H é um sopro: bi-RÁIND, sem R carioca) e ao between (bi-TUÍN). Depois faça 4 a 6 perguntas em inglês, uma de cada vez, e espere ela responder falando: Where is the secret room in Jake's house? · What is there under the bed in the story? · Where is your bed? · What is there next to your bed? · Is there a TV in your living room? · Where is your backpack now? Corrija com carinho, em português, e elogie o que saiu bem."},

{tipo:"ligar", bonus:true, titulo:"Lugar, lugar, lugar: não confunda!", pares:[
 {en:"on", pt:"em cima de"},
 {en:"in", pt:"dentro de"},
 {en:"under", pt:"embaixo de"},
 {en:"behind", pt:"atrás de"},
 {en:"in front of", pt:"na frente de"},
 {en:"next to", pt:"ao lado de"},
 {en:"upstairs", pt:"lá em cima"},
 {en:"downstairs", pt:"lá embaixo"}
]},

{tipo:"escrita", bonus:true, titulo:"Desafio: o quarto maluco", id:"bonus",
 instrucao:"Invente o quarto <b>mais bagunçado do mundo</b> e descreva em <b>5 frases</b>, cada uma com uma palavra de lugar diferente. Exemplo de ideia: um gato dentro da geladeira, uma cama em cima do sofá…",
 dica:"<ul><li>5 frases, cada uma com uma palavra de lugar diferente (in, on, under, behind, next to, in front of, between)</li><li>use pelo menos uma vez <b>There is</b> e uma vez <b>There are</b></li><li>quanto mais maluco, melhor!</li></ul>",
 gabarito:"5 frases com cinco palavras de lugar diferentes, descrevendo coisas em lugares absurdos (The cat is in the fridge. There is a bed on the sofa. There are toys behind the mirror.), com pelo menos um There is e um There are.",
 instrucaoIA:"Desafio bônus: ela devia descrever um quarto maluco em 5 frases, cada uma com uma palavra de lugar diferente (in, on, under, behind, next to, in front of, between), usando There is e There are. Divirta-se com as ideias dela, confira se as cinco palavras de lugar são diferentes e se foram bem usadas, e corrija There is / There are."}

]});
</script>
