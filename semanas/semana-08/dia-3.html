<script>
Curso.montar({
semana:8,
dia:3,
titulo:"Is there any milk?",
subtitulo:"Some e any: o jeito de dizer \"um pouco\", \"nenhum\" e \"tem algum?\"",
objetivos:[
  "Usar some nas frases que afirmam (There is some milk)",
  "Usar any nas frases com não e nas perguntas (There aren't any eggs / Is there any juice?)",
  "Pedir e dizer quantidades: a glass of, a piece of, a bowl of"
],
blocos:[

{tipo:"nota", titulo:"🥛 Tem leite? Tem ovo?",
 html:"<p>Ontem você viu que a comida se divide em dois times: a que dá para contar (<code>apples</code>) e a que não dá (<code>milk</code>). Hoje vem a palavrinha que funciona com os dois times: <code>some</code> e a irmã dela, <code>any</code>.</p>"+
 "<p>Elas aparecem o tempo todo na cozinha, junto com o <code>there is / there are</code> da semana passada. 🍳</p>"},

{tipo:"gramatica", titulo:"Some e any",
 html:"<p><code>some</code> e <code>any</code> querem dizer <b>um pouco de, uns, umas, algum</b>. A diferença é o tipo de frase:</p>"+
 "<table><tr><th>Frase</th><th>Use</th><th>Exemplo</th></tr>"+
 "<tr><td>Afirmando ✅</td><td><code>some</code></td><td><code>There is some milk.</code> (Tem leite.)</td></tr>"+
 "<tr><td>Com não ❌</td><td><code>any</code></td><td><code>There aren't any eggs.</code> (Não tem nenhum ovo.)</td></tr>"+
 "<tr><td>Perguntando ❓</td><td><code>any</code></td><td><code>Is there any juice?</code> (Tem suco?)</td></tr></table>"+
 "<p>Funciona com os dois times: <code>some milk</code> (não dá para contar) e <code>some apples</code> (dá para contar, no plural). Com uma coisa só, continua <code>a</code> / <code>an</code>: <code>an apple</code>.</p>"+
 "<p>Um truque: para <b>oferecer</b> alguma coisa, mesmo sendo pergunta, a gente usa <code>some</code>: <code>Do you want some juice?</code> — porque você espera um <i>sim</i>. 😉</p>"+
 "<p>E para medir o que não dá para contar: <code>a glass of water</code> (um copo de água), <code>a piece of cake</code> (um pedaço de bolo), <code>a bowl of soup</code> (uma tigela de sopa), <code>a bottle of juice</code> (uma garrafa de suco).</p>",
 exemplos:[
  {en:"There is some cheese on the table.", pt:"Tem queijo na mesa."},
  {en:"I have some strawberries.", pt:"Eu tenho uns morangos."},
  {en:"There isn't any bread.", pt:"Não tem pão."},
  {en:"We don't have any eggs.", pt:"A gente não tem nenhum ovo."},
  {en:"Are there any apples in the basket?", pt:"Tem maçã na cesta?"},
  {en:"Do you want some lemonade?", pt:"Você quer limonada?"},
  {en:"Can I have a glass of water, please?", pt:"Posso tomar um copo de água, por favor?"}
 ]},

{tipo:"vocab", titulo:"Na cozinha e no piquenique", itens:[
 {en:"some", pt:"um pouco de, uns, umas (frase que afirma)", ipa:"/SÂM/", emoji:"➕"},
 {en:"any", pt:"algum, nenhum (frase com não ou pergunta)", ipa:"/É-ni/", emoji:"❓"},
 {en:"a glass of", pt:"um copo de", ipa:"/a GLÉS ov/", emoji:"🥛"},
 {en:"a piece of", pt:"um pedaço de", ipa:"/a PÍIS ov/", emoji:"🍰"},
 {en:"a bowl of", pt:"uma tigela de", ipa:"/a BÔUL ov/", emoji:"🥣"},
 {en:"a bottle of", pt:"uma garrafa de", ipa:"/a BÓ-tol ov/", emoji:"🍾"},
 {en:"pancake", pt:"panqueca", ipa:"/PÉN-keik/", emoji:"🥞"},
 {en:"flour", pt:"farinha", ipa:"/FLÁU-er/", emoji:"🌾"},
 {en:"picnic", pt:"piquenique", ipa:"/PÍK-nik/", emoji:"🧺"},
 {en:"basket", pt:"cesta", ipa:"/BÉS-ket/", emoji:"🧺"}
]},

{tipo:"historia", titulo:"Ouça: as panquecas do Max", cena:"cozinha", paragrafos:[
 {en:"It's Sunday morning. Max wants to make pancakes for his mom. It's her birthday!", pt:"É domingo de manhã. O Max quer fazer panquecas para a mãe dele. É o aniversário dela!"},
 {en:"He goes to the kitchen. There is some flour. There is some milk in the fridge.", pt:"Ele vai para a cozinha. Tem farinha. Tem leite na geladeira."},
 {en:"But there aren't any eggs! \"Oh no!\" Max says.", pt:"Mas não tem nenhum ovo! \"Ah, não!\", diz o Max."},
 {en:"His sister Nina has an idea. \"Mrs. Green has a lot of eggs!\"", pt:"A irmã dele, a Nina, tem uma ideia. \"A Mrs. Green tem um monte de ovos!\""},
 {en:"Mrs. Green is their neighbor. Max goes to her house.", pt:"A Mrs. Green é a vizinha deles. O Max vai até a casa dela."},
 {en:"\"Good morning, Mrs. Green! Do you have any eggs, please?\" \"Yes, I do! Here you are. Three eggs!\"", pt:"\"Bom dia, Mrs. Green! A senhora tem ovos, por favor?\" \"Tenho, sim! Aqui está. Três ovos!\""},
 {en:"Max and Nina make ten pancakes. There is some honey on the table, too.", pt:"O Max e a Nina fazem dez panquecas. Tem mel na mesa também."},
 {en:"Mom comes to the kitchen. \"Happy birthday, Mom!\" She eats a pancake. \"It's delicious!\"", pt:"A mãe chega na cozinha. \"Feliz aniversário, mãe!\" Ela come uma panqueca. \"Está uma delícia!\""}
]},

{tipo:"quiz", titulo:"Você entendeu a história?", questoes:[
 {pergunta:"What does Max want to make?", opcoes:["a cake","pancakes","pizza"], correta:1,
  explicacao:"Logo no começo: Max wants to make pancakes for his mom."},
 {pergunta:"Why does Max want to make pancakes?", opcoes:["He is hungry.","It's his mom's birthday.","Nina is sad."], correta:1,
  explicacao:"As panquecas são para a mãe: It's her birthday!"},
 {pergunta:"What is in the fridge?", opcoes:["eggs","juice","milk"], correta:2,
  explicacao:"There is some milk in the fridge. Os ovos é que faltam."},
 {pergunta:"Who has a lot of eggs?", opcoes:["Nina","Mrs. Green","Mom"], correta:1,
  explicacao:"A Nina tem a ideia: Mrs. Green has a lot of eggs! A Mrs. Green é a vizinha."},
 {pergunta:"How many pancakes do Max and Nina make?", opcoes:["three","ten","two"], correta:1,
  explicacao:"Max and Nina make ten pancakes. Three é o número de ovos que a vizinha dá."}
]},

{tipo:"ditado", titulo:"Escute e escreva frases da história", itens:[
 {en:"There aren't any eggs", pt:"Não tem nenhum ovo.", dica:"(quatro palavras: a segunda tem apóstrofo)"},
 {en:"Do you have any eggs", pt:"Você tem ovos?", dica:"(cinco palavras)"},
 {en:"Happy birthday, Mom", pt:"Feliz aniversário, mãe.", dica:"(três palavras)"}
]},

{tipo:"escrita", titulo:"Responda sobre a história", id:"escuta",
 instrucao:"Responda em inglês, com frases completas:<br>1. What is the problem in the kitchen? (Qual é o problema na cozinha?)<br>2. Who is Mrs. Green? (Quem é a Mrs. Green?)<br>3. Does Mom like the pancakes? (A mãe gosta das panquecas?)",
 dica:"<ul><li>uma frase completa para cada pergunta</li><li>na 1, use <b>any</b></li><li>na 3, responda e diga o que a mãe fala</li></ul>",
 andaime:"<p>There aren't <span class=\"lacuna\">?</span>. · She is Max's <span class=\"lacuna\">?</span>. · Yes, she <span class=\"lacuna\">?</span>. She says <span class=\"lacuna\">?</span></p>",
 gabarito:"1. There aren't any eggs. 2. She is Max's neighbor (she has a lot of eggs). 3. Yes, she does. She says: It's delicious!",
 instrucaoIA:"Ela ouviu a história do Max, que quer fazer panquecas para o aniversário da mãe, mas não tem ovos; a vizinha Mrs. Green dá três ovos, eles fazem dez panquecas e a mãe diz It's delicious! Ela devia responder: o problema (There aren't any eggs), quem é a Mrs. Green (Max's neighbor) e se a mãe gosta (Yes, she does — It's delicious!). Confira o any com not, o possessivo Max's e o does."},

{tipo:"completar", titulo:"Some ou any?", ajuda:"Toque na palavra que falta. Pense: a frase afirma, nega ou pergunta?", itens:[
 {frase:"There is ___ milk in the fridge.", pt:"Tem leite na geladeira.", resposta:"some",
  opcoes:["some","any","a"], explicacao:"A frase afirma (tem), então é some. a não serve: leite não dá para contar."},
 {frase:"There aren't ___ eggs.", pt:"Não tem nenhum ovo.", resposta:"any",
  opcoes:["any","some","an"], explicacao:"Tem o não (aren't), então é any."},
 {frase:"Is there ___ juice?", pt:"Tem suco?", resposta:"any",
  opcoes:["any","some","a"], explicacao:"É uma pergunta (e não é oferecendo nada), então é any."},
 {frase:"We don't have ___ bread.", pt:"A gente não tem pão.", resposta:"any",
  opcoes:["any","some","a"], explicacao:"Com don't, a frase nega: any."},
 {frase:"I want a ___ of water, please.", pt:"Eu quero um copo de água, por favor.", resposta:"glass",
  opcoes:["glass","piece","bowl"], explicacao:"a glass of = um copo de. a piece of é pedaço (de bolo), a bowl of é tigela (de sopa)."},
 {frase:"Are there any apples in the basket? Yes, there ___.", pt:"Tem maçã na cesta? Tem, sim.", resposta:"are",
  opcoes:["are","is","do"], explicacao:"Da semana passada: Are there...? responde com Yes, there are."}
]},

{tipo:"ordenar", titulo:"Monte as frases", itens:[
 {frase:"There is some cheese on the table", pt:"Tem queijo na mesa."},
 {frase:"Are there any tomatoes", pt:"Tem tomate?"},
 {frase:"I don't want any soup", pt:"Eu não quero sopa nenhuma."},
 {frase:"Max has a bowl of cereal", pt:"O Max tem uma tigela de cereal."}
]},

{tipo:"adivinha", titulo:"O que é? Escreva a resposta", itens:[
 {pistas:["It is a vegetable.","It is orange and long.","I eat it in salad or in soup."],
  resposta:"carrot", pt:"cenoura", dica:"(um legume)"},
 {pistas:["It is long and yellow.","I eat it with tomatoes and cheese.","It is not rice."],
  resposta:"pasta", pt:"macarrão", dica:"(uma comida)"},
 {pistas:["It is not a fruit.","It is yellow or brown.","I eat it with yogurt or with pancakes."],
  resposta:"honey", pt:"mel", dica:"(uma comida)"},
 {pistas:["It is not food.","It is in the park, with friends.","There is a basket with a lot of food."],
  resposta:"picnic", pt:"piquenique", dica:"(um passeio)"}
]},

{tipo:"missao", titulo:"Missão: o piquenique com a Mia", cena:"planejamento",
 cenario:"<p>A <b>Mia</b>, sua amiga da aula de natação, convidou você para um <b>piquenique no parque</b> no sábado. Ela está ligando para combinar quem leva o quê. Ela <b>só entende inglês</b>. Descubra o que ela tem em casa e combine a comida e a bebida.</p>",
 personagem:"Mia, 11 anos, sua amiga da aula de natação, animada e meio esquecida",
 voz:"f",
 objetivos:["perguntar à Mia se ela tem alguma coisa para o piquenique (Do you have any...?)","dizer duas coisas que você leva (I have some...)","combinar com a Mia o que vocês vão beber"],
 andaime:"<p>Se travar: <span class=\"lacuna\">Do you have any</span> …? · <span class=\"lacuna\">I have some</span> … · <span class=\"lacuna\">Is there any</span> …?</p>",
 instrucaoIA:"Ela sabe: some e any (some ao afirmar, any com not e em perguntas), There is / There are, Is there any...? Do you have any...? I have some..., a glass of, a piece of, a bowl of, a bottle of, picnic, basket, park, Saturday, food, fruit, apple, banana, strawberry, cheese, sandwich, cookie, cake, pizza, chicken, salad, popcorn, water, juice, lemonade, soda, milk, Yes, please. No, thanks. It's delicious! Mia tem em casa: a basket, some sandwiches e some apples. Ela NÃO tem nenhuma bebida (There isn't any juice. There isn't any water!) e pergunta o que a aluna tem. Mia não gosta de soda. Frases de 3 a 6 palavras. Até 8 falas."},

{tipo:"escrita", titulo:"Hora de criar", id:"1",
 instrucao:"Escrita livre! Escreva <b>4 ou 5 frases</b> e escolha uma destas ideias:<br>🥞 <b>A)</b> Invente a conversa do Max com a Mrs. Green na porta da casa dela (quem fala o quê).<br>🧊 <b>B)</b> Descreva a <b>geladeira mais maluca do mundo</b>: o que tem e o que não tem dentro dela.",
 dica:"<ul><li>4 ou 5 frases</li><li>pelo menos uma frase com <b>some</b></li><li>pelo menos uma frase com <b>any</b> (com não ou numa pergunta)</li><li>comidas desta semana</li><li>na ideia A, os nomes antes de cada fala (Max: … / Mrs. Green: …)</li></ul>Capriche na imaginação! 💜",
 gabarito:"Texto criativo de 4 ou 5 frases. Na ideia A, um diálogo com falas do Max e da Mrs. Green (cumprimentar, pedir ovos com Do you have any eggs?, Here you are, agradecer, talvez convidar para as panquecas). Na ideia B, uma geladeira maluca com There is some... / There are some... e There isn't any... / There aren't any... Precisa ter some e any usados certo e comidas da semana.",
 instrucaoIA:"Escrita livre e criativa: ela escolheu entre (A) inventar a conversa do Max com a vizinha Mrs. Green, pedindo ovos para as panquecas, ou (B) descrever a geladeira mais maluca do mundo. 4 ou 5 frases. Confira some em frases afirmativas e any em frases com not e em perguntas (exceto ao oferecer: Do you want some...?), there is / there are, a forma sem -s das comidas que não dá para contar (milk, cheese, honey, flour) e o -s das que dá (eggs, apples). Valorize a criatividade e as ideias engraçadas. Vocabulário: some, any, a glass of, a piece of, a bowl of, a bottle of, pancake, flour, picnic, basket e as comidas da semana."},

{tipo:"fala", titulo:"Hora de falar",
 instrucao:"Ouça, repita em voz alta e teste no 🎤. Depois converse com a IA sobre a história.",
 frases:[
  {en:"There is some milk in the fridge.", pt:"Tem leite na geladeira."},
  {en:"There aren't any eggs.", pt:"Não tem nenhum ovo."},
  {en:"Do you have any eggs, please?", pt:"Você tem ovos, por favor?"},

 ],
 instrucaoIA:"Primeiro peça para ela repetir as frases acima e corrija a pronúncia em português, com atenção ao som de some (SÂM, boca relaxada, não SÔME) e any (É-ni). Depois faça 4 a 6 perguntas em inglês sobre a história do Max e sobre ela, uma de cada vez, e espere ela responder falando: What does Max want to make? · Are there any eggs in the kitchen? · Who has eggs? · How many pancakes do they make? · Is there any milk in your fridge? · Do you like pancakes with honey? Corrija com carinho, em português, e elogie o que saiu bem."},

{tipo:"texto", bonus:true, titulo:"Leitura esticada: a receita do Max", paragrafos:[
 {en:"Max's pancakes: for ten pancakes, you need two eggs, a glass of milk and a bowl of flour.", pt:"As panquecas do Max: para dez panquecas, você precisa de dois ovos, um copo de leite e uma tigela de farinha."},
 {en:"Put the eggs and the milk in a big bowl.", pt:"Coloque os ovos e o leite numa tigela grande."},

 {en:"Cook the pancakes in a pan.", pt:"Cozinhe as panquecas numa frigideira. (pan = frigideira)"},
 {en:"Eat them with honey or with some strawberries. Yummy!", pt:"Coma com mel ou com uns morangos. Que delícia! (yummy = gostoso, delícia)"}
]},
{tipo:"ligar", bonus:true, titulo:"Ligue as palavras da receita", pares:[

 {en:"need", pt:"precisar"},

 {en:"bowl", pt:"tigela"},

]}

]});
